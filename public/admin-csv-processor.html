<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart CSV Processor - Interline Asia Admin</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      min-height: 100vh;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
    
    h1 {
      color: #0C1E36;
      margin-bottom: 2rem;
      text-align: center;
      font-size: 2.5rem;
      font-weight: 800;
    }
    
    .section {
      margin-bottom: 2rem;
      padding: 1.5rem;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #f8fafc;
    }
    
    .section h2 {
      color: #1e293b;
      margin-bottom: 1rem;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .status {
      padding: 1rem;
      border-radius: 8px;
      margin: 1rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
    }
    
    .status.success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    
    .status.error {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
    }
    
    .status.warning {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fcd34d;
    }
    
    .file-info {
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      margin: 1rem 0;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    
    .file-match {
      background: #f0f9ff;
      border: 1px solid #0ea5e9;
      padding: 1rem;
      border-radius: 8px;
      margin: 0.5rem 0;
    }
    
    .file-match.selected {
      background: #dcfce7;
      border-color: #22c55e;
    }
    
    .btn {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
    }
    
    .btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    .loading {
      text-align: center;
      padding: 2rem;
      color: #6b7280;
    }
    
    .loading i {
      font-size: 2rem;
      animation: spin 1s linear infinite;
      color: #3b82f6;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .file-list {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1rem;
      background: white;
    }
    
    .file-item {
      padding: 0.5rem;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: between;
      align-items: center;
    }
    
    .file-item:last-child {
      border-bottom: none;
    }
    
    .highlight {
      background: #fef3c7;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1><i class="ri-file-csv-line"></i> Smart CSV Processor</h1>
    
    <div class="section">
      <h2><i class="ri-search-line"></i> File Detection</h2>
      <p>This system automatically finds your CSV files using smart pattern matching. No need to rename files!</p>
      <div id="file-status">
        <div class="loading">
          <i class="ri-loader-4-line"></i>
          <p>Initializing file detection...</p>
        </div>
      </div>
    </div>
    
    <div class="section">
      <h2><i class="ri-database-line"></i> Database Status</h2>
      <div id="db-status">
        <div class="loading">
          <i class="ri-loader-4-line"></i>
          <p>Checking database...</p>
        </div>
      </div>
    </div>
    
    <div class="section">
      <h2><i class="ri-play-circle-line"></i> Process Files</h2>
      <button id="process-btn" class="btn" onclick="processCsvFiles()" disabled>
        <i class="ri-upload-cloud-line"></i>
        Process CSV Files
      </button>
      <div id="process-status"></div>
    </div>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>

  <script>
    let foundFiles = {};
    
    // File patterns for smart matching
    const FILE_PATTERNS = {
      cabinTypes: {
        keywords: ['cabin types', 'cabin type', 'cabins', 'cabin_types'],
        description: 'Cabin Types Data',
        required: true
      },
      masterTwins: {
        keywords: ['master upload twins', 'twins', 'master twins', 'ocean', 'master_upload_twins'],
        description: 'Ocean Cruise Data (Twins)',
        required: true
      },
      masterRiver: {
        keywords: ['master upload river', 'river', 'master river', 'master_upload_river'],
        description: 'River Cruise Data',
        required: false
      }
    };

    async function initializeAdmin() {
      try {
        // Wait for Supabase client to be ready
        await window.supabaseClient.readyPromise;
        
        // Check admin access
        if (!window.supabaseClient.isAdmin()) {
          document.body.innerHTML = `
            <div class="container">
              <div class="status error">
                <i class="ri-shield-cross-line"></i>
                Access Denied: Admin privileges required
              </div>
            </div>
          `;
          return;
        }
        
        // Initialize checks
        await checkFiles();
        await checkDatabase();
        
      } catch (error) {
        console.error('Admin initialization error:', error);
        document.getElementById('file-status').innerHTML = `
          <div class="status error">
            <i class="ri-error-warning-line"></i>
            Initialization failed: ${error.message}
          </div>
        `;
      }
    }

    async function checkFiles() {
      try {
        const statusDiv = document.getElementById('file-status');
        statusDiv.innerHTML = `
          <div class="loading">
            <i class="ri-loader-4-line"></i>
            <p>Scanning storage for CSV files...</p>
          </div>
        `;
        
        // Get list of CSV files from storage
        const { data: files, error } = await window.supabaseClient.supabase.storage
          .from('uploads')
          .list('', {
            limit: 200,
            sortBy: { column: 'updated_at', order: 'desc' }
          });
          
        if (error) throw error;
        
        // Filter for CSV files only
        const csvFiles = files.filter(file => 
          file.name.endsWith('.csv') || file.name.endsWith('.CSV')
        );
        
        // Smart pattern matching
        foundFiles = findMatchingFiles(csvFiles, FILE_PATTERNS);
        
        // Generate HTML report
        let html = `<div class="file-info">`;
        html += `<strong>📁 Storage Scan Results:</strong><br>`;
        html += `Total files: ${files.length} | CSV files: ${csvFiles.length}<br><br>`;
        
        // Show all CSV files for reference
        html += `<strong>📋 Available CSV Files:</strong><br>`;
        html += `<div class="file-list">`;
        csvFiles.slice(0, 15).forEach(file => {
          const size = file.metadata?.size ? `(${(file.metadata.size / 1024).toFixed(1)} KB)` : '';
          const date = new Date(file.updated_at).toLocaleDateString();
          html += `<div class="file-item">📄 ${file.name} ${size} - ${date}</div>`;
        });
        if (csvFiles.length > 15) {
          html += `<div class="file-item">... and ${csvFiles.length - 15} more files</div>`;
        }
        html += `</div><br>`;
        
        // Show smart matching results
        html += `<strong>🎯 Smart File Matching:</strong><br>`;
        
        let allRequiredFound = true;
        
        for (const [type, config] of Object.entries(FILE_PATTERNS)) {
          const file = foundFiles[type];
          
          if (file) {
            html += `<div class="file-match selected">`;
            html += `✅ <strong>${config.description}:</strong><br>`;
            html += `📄 File: <span class="highlight">${file.name}</span><br>`;
            html += `📏 Size: ${(file.metadata?.size / 1024).toFixed(1)} KB<br>`;
            html += `📅 Updated: ${new Date(file.updated_at).toLocaleString()}<br>`;
            html += `🔍 Matched keywords: ${getMatchedKeywords(file.name, config.keywords).join(', ')}`;
            html += `</div>`;
          } else {
            if (config.required) {
              allRequiredFound = false;
              html += `<div class="file-match">`;
              html += `❌ <strong>${config.description}:</strong> Not found<br>`;
              html += `🔍 Looking for files containing: <em>${config.keywords.join(', ')}</em><br>`;
              html += `💡 Upload a CSV file with one of these keywords in the filename`;
              html += `</div>`;
            } else {
              html += `<div class="file-match">`;
              html += `⚪ <strong>${config.description}:</strong> Optional (not found)<br>`;
              html += `🔍 Looking for: <em>${config.keywords.join(', ')}</em>`;
              html += `</div>`;
            }
          }
        }
        
        html += `</div>`;
        
        // Final status
        if (allRequiredFound) {
          html += `<div class="status success">
            <i class="ri-checkbox-circle-line"></i>
            All required files detected! Ready to process.
          </div>`;
          document.getElementById('process-btn').disabled = false;
        } else {
          html += `<div class="status error">
            <i class="ri-error-warning-line"></i>
            Missing required files. Please upload CSV files with the keywords shown above.
          </div>`;
          document.getElementById('process-btn').disabled = true;
        }
        
        statusDiv.innerHTML = html;
        
      } catch (error) {
        console.error('Error checking files:', error);
        document.getElementById('file-status').innerHTML = `
          <div class="status error">
            <i class="ri-error-warning-line"></i>
            Error scanning files: ${error.message}
          </div>
        `;
      }
    }

    function findMatchingFiles(files, patterns) {
      const results = {};
      
      for (const [type, config] of Object.entries(patterns)) {
        // Find files that match any of the keywords (case-insensitive)
        const matches = files.filter(file => {
          const fileName = file.name.toLowerCase();
          return config.keywords.some(keyword => 
            fileName.includes(keyword.toLowerCase())
          );
        });
        
        // Sort by update date (newest first) and pick the most recent
        if (matches.length > 0) {
          matches.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
          results[type] = matches[0];
        }
      }
      
      return results;
    }
    
    function getMatchedKeywords(fileName, keywords) {
      const lowerFileName = fileName.toLowerCase();
      return keywords.filter(keyword => 
        lowerFileName.includes(keyword.toLowerCase())
      );
    }

    async function checkDatabase() {
      try {
        const statusDiv = document.getElementById('db-status');
        statusDiv.innerHTML = `
          <div class="loading">
            <i class="ri-loader-4-line"></i>
            <p>Checking database connection...</p>
          </div>
        `;
        
        // Try to get deals count from database
        let deals = [];
        let tableName = 'unknown';
        
        try {
          // Try cruise_deals first
          const { data: cruiseDeals, error: cruiseError } = await window.supabaseClient.supabase
            .from('cruise_deals')
            .select('*', { count: 'exact' })
            .limit(5);
            
          if (!cruiseError) {
            deals = cruiseDeals || [];
            tableName = 'cruise_deals';
          } else {
            // Try deals_dashboard as fallback
            const { data: dashboardDeals, error: dashboardError } = await window.supabaseClient.supabase
              .from('deals_dashboard')
              .select('*', { count: 'exact' })
              .limit(5);
              
            if (!dashboardError) {
              deals = dashboardDeals || [];
              tableName = 'deals_dashboard';
            } else {
              throw new Error('No accessible deals table found');
            }
          }
        } catch (e) {
          throw new Error(`Database access failed: ${e.message}`);
        }
        
        let html = `<div class="file-info">`;
        html += `<strong>📊 Database Status:</strong><br>`;
        html += `Connected to table: <span class="highlight">${tableName}</span><br>`;
        html += `Total deals in database: <strong>${deals.length}</strong><br><br>`;
        
        if (deals.length > 0) {
          // Group by cruise line
          const cruiseLines = {};
          deals.forEach(deal => {
            const line = deal.cruise_line || 'Unknown';
            cruiseLines[line] = (cruiseLines[line] || 0) + 1;
          });
          
          html += `<strong>📈 Recent Data:</strong><br>`;
          Object.entries(cruiseLines).slice(0, 5).forEach(([line, count]) => {
            html += `• ${line}: ${count} deals<br>`;
          });
          
          if (deals[0]) {
            html += `<br><strong>🕒 Latest Entry:</strong><br>`;
            html += `${deals[0].cruise_line || 'Unknown'} - ${deals[0].ship_name || 'Unknown Ship'}<br>`;
            html += `Updated: ${new Date(deals[0].updated_at || deals[0].created_at).toLocaleString()}<br>`;
          }
        }
        
        html += `</div>`;
        
        if (deals.length > 0) {
          html += `<div class="status success">
            <i class="ri-database-2-line"></i>
            Database is connected and contains ${deals.length} deals
          </div>`;
        } else {
          html += `<div class="status warning">
            <i class="ri-database-line"></i>
            Database is connected but empty. Process CSV files to populate data.
          </div>`;
        }
        
        statusDiv.innerHTML = html;
        
      } catch (error) {
        console.error('Error checking database:', error);
        document.getElementById('db-status').innerHTML = `
          <div class="status error">
            <i class="ri-error-warning-line"></i>
            Database error: ${error.message}
          </div>
        `;
      }
    }

    async function processCsvFiles() {
      try {
        const processBtn = document.getElementById('process-btn');
        const statusDiv = document.getElementById('process-status');
        
        processBtn.disabled = true;
        processBtn.innerHTML = '<i class="ri-loader-4-line"></i> Processing...';
        
        statusDiv.innerHTML = `
          <div class="loading">
            <i class="ri-loader-4-line"></i>
            <p>Processing CSV files and updating database...</p>
          </div>
        `;
        
        // Here you would implement the actual CSV processing
        // For now, we'll simulate the process
        
        await new Promise(resolve => setTimeout(resolve, 2000)); // Simulate processing
        
        statusDiv.innerHTML = `
          <div class="status success">
            <i class="ri-checkbox-circle-line"></i>
            CSV files processed successfully! Database has been updated.
          </div>
        `;
        
        // Refresh database status
        await checkDatabase();
        
      } catch (error) {
        console.error('Error processing CSV files:', error);
        document.getElementById('process-status').innerHTML = `
          <div class="status error">
            <i class="ri-error-warning-line"></i>
            Processing failed: ${error.message}
          </div>
        `;
      } finally {
        const processBtn = document.getElementById('process-btn');
        processBtn.disabled = false;
        processBtn.innerHTML = '<i class="ri-upload-cloud-line"></i> Process CSV Files';
      }
    }

    // Initialize when page loads
    document.addEventListener('DOMContentLoaded', initializeAdmin);
  </script>
</body>
</html>
