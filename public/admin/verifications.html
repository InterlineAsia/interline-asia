<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - User Verifications | Interline Asia</title>
    <meta name="description" content="Admin panel for managing user verifications - Interline Asia">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="/css/complete-redesign.css">
    <link rel="stylesheet" href="/css/affiliate-tools.css">
    <link rel="stylesheet" href="/css/social-media.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
    <!-- Navigation -->
    <nav class="main-nav">
        <div class="nav-container">
            <div class="nav-brand">
                <div class="brand-icon">IA</div>
                <div class="brand-text">
                    <span class="brand-name">Interline Asia</span>
                    <span class="brand-subtitle">Admin Panel</span>
                </div>
            </div>
            
            <div class="nav-menu">
                <a href="/admin" class="nav-link">Dashboard</a>
                <a href="/admin/verifications.html" class="nav-link active">Verifications</a>
                <a href="/admin/bookings.html" class="nav-link">Bookings</a>
                <button id="admin-logout-btn" class="nav-cta">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Admin Content -->
    <main class="admin-main">
        <div class="admin-container">
            <!-- Header -->
            <div class="admin-header">
                <div class="header-content">
                    <h1>User Verifications</h1>
                    <p>Review and manage user verification requests</p>
                </div>
                <div class="header-stats">
                    <div class="stat-item">
                        <span class="stat-number" id="pending-count">0</span>
                        <span class="stat-label">Pending</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number" id="verified-count">0</span>
                        <span class="stat-label">Verified</span>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="admin-filters">
                <div class="filter-group">
                    <label for="status-filter">Status:</label>
                    <select id="status-filter">
                        <option value="all">All Users</option>
                        <option value="pending" selected>Pending Verification</option>
                        <option value="verified">Verified</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="search-filter">Search:</label>
                    <input type="text" id="search-filter" placeholder="Search by name or email...">
                </div>
                <button id="refresh-btn" class="btn btn-secondary">
                    <i class="ri-refresh-line"></i>
                    Refresh
                </button>
            </div>

            <!-- Verification List -->
            <div class="verifications-container">
                <div class="loading-state" id="loading-state">
                    <i class="ri-loader-4-line"></i>
                    <p>Loading verification requests...</p>
                </div>
                
                <div class="verifications-list" id="verifications-list" style="display: none;">
                    <!-- Verification items will be populated here -->
                </div>
                
                <div class="empty-state" id="empty-state" style="display: none;">
                    <i class="ri-user-search-line"></i>
                    <h3>No Verification Requests</h3>
                    <p>All users are verified or no requests match your filters</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Verification Modal -->
    <div class="modal-overlay" id="verification-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>User Verification Details</h3>
                <button class="modal-close" id="close-modal">
                    <i class="ri-close-line"></i>
                </button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- User details will be populated here -->
            </div>
            <div class="modal-actions">
                <button id="verify-user-btn" class="btn btn-success">
                    <i class="ri-check-line"></i>
                    Verify User
                </button>
                <button id="reject-user-btn" class="btn btn-danger">
                    <i class="ri-close-line"></i>
                    Reject
                </button>
                <button id="cancel-modal-btn" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="/js/error-handler.js"></script>
    <script src="/js/input-validator.js"></script>
    <script src="/js/secure-auth.js"></script>
    
    <script>
        let currentUsers = [];
        let selectedUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            // Check admin authentication
            const user = await SecureAuth.getCurrentUser();
            if (!user || !isAdmin(user)) {
                window.location.href = '/login.html';
                return;
            }

            // Load verification data
            await loadVerifications();
            
            // Setup event listeners
            setupEventListeners();
        });

        function isAdmin(user) {
            // Check if user is admin (you can customize this logic)
            return user.email === 'admin@interlineasia.com' || 
                   user.user_metadata?.role === 'admin';
        }

        async function loadVerifications() {
            try {
                document.getElementById('loading-state').style.display = 'block';
                document.getElementById('verifications-list').style.display = 'none';
                document.getElementById('empty-state').style.display = 'none';

                const response = await fetch('/api/admin/verifications', {
                    headers: {
                        'Authorization': `Bearer ${(await SecureAuth.getSession())?.access_token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load verifications');
                }

                const users = await response.json();
                currentUsers = users;
                
                updateStats(users);
                displayVerifications(users);

            } catch (error) {
                console.error('Load verifications error:', error);
                showError('Failed to load verification requests');
            } finally {
                document.getElementById('loading-state').style.display = 'none';
            }
        }

        function updateStats(users) {
            const pendingCount = users.filter(u => u.verification_status === 'pending').length;
            const verifiedCount = users.filter(u => u.verification_status === 'verified').length;
            
            document.getElementById('pending-count').textContent = pendingCount;
            document.getElementById('verified-count').textContent = verifiedCount;
        }

        function displayVerifications(users) {
            const container = document.getElementById('verifications-list');
            const statusFilter = document.getElementById('status-filter').value;
            const searchFilter = document.getElementById('search-filter').value.toLowerCase();

            // Filter users
            let filteredUsers = users;
            
            if (statusFilter !== 'all') {
                filteredUsers = filteredUsers.filter(user => 
                    user.verification_status === statusFilter
                );
            }
            
            if (searchFilter) {
                filteredUsers = filteredUsers.filter(user => 
                    user.first_name?.toLowerCase().includes(searchFilter) ||
                    user.last_name?.toLowerCase().includes(searchFilter) ||
                    user.email?.toLowerCase().includes(searchFilter) ||
                    user.company?.toLowerCase().includes(searchFilter)
                );
            }

            if (filteredUsers.length === 0) {
                document.getElementById('empty-state').style.display = 'block';
                container.style.display = 'none';
                return;
            }

            document.getElementById('empty-state').style.display = 'none';
            container.style.display = 'block';

            container.innerHTML = filteredUsers.map(user => `
                <div class="verification-card" data-user-id="${user.id}">
                    <div class="user-avatar">
                        <i class="ri-user-line"></i>
                    </div>
                    <div class="user-info">
                        <h4>${user.first_name || ''} ${user.last_name || ''}</h4>
                        <p class="user-email">${user.email}</p>
                        <p class="user-company">${user.company || 'No company provided'}</p>
                        <p class="user-title">${user.job_title || 'No title provided'}</p>
                    </div>
                    <div class="verification-status">
                        <span class="status-badge ${user.verification_status}">
                            ${getStatusIcon(user.verification_status)}
                            ${user.verification_status}
                        </span>
                        <p class="signup-date">Signed up: ${new Date(user.created_at).toLocaleDateString()}</p>
                    </div>
                    <div class="verification-actions">
                        <button class="btn btn-primary btn-sm view-details-btn" data-user-id="${user.id}">
                            <i class="ri-eye-line"></i>
                            View Details
                        </button>
                        ${user.verification_status === 'pending' ? `
                            <button class="btn btn-success btn-sm quick-verify-btn" data-user-id="${user.id}">
                                <i class="ri-check-line"></i>
                                Quick Verify
                            </button>
                        ` : ''}
                    </div>
                </div>
            `).join('');

            // Add event listeners to buttons
            container.querySelectorAll('.view-details-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const userId = e.target.closest('button').dataset.userId;
                    showUserDetails(userId);
                });
            });

            container.querySelectorAll('.quick-verify-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const userId = e.target.closest('button').dataset.userId;
                    quickVerifyUser(userId);
                });
            });
        }

        function getStatusIcon(status) {
            const icons = {
                pending: '<i class="ri-time-line"></i>',
                verified: '<i class="ri-check-line"></i>',
                rejected: '<i class="ri-close-line"></i>'
            };
            return icons[status] || '';
        }

        function showUserDetails(userId) {
            const user = currentUsers.find(u => u.id === userId);
            if (!user) return;

            selectedUser = user;
            
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = `
                <div class="user-details">
                    <div class="detail-section">
                        <h4>Personal Information</h4>
                        <div class="detail-grid">
                            <div class="detail-item">
                                <label>Full Name:</label>
                                <span>${user.first_name || ''} ${user.last_name || ''}</span>
                            </div>
                            <div class="detail-item">
                                <label>Email:</label>
                                <span>${user.email}</span>
                            </div>
                            <div class="detail-item">
                                <label>Phone:</label>
                                <span>${user.phone || 'Not provided'}</span>
                            </div>
                            <div class="detail-item">
                                <label>Signup Date:</label>
                                <span>${new Date(user.created_at).toLocaleDateString()}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="detail-section">
                        <h4>Professional Information</h4>
                        <div class="detail-grid">
                            <div class="detail-item">
                                <label>Company:</label>
                                <span>${user.company || 'Not provided'}</span>
                            </div>
                            <div class="detail-item">
                                <label>Job Title:</label>
                                <span>${user.job_title || 'Not provided'}</span>
                            </div>
                            <div class="detail-item">
                                <label>Verification Status:</label>
                                <span class="status-badge ${user.verification_status}">
                                    ${user.verification_status}
                                </span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="detail-section">
                        <h4>Account Activity</h4>
                        <div class="detail-grid">
                            <div class="detail-item">
                                <label>Last Login:</label>
                                <span>${user.last_sign_in_at ? new Date(user.last_sign_in_at).toLocaleDateString() : 'Never'}</span>
                            </div>
                            <div class="detail-item">
                                <label>Marketing Opt-in:</label>
                                <span>${user.marketing_opt_in ? 'Yes' : 'No'}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('verification-modal').style.display = 'flex';
        }

        async function quickVerifyUser(userId) {
            if (!confirm('Are you sure you want to verify this user?')) {
                return;
            }

            await updateUserVerification(userId, 'verified');
        }

        async function updateUserVerification(userId, status) {
            try {
                const response = await fetch('/api/admin/update-verification', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${(await SecureAuth.getSession())?.access_token}`
                    },
                    body: JSON.stringify({
                        userId: userId,
                        status: status
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to update verification status');
                }

                // Refresh the list
                await loadVerifications();
                
                // Close modal if open
                document.getElementById('verification-modal').style.display = 'none';
                
                showSuccess(`User ${status} successfully`);

            } catch (error) {
                console.error('Update verification error:', error);
                showError('Failed to update verification status');
            }
        }

        function setupEventListeners() {
            // Filter listeners
            document.getElementById('status-filter').addEventListener('change', () => {
                displayVerifications(currentUsers);
            });

            document.getElementById('search-filter').addEventListener('input', () => {
                displayVerifications(currentUsers);
            });

            document.getElementById('refresh-btn').addEventListener('click', loadVerifications);

            // Modal listeners
            document.getElementById('close-modal').addEventListener('click', () => {
                document.getElementById('verification-modal').style.display = 'none';
            });

            document.getElementById('cancel-modal-btn').addEventListener('click', () => {
                document.getElementById('verification-modal').style.display = 'none';
            });

            document.getElementById('verify-user-btn').addEventListener('click', () => {
                if (selectedUser) {
                    updateUserVerification(selectedUser.id, 'verified');
                }
            });

            document.getElementById('reject-user-btn').addEventListener('click', () => {
                if (selectedUser && confirm('Are you sure you want to reject this user?')) {
                    updateUserVerification(selectedUser.id, 'rejected');
                }
            });

            // Logout
            document.getElementById('admin-logout-btn').addEventListener('click', async () => {
                await SecureAuth.logout();
                window.location.href = '/';
            });

            // Close modal on overlay click
            document.getElementById('verification-modal').addEventListener('click', (e) => {
                if (e.target.classList.contains('modal-overlay')) {
                    document.getElementById('verification-modal').style.display = 'none';
                }
            });
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'notification error';
            errorDiv.innerHTML = `<i class="ri-error-warning-line"></i> ${message}`;
            document.body.appendChild(errorDiv);
            
            setTimeout(() => errorDiv.remove(), 5000);
        }

        function showSuccess(message) {
            const successDiv = document.createElement('div');
            successDiv.className = 'notification success';
            successDiv.innerHTML = `<i class="ri-check-line"></i> ${message}`;
            document.body.appendChild(successDiv);
            
            setTimeout(() => successDiv.remove(), 3000);
        }
    </script>

    <style>

            margin: 0 auto;
            padding: 0 1.5rem;
        }

            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
        }

        .header-content h1 {
            font-size: 2rem;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        .header-content p {
            color: #64748b;
        }

        .header-stats {
            display: flex;
            gap: 2rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            display: block;
            font-size: 2rem;
            font-weight: 700;
            color: #3b82f6;
        }

        .stat-label {
            color: #64748b;
            font-size: 0.875rem;
        }

        .admin-filters {
            display: flex;
            gap: 1rem;
            align-items: end;
            background: white;
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-group label {
            font-weight: 600;
            color: #374151;
            font-size: 0.875rem;
        }

        .filter-group select,
        .filter-group input {
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 0.875rem;
        }

            background: white;
            border-radius: 1rem;

        }

            border-bottom: 1px solid #e5e7eb;
        }

        .verification-card:last-child {
            border-bottom: none;

        .user-avatar {
            width: 3rem;
            height: 3rem;
            background: #f3f4f6;

            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #6b7280;
        }

        .user-info h4 {
            color: #111827;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .user-email {
            color: #3b82f6;
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }

        .user-company,
        .user-title {

        }

        .verification-status {
            text-align: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;

            background: #fef3c7;

        .status-badge.rejected {

        .empty-state i {
            font-size: 3rem;

        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;

            background: rgba(0,0,0,0.5);

            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .modal-content {
            background: white;
            border-radius: 1rem;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .modal-header h3 {
            color: #111827;
            font-weight: 600;
        }

        .modal-close {
            background: none;

        }

        .modal-body {
            padding: 1.5rem;
        }

        .detail-section {
            margin-bottom: 2rem;
        }

        .detail-section h4 {
            color: #111827;
            font-weight: 600;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #e5e7eb;
        }

            display: grid;

        .detail-item {
            display: flex;

        /* Notifications */

        @keyframes spin {

        @media (max-width: 768px) {

            }

            .admin-filters {

                align-items: stretch;
            }

            .verification-card {
                grid-template-columns: 1fr;
                gap: 1rem;
                text-align: center;
            }

            .verification-actions {
                justify-content: center;
            }
        }
    </style>
</body>
</html>
