<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Choose Your Dashboard - Interline Asia">
  <title>Choose Dashboard - Interline Asia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  
  <!-- Loading indicator -->
  <style>
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      display: none;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
  </div>
  
  <div id="header-placeholder"></div>
  
  <main style="min-height: 80vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);">
    <div style="max-width: 600px; margin: 0 auto; padding: 3rem 2rem; background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center;">
      
      <div style="margin-bottom: 2rem;">
        <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center;">
          <i class="ri-dashboard-line" style="font-size: 2.5rem; color: white;"></i>
        </div>
        <h1 style="color: #1e293b; margin-bottom: 0.5rem; font-size: 2rem; font-weight: 700;">Welcome Back!</h1>
        <p id="user-info" style="color: #64748b; font-size: 1.1rem; margin-bottom: 2rem;">Choose your dashboard to continue</p>
      </div>

      <div id="dashboard-buttons" style="display: flex; flex-direction: column; gap: 1rem; max-width: 400px; margin: 0 auto;">
        <!-- Default buttons if JavaScript fails -->
        <a href="/dashboard.html" style="display: flex; align-items: center; justify-content: center; gap: 1rem; padding: 1rem 1.5rem; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; text-decoration: none; border-radius: 12px; font-weight: 600; transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);">
          <i class="ri-dashboard-3-line" style="font-size: 1.25rem;"></i>
          <span>Member Dashboard</span>
        </a>
        
        <a href="/deals.html" style="display: flex; align-items: center; justify-content: center; gap: 1rem; padding: 1rem 1.5rem; background: linear-gradient(135deg, #059669 0%, #047857 100%); color: white; text-decoration: none; border-radius: 12px; font-weight: 600; transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);">
          <i class="ri-ship-line" style="font-size: 1.25rem;"></i>
          <span>Browse Cruise Deals</span>
        </a>
      </div>

      <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #e2e8f0;">
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1rem;">Need to switch accounts?</p>
        <button onclick="signOut()" style="background: transparent; color: #dc2626; border: 1px solid #dc2626; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: all 0.3s ease;">
          <i class="ri-logout-box-line" style="margin-right: 0.5rem;"></i>Sign Out
        </button>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/js/loadPartials.js"></script>
  <script src="/js/dashboard-auth.js"></script>
  
  <script>
    function signOut() {
      if (confirm('Are you sure you want to sign out?')) {
        console.log('DASHBOARD_CHOICE: Signing out...');
        
        // Initialize Supabase client directly for sign out
        const supabase = window.supabase.createClient(
          window.SUPABASE_URL || 'https://nxreyyxbuwxjfmtvdkji.supabase.co',
          window.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54cmV5eXhidXd4amZtdHZka2ppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NTg4NDQsImV4cCI6MjA2NzAzNDg0NH0.SuaK9TqBLbysPCe0zyrMA8owMK4R-q7iNZbtLQzEKcE'
        );
        
        // Sign out and redirect
        supabase.auth.signOut().then(() => {
          // Clear any local storage
          localStorage.clear();
          sessionStorage.clear();
          
          // Redirect to login page
          window.location.href = '/login.html?signout=true';
        });
      }
    }
  </script>
</body>
</html>
