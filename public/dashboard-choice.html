<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Choose Your Dashboard - Interline Asia">
  <title>Choose Dashboard - Interline Asia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
</head>
<body>
  <div id="header-placeholder"></div>
  
  <main style="min-height: 80vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);">
    <div style="max-width: 600px; margin: 0 auto; padding: 3rem 2rem; background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center;">
      
      <div style="margin-bottom: 2rem;">
        <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center;">
          <i class="ri-dashboard-line" style="font-size: 2.5rem; color: white;"></i>
        </div>
        <h1 style="color: #1e293b; margin-bottom: 0.5rem; font-size: 2rem; font-weight: 700;">Welcome Back!</h1>
        <p id="user-info" style="color: #64748b; font-size: 1.1rem; margin-bottom: 2rem;">Choose your dashboard to continue</p>
      </div>

      <div id="dashboard-buttons" style="display: flex; flex-direction: column; gap: 1rem; max-width: 400px; margin: 0 auto;">
        <!-- Buttons will be populated by JavaScript -->
      </div>

      <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #e2e8f0;">
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1rem;">Need to switch accounts?</p>
        <button onclick="signOut()" style="background: transparent; color: #dc2626; border: 1px solid #dc2626; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: all 0.3s ease;">
          <i class="ri-logout-box-line" style="margin-right: 0.5rem;"></i>Sign Out
        </button>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/js/loadPartials.js"></script>
  <script>
    async function initializeDashboardChoice() {
      try {
        // Wait for Supabase client to initialize
        await new Promise(resolve => setTimeout(resolve, 500));
        
        if (!window.supabaseClient.isLoggedIn()) {
          window.location.href = '/login.html';
          return;
        }

        const user = window.supabaseClient.currentUser;
        const isAdmin = window.supabaseClient.isAdmin();
        
        // Update user info
        const userInfo = document.getElementById('user-info');
        const displayName = user?.full_name || user?.email?.split('@')[0] || 'User';
        userInfo.textContent = `Hello ${displayName}${isAdmin ? ' (Admin)' : ' (Member)'}! Choose your dashboard:`;

        // Create dashboard buttons
        const buttonsContainer = document.getElementById('dashboard-buttons');
        
        // Member Dashboard Button (always available)
        const memberBtn = document.createElement('button');
        memberBtn.innerHTML = `
          <div style="display: flex; align-items: center; justify-content: center; gap: 1rem;">
            <i class="ri-user-line" style="font-size: 1.5rem;"></i>
            <div style="text-align: left;">
              <div style="font-weight: 600; font-size: 1.1rem;">Member Dashboard</div>
              <div style="font-size: 0.9rem; opacity: 0.8;">Access deals, bookings, and account</div>
            </div>
          </div>
        `;
        memberBtn.style.cssText = `
          background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
          color: white;
          border: none;
          padding: 1.5rem;
          border-radius: 12px;
          cursor: pointer;
          transition: all 0.3s ease;
          width: 100%;
          font-family: inherit;
        `;
        memberBtn.onmouseover = () => memberBtn.style.transform = 'translateY(-2px)';
        memberBtn.onmouseout = () => memberBtn.style.transform = 'translateY(0)';
        memberBtn.onclick = () => window.location.href = '/dashboard.html';
        
        buttonsContainer.appendChild(memberBtn);

        // Admin Dashboard Button (only for admins)
        if (isAdmin) {
          const adminBtn = document.createElement('button');
          adminBtn.innerHTML = `
            <div style="display: flex; align-items: center; justify-content: center; gap: 1rem;">
              <i class="ri-admin-line" style="font-size: 1.5rem;"></i>
              <div style="text-align: left;">
                <div style="font-weight: 600; font-size: 1.1rem;">Admin Dashboard</div>
                <div style="font-size: 0.9rem; opacity: 0.8;">Manage users, bookings, and system</div>
              </div>
            </div>
          `;
          adminBtn.style.cssText = `
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            color: white;
            border: none;
            padding: 1.5rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            font-family: inherit;
          `;
          adminBtn.onmouseover = () => adminBtn.style.transform = 'translateY(-2px)';
          adminBtn.onmouseout = () => adminBtn.style.transform = 'translateY(0)';
          adminBtn.onclick = () => window.location.href = '/admin.html';
          
          buttonsContainer.appendChild(adminBtn);
        }

      } catch (error) {
        console.error('Dashboard choice initialization error:', error);
        window.location.href = '/login.html';
      }
    }

    function signOut() {
      if (confirm('Are you sure you want to sign out?')) {
        if (window.supabaseClient) {
          window.supabaseClient.signOut();
        } else {
          window.location.href = '/login.html';
        }
      }
    }

    // Initialize when page loads
    document.addEventListener('DOMContentLoaded', initializeDashboardChoice);
  </script>
</body>
</html>
