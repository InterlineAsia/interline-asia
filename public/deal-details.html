<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deal Details | Interline Asia</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
  <header>
    <h1>Interline Asia</h1>
    <nav><a href="/deals.html">← Back to All Deals</a></nav>
  </header>

  <main id="deal-container" style="padding: 20px;">
    <h2>Loading deal...</h2>
  </main>

  <footer>
    <p>&copy; 2025 Interline Asia</p>
  </footer>

  <script>
    const SUPABASE_URL = "https://interlineasia.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImludGVybGluZWFzaWEiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTcxOTU1NzQ0NCwiZXhwIjoyMDM1MTMzNDQ0fQ.YHBaKJAK-VZQJhV_4PoNcNGjOdZeE8vMSQNJQZQJQZQ";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadDealDetails() {
      const params = new URLSearchParams(window.location.search);
      const dealId = params.get('id');
      if (!dealId) {
        document.getElementById("deal-container").innerHTML = "<p>❌ No deal ID provided.</p>";
        return;
      }

      const { data, error } = await supabase
        .from("cruise_deals")
        .select("*")
        .eq("id", dealId)
        .single();

      if (error || !data) {
        document.getElementById("deal-container").innerHTML = "<p>❌ Deal not found.</p>";
        return;
      }

      const {
        cruise_line,
        ship,
        cruise_type,
        destination,
        itinerary,
        departure_date,
        price,
        cabin_1,
        cabin_2,
        cabin_3,
        cabin_4
      } = data;

      const logo = `/assets/logos/${cruise_line.toLowerCase().replace(/\s+/g, "-")}.png`;
      const badgeColor = {
        "Ocean Cruise": "blue",
        "River Cruise": "green",
        "Expedition Cruise": "orange"
      }[cruise_type] || "gray";

      document.getElementById("deal-container").innerHTML = \`
        <div class="deal-detail">
          <img src="\${logo}" alt="\${cruise_line} logo" style="height:50px" />
          <h2>\${ship} - <span style="background:\${badgeColor}; color:#fff; padding:2px 8px; border-radius:6px">\${cruise_type}</span></h2>
          <p><strong>Destination:</strong> \${destination}</p>
          <p><strong>Itinerary:</strong> \${itinerary}</p>
          <p><strong>Departure Date:</strong> \${departure_date}</p>
          <p><strong>Price:</strong> \${price || 'TBA'}</p>
          <h3>Cabins</h3>
          <ul>
            <li>Interior: \${cabin_1 || 'N/A'}</li>
            <li>Oceanview: \${cabin_2 || 'N/A'}</li>
            <li>Balcony: \${cabin_3 || 'N/A'}</li>
            <li>Suite: \${cabin_4 || 'N/A'}</li>
          </ul>
          <h3>Route Map</h3>
          <div style="width:100%; height:300px; background:#ddd; text-align:center; line-height:300px;">🗺️ Map Placeholder</div>
          <br />
          <a href="/booking.html?id=\${dealId}">
            <button style="padding:10px 20px; font-size:16px;">Book This Cruise</button>
          </a>
        </div>
      \`;
    }

    document.addEventListener("DOMContentLoaded", loadDealDetails);
  </script>
</body>
</html>
