<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deal Details | Interline Asia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      margin: 0;
      padding: 0;
    }
    .deal-detail-container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 2rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .cruise-logo {
      height: 60px;
      margin-bottom: 1rem;
    }
    .cruise-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      color: white;
      font-size: 0.875rem;
      font-weight: 500;
      margin-left: 1rem;
    }
    .itinerary-section {
      background: #f8fafc;
      padding: 1.5rem;
      border-radius: 8px;
      margin: 1.5rem 0;
    }
    .cabin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin: 1rem 0;
    }
    .cabin-card {
      background: #f8fafc;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
    }
    .map-placeholder {
      width: 100%;
      height: 300px;
      background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #64748b;
      margin: 1.5rem 0;
    }
    .book-button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .book-button:hover {
      transform: translateY(-2px);
    }
    .back-link {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      margin-bottom: 1rem;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <main class="deal-detail-container">
    <a href="/deals.html" class="back-link">
      <i class="ri-arrow-left-line"></i> Back to All Deals
    </a>
    <div id="deal-container">
      <div class="loading-spinner">
        <i class="ri-loader-4-line"></i>
        <h2>Loading deal details...</h2>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="/js/loadPartials.js"></script>

  <script>
    const SUPABASE_URL = "https://interlineasia.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImludGVybGluZWFzaWEiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTcxOTU1NzQ0NCwiZXhwIjoyMDM1MTMzNDQ0fQ.YHBaKJAK-VZQJhV_4PoNcNGjOdZeE8vMSQNJQZQJQZQ";
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadDealDetails() {
      const params = new URLSearchParams(window.location.search);
      const dealId = params.get('id');
      if (!dealId) {
        document.getElementById("deal-container").innerHTML = "<p>❌ No deal ID provided.</p>";
        return;
      }

      const { data, error } = await supabaseClient
        .from("cruise_deals")
        .select("*")
        .eq("id", dealId)
        .single();

      if (error || !data) {
        document.getElementById("deal-container").innerHTML = "<p>❌ Deal not found.</p>";
        return;
      }

      const {
        cruise_line,
        ship,
        cruise_type,
        destination,
        itinerary,
        departure_date,
        price,
        cabin_1,
        cabin_2,
        cabin_3,
        cabin_4
      } = data;

      const logo = `/logos/cruiselines/${cruise_line.toLowerCase().replace(/\s+/g, "-")}.png`;
      const fallbackLogo = '/logos/cruiselines/placeholder.png';
      const badgeColors = {
        "Ocean Cruise": "#3b82f6",
        "River Cruise": "#10b981",
        "Expedition Cruise": "#f59e0b"
      };
      const badgeColor = badgeColors[cruise_type] || "#6b7280";

      document.getElementById("deal-container").innerHTML = \`
        <div class="deal-detail">
          <div style="display: flex; align-items: center; margin-bottom: 2rem;">
            <img class="cruise-logo" src="\${logo}" alt="\${cruise_line} logo" 
                 onerror="this.src='\${fallbackLogo}'" />
            <div>
              <h1 style="margin: 0; color: #1e293b; font-size: 2rem; font-weight: 700;">\${ship}</h1>
              <span class="cruise-badge" style="background-color:\${badgeColor}">\${cruise_type}</span>
            </div>
          </div>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem;">
            <div>
              <h3 style="color: #374151; margin-bottom: 1rem;"><i class="ri-map-pin-line"></i> Destination</h3>
              <p style="font-size: 1.1rem; color: #1e293b; font-weight: 500;">\${destination}</p>
            </div>
            <div>
              <h3 style="color: #374151; margin-bottom: 1rem;"><i class="ri-calendar-line"></i> Departure Date</h3>
              <p style="font-size: 1.1rem; color: #1e293b; font-weight: 500;">\${new Date(departure_date).toLocaleDateString()}</p>
            </div>
          </div>
          
          <div class="itinerary-section">
            <h3 style="color: #374151; margin-bottom: 1rem;"><i class="ri-route-line"></i> Itinerary</h3>
            <p style="color: #1e293b; line-height: 1.6;">\${itinerary}</p>
          </div>
          
          <div style="margin: 2rem 0;">
            <h3 style="color: #374151; margin-bottom: 1rem;"><i class="ri-price-tag-line"></i> Pricing</h3>
            <div class="cabin-grid">
              <div class="cabin-card">
                <h4 style="margin: 0 0 0.5rem 0; color: #374151;">Interior</h4>
                <p style="margin: 0; font-weight: 600; color: #059669;">\${cabin_1 ? '$' + parseFloat(cabin_1).toLocaleString() : 'N/A'}</p>
              </div>
              <div class="cabin-card">
                <h4 style="margin: 0 0 0.5rem 0; color: #374151;">Oceanview</h4>
                <p style="margin: 0; font-weight: 600; color: #059669;">\${cabin_2 ? '$' + parseFloat(cabin_2).toLocaleString() : 'N/A'}</p>
              </div>
              <div class="cabin-card">
                <h4 style="margin: 0 0 0.5rem 0; color: #374151;">Balcony</h4>
                <p style="margin: 0; font-weight: 600; color: #059669;">\${cabin_3 ? '$' + parseFloat(cabin_3).toLocaleString() : 'N/A'}</p>
              </div>
              <div class="cabin-card">
                <h4 style="margin: 0 0 0.5rem 0; color: #374151;">Suite</h4>
                <p style="margin: 0; font-weight: 600; color: #059669;">\${cabin_4 ? '$' + parseFloat(cabin_4).toLocaleString() : 'N/A'}</p>
              </div>
            </div>
          </div>
          
          <div style="margin: 2rem 0;">
            <h3 style="color: #374151; margin-bottom: 1rem;"><i class="ri-map-line"></i> Route Map</h3>
            <div class="map-placeholder">
              <div style="text-align: center;">
                <i class="ri-map-2-line" style="font-size: 3rem; margin-bottom: 1rem; display: block;"></i>
                <p style="margin: 0; font-weight: 500;">Interactive route map coming soon</p>
              </div>
            </div>
          </div>
          
          <div style="text-align: center; margin-top: 3rem;">
            <a href="/booking.html?id=\${dealId}" style="text-decoration: none;">
              <button class="book-button">
                <i class="ri-ship-line"></i> Book This Cruise
              </button>
            </a>
          </div>
        </div>
      \`;
    }

    document.addEventListener("DOMContentLoaded", loadDealDetails);
  </script>
</body>
</html>
