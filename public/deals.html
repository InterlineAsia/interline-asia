<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cruise Deals - Interline Asia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8fafc; }
    
    .hero { background: linear-gradient(135deg, #0f172a 0%, #334155 100%); color: white; padding: 4rem 2rem; text-align: center; }
    .hero h1 { font-size: 3rem; margin-bottom: 1rem; }
    .hero p { font-size: 1.25rem; margin-bottom: 2rem; }
    .summary { background: rgba(255,255,255,0.1); padding: 1rem 2rem; border-radius: 12px; display: inline-block; }
    
    .filters { background: white; padding: 2rem; margin: -2rem 2rem 2rem; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); max-width: 1200px; margin-left: auto; margin-right: auto; }
    .filters-grid { 
      display: grid; 
      grid-template-columns: 2fr 1fr 1fr 1fr; 
      grid-template-rows: auto auto; 
      gap: 1rem;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }
    .filter-group { display: flex; flex-direction: column; }
    .filter-group label { 
      font-weight: 600; 
      margin-bottom: 0.5rem; 
      color: #374151; 
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .filter-input, .filter-select { 
      padding: 0.75rem; 
      border: 2px solid #e5e7eb; 
      border-radius: 8px; 
      font-size: 0.875rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s ease;
      background: white;
    }
    .filter-input:focus, .filter-select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    .filter-input:hover, .filter-select:hover {
      border-color: #d1d5db;
    }
    .filter-select {
      cursor: pointer;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 0.5rem center;
      background-repeat: no-repeat;
      background-size: 1.5em 1.5em;
      padding-right: 2.5rem;
      appearance: none;
    }
    
    .btn-clear-filters {
      padding: 0.75rem 1rem;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      justify-content: center;
    }
    
    .btn-clear-filters:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    }
    
    .main-content { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    .deals-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
      gap: 1.5rem; 
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      justify-items: center;
    }
    
    .cabin-types { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .cabin-type { padding: 0.25rem 0.5rem; background: #f1f5f9; border-radius: 12px; font-size: 0.75rem; color: #64748b; }
    
    .deal-card { 
      background: white; 
      border-radius: 16px; 
      overflow: hidden; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      width: 100%;
      max-width: 380px;
    }
    .deal-card:hover { 
      transform: translateY(-6px) scale(1.02); 
      box-shadow: 0 20px 40px rgba(0,0,0,0.12); 
    }
    
    .deal-header { padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; }
    .cruise-logo { height: 40px; width: auto; max-width: 120px; object-fit: contain; }
    .cruise-type-badge { padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .cruise-type-badge.river-cruise { background: #dcfce7; color: #166534; }
    .cruise-type-badge.ocean-cruise { background: #dbeafe; color: #1e40af; }
    .cruise-type-badge.expedition-cruise { background: #fef3c7; color: #92400e; }
    
    .deal-content { padding: 1.5rem; }
    .ship-name { font-size: 1.25rem; font-weight: 700; color: #1e293b; margin-bottom: 0.25rem; }
    .cruise-line { color: #64748b; font-weight: 500; margin-bottom: 1rem; }
    
    .deal-details { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
    .detail-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: #64748b; }
    .detail-item i { color: #3b82f6; width: 16px; }
    
    .itinerary { font-size: 0.875rem; color: #64748b; margin-bottom: 1rem; line-height: 1.5; }
    .pricing { margin-bottom: 1rem; }
    .price { font-size: 1.125rem; font-weight: 700; }
    .price.has-price { color: #059669; }
    .price.quote-only { color: #64748b; }
    
    .deal-actions { padding: 0 1.5rem 1.5rem; }
    .btn-view-details { width: 100%; padding: 0.75rem 1.5rem; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-view-details:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
    
    .loading { text-align: center; padding: 4rem 2rem; }
    .loading i { font-size: 3rem; color: #3b82f6; animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    
    @media (max-width: 1024px) {
      .filters-grid { 
        grid-template-columns: repeat(2, 1fr); 
        grid-template-rows: auto auto auto auto; 
        gap: 0.75rem; 
      }
      .deals-grid { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
    }
    
    @media (max-width: 768px) {
      .hero { padding: 2rem 1rem; }
      .hero h1 { font-size: 2rem; }
      .filters { margin: -1rem 1rem 1rem; padding: 1.5rem; }
      .filters-grid { grid-template-columns: 1fr; gap: 1rem; }
      .main-content { padding: 1rem; }
      .deals-grid { grid-template-columns: 1fr; gap: 1rem; }
    }
    
    @media (max-width: 480px) {
      .deals-grid { grid-template-columns: 1fr; gap: 1rem; }
      .deal-card { margin: 0; max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Exclusive Cruise Deals</h1>
    <p>For Interline & Travel Industry Staff</p>
    <div class="summary">
      <span id="deals-summary">Loading deals...</span>
    </div>
  </div>

  <div class="filters">
    <div class="filters-grid">
      <div class="filter-group">
        <label for="search-input">
          <i class="ri-search-line"></i>
          Search
        </label>
        <input type="text" id="search-input" class="filter-input" 
               placeholder="Search cruise lines, ships, destinations..."
               aria-label="Search cruise deals">
      </div>
      <div class="filter-group">
        <label for="cruise-line-filter">
          <i class="ri-ship-line"></i>
          Cruise Line
        </label>
        <select id="cruise-line-filter" class="filter-select" aria-label="Filter by cruise line">
          <option value="">All Cruise Lines</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="cruise-type-filter">
          <i class="ri-compass-line"></i>
          Cruise Type
        </label>
        <select id="cruise-type-filter" class="filter-select" aria-label="Filter by cruise type">
          <option value="">All Types</option>
          <option value="Ocean Cruise">Ocean Cruise</option>
          <option value="River Cruise">River Cruise</option>
          <option value="Expedition Cruise">Expedition Cruise</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="ship-filter">
          <i class="ri-anchor-line"></i>
          Ship
        </label>
        <select id="ship-filter" class="filter-select" aria-label="Filter by ship">
          <option value="">All Ships</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="destination-filter">
          <i class="ri-map-pin-line"></i>
          Destination
        </label>
        <select id="destination-filter" class="filter-select" aria-label="Filter by destination">
          <option value="">All Destinations</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="date-from-filter">
          <i class="ri-calendar-line"></i>
          From Date
        </label>
        <input type="date" id="date-from-filter" class="filter-input date-picker" 
               aria-label="Filter from date" 
               min="2025-01-01" 
               max="2026-12-31"
               placeholder="Select start date">
      </div>
      <div class="filter-group">
        <label for="date-to-filter">
          <i class="ri-calendar-check-line"></i>
          To Date
        </label>
        <input type="date" id="date-to-filter" class="filter-input date-picker" 
               aria-label="Filter to date"
               min="2025-01-01" 
               max="2026-12-31"
               placeholder="Select end date">
      </div>
      <div class="filter-group" style="grid-column: span 1; display: flex; align-items: end;">
        <button id="clear-filters-btn" class="btn-clear-filters" onclick="clearAllFilters()">
          <i class="ri-refresh-line"></i>
          Clear Filters
        </button>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div id="loading-state" class="loading">
      <i class="ri-loader-4-line"></i>
      <p>Loading cruise deals...</p>
    </div>
    <div id="deals-container" class="deals-grid" style="display: none;"></div>
  </div>

  <!-- Enhanced CSV Loader -->
  <script src="/js/enhanced-csv-loader.js"></script>
  
  <script>
    console.log('DEALS PAGE: Starting enhanced deals system...');
    
    let allDeals = [];
    let filteredDeals = [];

    // Sample deals to ensure page works
    const sampleDeals = [
      {
        id: 'sample_1',
        cruiseType: 'River Cruise',
        cruiseLine: 'AmaWaterways',
        shipName: 'AmaBella',
        region: 'Europe',
        nights: 7,
        departureDate: '2025-07-07',
        departurePort: 'Budapest, Hungary',
        arrivalPort: 'Vilshofen, Germany',
        itinerary: 'Melodies of the Danube 2025',
        insidePrice: 3440,
        oceanviewPrice: 4040,
        balconyPrice: 4640,
        suitePrice: 0
      },
      {
        id: 'sample_2',
        cruiseType: 'Ocean Cruise',
        cruiseLine: 'Crystal',
        shipName: 'Crystal Symphony',
        region: 'Europe',
        nights: 8,
        departureDate: '2025-07-10',
        departurePort: 'Thessaloniki',
        arrivalPort: 'Civitavecchia (Rome)',
        itinerary: 'Greek Isles & Italy',
        insidePrice: 3340,
        oceanviewPrice: 5090,
        balconyPrice: 6290,
        suitePrice: 0
      },
      {
        id: 'sample_3',
        cruiseType: 'Ocean Cruise',
        cruiseLine: 'Royal Caribbean',
        shipName: 'Allure of the Seas',
        region: 'Mediterranean',
        nights: 7,
        departureDate: '2025-08-15',
        departurePort: 'Barcelona',
        arrivalPort: 'Rome',
        itinerary: 'Western Mediterranean',
        insidePrice: 2890,
        oceanviewPrice: 3450,
        balconyPrice: 4200,
        suitePrice: 7500
      }
    ];

    async function loadCSVDeals() {
      try {
        console.log('CSV_LOADER: Attempting to load CSV data from renamed files...');
        
        // Try to load river cruise data
        const riverResponse = await fetch('/river.csv');
        if (riverResponse.ok) {
          const riverCSV = await riverResponse.text();
          const riverDeals = parseCSV(riverCSV, 'River Cruise');
          console.log('CSV_LOADER: Loaded', riverDeals.length, 'river cruise deals');
          allDeals = allDeals.concat(riverDeals);
        } else {
          console.log('CSV_LOADER: Could not load river.csv, status:', riverResponse.status);
        }

        // Try to load ocean cruise data
        const oceanResponse = await fetch('/twins.csv');
        if (oceanResponse.ok) {
          const oceanCSV = await oceanResponse.text();
          const oceanDeals = parseCSV(oceanCSV, 'Ocean Cruise');
          console.log('CSV_LOADER: Loaded', oceanDeals.length, 'ocean cruise deals');
          allDeals = allDeals.concat(oceanDeals);
        } else {
          console.log('CSV_LOADER: Could not load twins.csv, status:', oceanResponse.status);
        }

        if (allDeals.length === 0) {
          console.log('DEALS PAGE: No CSV data loaded, using sample deals');
          allDeals = sampleDeals;
        }

      } catch (error) {
        console.error('DEALS PAGE: Error loading CSV data:', error);
        allDeals = sampleDeals;
      }
    }

    function parseCSV(csvText, cruiseType) {
      const lines = csvText.trim().split('\n');
      const headers = parseCSVLine(lines[0]);
      const deals = [];

      // Limit to first 100 deals for optimal performance (like major travel sites)
      const maxDeals = Math.min(lines.length - 1, 100);
      
      for (let i = 1; i <= maxDeals; i++) {
        const values = parseCSVLine(lines[i]);
        if (values.length >= 10) {
          const deal = createDeal(headers, values, cruiseType);
          if (deal.cruiseLine && deal.shipName) {
            deals.push(deal);
          }
        }
      }
      
      console.log(`CSV_LOADER: Limited to ${deals.length} deals for optimal performance`);
      return deals;
    }

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result;
    }

    function createDeal(headers, values, cruiseType) {
      const deal = {};
      headers.forEach((header, index) => {
        deal[header] = values[index] || '';
      });

      // Determine actual cruise type based on region and other factors
      let actualCruiseType = cruiseType;
      const region = (deal.Region || '').toLowerCase();
      const itinerary = (deal.Itinerary || '').toLowerCase();
      
      // Check for expedition cruises
      if (region.includes('arctic') || region.includes('antarctic') || 
          itinerary.includes('expedition') || itinerary.includes('arctic') || 
          itinerary.includes('antarctic') || itinerary.includes('polar')) {
        actualCruiseType = 'Expedition Cruise';
      }

      // Determine available cabin types
      const cabinTypes = [];
      if (deal.Inside && deal.Inside !== 'Quote Available' && deal.Inside !== '') cabinTypes.push('Interior');
      if (deal.Oceanview && deal.Oceanview !== 'Quote Available' && deal.Oceanview !== '') cabinTypes.push('Oceanview');
      if (deal.Balcony && deal.Balcony !== 'Quote Available' && deal.Balcony !== '') cabinTypes.push('Balcony');
      if (deal.Suite && deal.Suite !== 'Quote Available' && deal.Suite !== '') cabinTypes.push('Suite');

      return {
        id: `${actualCruiseType.toLowerCase().replace(/\s+/g, '_')}_${deal.SEQ || Math.random().toString(36).substr(2, 9)}`,
        cruiseType: actualCruiseType,
        cruiseLine: deal['Cruise Line'] || '',
        shipName: deal.Ship || '',
        region: deal.Region || '',
        nights: parseInt(deal.Nights || 0),
        departureDate: parseDate(deal.Date),
        departurePort: deal.From || '',
        arrivalPort: deal.To || '',
        itinerary: deal.Itinerary || '',
        insidePrice: parsePrice(deal.Inside),
        oceanviewPrice: parsePrice(deal.Oceanview),
        balconyPrice: parsePrice(deal.Balcony),
        suitePrice: parsePrice(deal.Suite),
        saleEndDate: parseDate(deal.Sale),
        cabinTypes: cabinTypes
      };
    }

    function parseDate(dateStr) {
      if (!dateStr) return null;
      
      // Handle DD-MMM-YY format (e.g., "07-Jul-25")
      if (dateStr.includes('-') && dateStr.length <= 9) {
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          const day = parseInt(parts[0]);
          const month = parts[1];
          const year = parts[2].length === 2 ? parseInt('20' + parts[2]) : parseInt(parts[2]);
          const monthMap = {
            'Jan': 0, 'Feb': 1, 'Mar': 2, 'Apr': 3, 'May': 4, 'Jun': 5,
            'Jul': 6, 'Aug': 7, 'Sep': 8, 'Oct': 9, 'Nov': 10, 'Dec': 11
          };
          const monthNum = monthMap[month];
          if (!isNaN(day) && monthNum !== undefined && !isNaN(year)) {
            return new Date(year, monthNum, day);
          }
        }
      }
      
      // Try standard date parsing
      const date = new Date(dateStr);
      return isNaN(date.getTime()) ? null : date;
    }

    function parsePrice(priceStr) {
      if (!priceStr || priceStr.toLowerCase().includes('quote')) return 0;
      const cleaned = priceStr.replace(/[$,]/g, '');
      const price = parseFloat(cleaned);
      return isNaN(price) ? 0 : price;
    }

    function renderDeals(deals) {
      const container = document.getElementById('deals-container');
      const summaryElement = document.getElementById('deals-summary');
      
      if (summaryElement) {
        summaryElement.textContent = `Showing ${deals.length} deals`;
      }

      container.innerHTML = deals.map(deal => {
        const bestPrice = getBestPrice(deal);
        const priceDisplay = formatPrice(bestPrice);
        
        return `
          <div class="deal-card">
            <div class="deal-header">
              <img src="/logos/cruiselines/${getCruiseLineLogo(deal.cruiseLine)}" 
                   alt="${deal.cruiseLine}" 
                   class="cruise-logo"
                   onerror="this.src='/logos/cruiselines/placeholder.png'">
              <div class="cruise-type-badge ${deal.cruiseType.toLowerCase().replace(' ', '-')}">${deal.cruiseType}</div>
            </div>
            
            <div class="deal-content">
              <h3 class="ship-name">${deal.shipName}</h3>
              <p class="cruise-line">${deal.cruiseLine}</p>
              
              <div class="deal-details">
                <div class="detail-item">
                  <i class="ri-map-pin-line"></i>
                  <span>${deal.departurePort || deal.region}</span>
                </div>
                <div class="detail-item">
                  <i class="ri-calendar-line"></i>
                  <span>${formatDate(deal.departureDate)}</span>
                </div>
                <div class="detail-item">
                  <i class="ri-time-line"></i>
                  <span>${deal.nights} nights</span>
                </div>
                ${deal.region ? `
                <div class="detail-item">
                  <i class="ri-global-line"></i>
                  <span>${deal.region}</span>
                </div>
                ` : ''}
                ${deal.saleEndDate ? `
                <div class="detail-item">
                  <i class="ri-alarm-line"></i>
                  <span>Sale ends: ${formatDate(deal.saleEndDate)}</span>
                </div>
                ` : ''}
              </div>
              
              ${deal.cabinTypes && deal.cabinTypes.length > 0 ? `
              <div class="cabin-types">
                ${deal.cabinTypes.map(type => `<span class="cabin-type">${type}</span>`).join('')}
              </div>
              ` : ''}
              
              ${deal.itinerary ? `<div class="itinerary">${deal.itinerary.substring(0, 100)}${deal.itinerary.length > 100 ? '...' : ''}</div>` : ''}
              
              <div class="pricing">
                <span class="price ${bestPrice > 0 ? 'has-price' : 'quote-only'}">
                  ${priceDisplay}
                </span>
              </div>
            </div>
            
            <div class="deal-actions">
              <button class="btn-view-details" onclick="window.location.href='/deal-details.html?id=${deal.id}'">
                View Details
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function getCruiseLineLogo(cruiseLine) {
      if (!cruiseLine) return 'placeholder.png';
      
      // Handle special cases for cruise line logo mapping
      const logoMap = {
        'scenic': 'scenic.png',
        'scenic river cruises': 'scenic.png',
        'hx hurtigruten expeditions': 'hx.png',
        'hurtigruten expeditions': 'hx.png',
        'regent seven seas cruises': 'regent.png',
        'amawaterways': 'amawaterways.png',
        'ama waterways': 'amawaterways.png',
        'royal caribbean': 'royal-caribbean.png',
        'coral expeditions': 'coral-expeditions.png',
        'holland america': 'holland-america.png',
        'princess cruises': 'princess.png',
        'norwegian cruise line': 'norwegian.png',
        'msc cruises': 'msc.png',
        'celebrity cruises': 'celebrity.png'
      };
      
      const normalizedName = cruiseLine.toLowerCase().trim();
      
      // Check if we have a specific mapping
      if (logoMap[normalizedName]) {
        return logoMap[normalizedName];
      }
      
      // Default slug generation
      const slug = normalizedName.replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, '-');
      return slug + '.png';
    }

    function getBestPrice(deal) {
      const prices = [deal.insidePrice, deal.oceanviewPrice, deal.balconyPrice, deal.suitePrice].filter(p => p > 0);
      return prices.length > 0 ? Math.min(...prices) : 0;
    }

    function formatPrice(price) {
      return price > 0 ? `From $${price.toLocaleString()} per person` : 'Quote Available';
    }

    function formatDate(date) {
      if (!date) return 'TBA';
      if (typeof date === 'string') {
        const parsedDate = new Date(date);
        return isNaN(parsedDate.getTime()) ? date : parsedDate.toLocaleDateString('en-US', { 
          year: 'numeric', 
          month: 'short', 
          day: 'numeric' 
        });
      }
      return date.toLocaleDateString('en-US', { 
        year: 'numeric', 
        month: 'short', 
        day: 'numeric' 
      });
    }

    function viewDealDetails(dealId) {
      window.location.href = `/deal-details.html?id=${dealId}`;
    }

    function populateFilters() {
      const cruiseLines = [...new Set(allDeals.map(d => d.cruiseLine))].filter(Boolean).sort();
      const cruiseLineFilter = document.getElementById('cruise-line-filter');
      if (cruiseLineFilter) {
        cruiseLineFilter.innerHTML = '<option value="">All Cruise Lines</option>' +
          cruiseLines.map(line => `<option value="${line}">${line}</option>`).join('');
      }

      // Populate ships
      const ships = [...new Set(allDeals.map(d => d.shipName))].filter(Boolean).sort();
      const shipFilter = document.getElementById('ship-filter');
      if (shipFilter) {
        shipFilter.innerHTML = '<option value="">All Ships</option>' +
          ships.map(ship => `<option value="${ship}">${ship}</option>`).join('');
      }

      // Populate destinations
      const destinations = [...new Set(allDeals.map(d => d.region))].filter(Boolean).sort();
      const destinationFilter = document.getElementById('destination-filter');
      if (destinationFilter) {
        destinationFilter.innerHTML = '<option value="">All Destinations</option>' +
          destinations.map(dest => `<option value="${dest}">${dest}</option>`).join('');
      }
    }

    function setupFilters() {
      ['search-input', 'cruise-line-filter', 'cruise-type-filter', 'ship-filter', 'destination-filter', 'date-from-filter', 'date-to-filter'].forEach(id => {
        const element = document.getElementById(id);
        if (element) {
          element.addEventListener(element.type === 'select-one' ? 'change' : 'input', applyFilters);
        }
      });
    }

    function applyFilters() {
      const searchTerm = document.getElementById('search-input')?.value.toLowerCase() || '';
      const cruiseLine = document.getElementById('cruise-line-filter')?.value || '';
      const cruiseType = document.getElementById('cruise-type-filter')?.value || '';
      const ship = document.getElementById('ship-filter')?.value || '';
      const destination = document.getElementById('destination-filter')?.value || '';
      const fromDateStr = document.getElementById('date-from-filter')?.value || '';
      const toDateStr = document.getElementById('date-to-filter')?.value || '';

      console.log('DEALS: Applying filters...', { fromDateStr, toDateStr });

      filteredDeals = allDeals.filter(deal => {
        // Search filter
        if (searchTerm && !`${deal.cruiseLine} ${deal.shipName} ${deal.region} ${deal.itinerary}`.toLowerCase().includes(searchTerm)) return false;
        
        // Cruise line filter
        if (cruiseLine && deal.cruiseLine !== cruiseLine) return false;
        
        // Cruise type filter - improved to handle expedition cruises
        if (cruiseType) {
          const dealType = deal.cruiseType.toLowerCase();
          const filterType = cruiseType.toLowerCase();
          if (!dealType.includes(filterType.replace(' cruise', ''))) return false;
        }
        
        // Ship filter
        if (ship && deal.shipName !== ship) return false;
        
        // Destination filter
        if (destination && deal.region !== destination) return false;
        
        // Enhanced Date filters - fix the date comparison
        if (fromDateStr || toDateStr) {
          const dealDate = deal.departureDate;
          if (!dealDate) return false; // Skip deals without dates when filtering by date
          
          if (fromDateStr) {
            const fromDate = new Date(fromDateStr);
            if (dealDate < fromDate) {
              console.log('DEALS: Filtering out deal - too early:', deal.shipName, dealDate, '<', fromDate);
              return false;
            }
          }
          
          if (toDateStr) {
            const toDate = new Date(toDateStr);
            toDate.setHours(23, 59, 59, 999); // Include the entire end date
            if (dealDate > toDate) {
              console.log('DEALS: Filtering out deal - too late:', deal.shipName, dealDate, '>', toDate);
              return false;
            }
          }
        }
        
        return true;
      });

      console.log('DEALS: Filtered from', allDeals.length, 'to', filteredDeals.length, 'deals');
      renderDeals(filteredDeals);
    }

    // Clear all filters function
    function clearAllFilters() {
      document.getElementById('search-input').value = '';
      document.getElementById('cruise-line-filter').value = '';
      document.getElementById('cruise-type-filter').value = '';
      document.getElementById('ship-filter').value = '';
      document.getElementById('destination-filter').value = '';
      document.getElementById('date-from-filter').value = '';
      document.getElementById('date-to-filter').value = '';
      
      filteredDeals = allDeals;
      renderDeals(filteredDeals);
      
      console.log('DEALS: All filters cleared, showing', allDeals.length, 'deals');
    }

    // Initialize with Enhanced CSV Loader
    document.addEventListener('DOMContentLoaded', async () => {
      console.log('DEALS PAGE: DOM loaded, initializing enhanced system...');
      
      try {
        // Use enhanced CSV loader
        allDeals = await window.csvLoader.loadAllDeals();
        filteredDeals = allDeals;
        
        console.log('DEALS PAGE: Enhanced loader provided', allDeals.length, 'deals');
        
        populateFilters();
        setupFilters();
        renderDeals(filteredDeals);
        
      } catch (error) {
        console.error('DEALS PAGE: Enhanced loader failed, falling back to legacy system:', error);
        
        // Fallback to legacy CSV loading
        await loadCSVDeals();
        filteredDeals = allDeals;
        
        populateFilters();
        setupFilters();
        renderDeals(filteredDeals);
      }
      
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('deals-container').style.display = 'grid';
      
      console.log('DEALS PAGE: Initialized with', allDeals.length, 'deals');
    });
  </script>
</body>
</html>
