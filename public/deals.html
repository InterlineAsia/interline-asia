<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Exclusive Cruise Deals for Interline & Travel Industry Staff - Interline Asia">
  <title>Exclusive Cruise Deals - Interline Asia</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
  
  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="tmp_rovodev_deals_loader.js"></script>
  
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FYGT92WCXC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FYGT92WCXC');
  </script>
  
  <style>
    /* Modern Cruise Deals Styling */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      color: #1e293b;
      line-height: 1.6;
      min-height: 100vh;
    }
    
    /* Header Section */
    .deals-hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
      color: white;
      padding: 4rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .deals-hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="waves" patternUnits="userSpaceOnUse" width="100" height="100"><path d="M0,50 Q25,30 50,50 T100,50 V100 H0 Z" fill="rgba(255,255,255,0.05)"/></pattern></defs><rect width="100" height="100" fill="url(%23waves)"/></svg>');
      opacity: 0.3;
      animation: float 20s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    .deals-hero-content {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
    }
    
    .deals-hero h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .deals-hero p {
      font-size: 1.25rem;
      opacity: 0.9;
      margin-bottom: 2rem;
    }
    
    .deals-summary {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 1rem 2rem;
      display: inline-block;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    /* Filters Section */
    .filters-section {
      background: white;
      padding: 2rem;
      margin: -2rem 2rem 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      position: relative;
      z-index: 2;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .filters-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;
      gap: 1rem;
      align-items: end;
    }
    
    .filter-group {
      display: flex;
      flex-direction: column;
    }
    
    .filter-group label {
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #374151;
      font-size: 0.875rem;
    }
    
    .filter-input, .filter-select {
      padding: 0.75rem;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 0.875rem;
      transition: all 0.2s;
      background: white;
    }
    
    .filter-input:focus, .filter-select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    /* Main Content */
    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    /* Deals Grid */
    .deals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }
    
    .deal-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
      border: 1px solid #f1f5f9;
    }
    
    .deal-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }
    
    .deal-header {
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f1f5f9;
    }
    
    .cruise-logo {
      height: 40px;
      width: auto;
      max-width: 120px;
      object-fit: contain;
    }
    
    .cruise-type-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .cruise-type-badge.river-cruise {
      background: #dcfce7;
      color: #166534;
    }
    
    .cruise-type-badge.ocean-cruise {
      background: #dbeafe;
      color: #1e40af;
    }
    
    .deal-content {
      padding: 1.5rem;
    }
    
    .ship-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.25rem;
    }
    
    .cruise-line {
      color: #64748b;
      font-weight: 500;
      margin-bottom: 1rem;
    }
    
    .deal-details {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    
    .detail-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: #64748b;
    }
    
    .detail-item i {
      color: #3b82f6;
      width: 16px;
    }
    
    .itinerary {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 1rem;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .pricing {
      margin-bottom: 1rem;
    }
    
    .price {
      font-size: 1.125rem;
      font-weight: 700;
    }
    
    .price.has-price {
      color: #059669;
    }
    
    .price.quote-only {
      color: #64748b;
    }
    
    .deal-actions {
      padding: 0 1.5rem 1.5rem;
    }
    
    .btn-view-details {
      width: 100%;
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-view-details:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }
    
    /* Loading State */
    .loading {
      text-align: center;
      padding: 4rem 2rem;
    }
    
    .loading i {
      font-size: 3rem;
      color: #3b82f6;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    /* No Deals State */
    .no-deals {
      text-align: center;
      padding: 4rem 2rem;
      color: #64748b;
    }
    
    .no-deals i {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }
    
    .no-deals h3 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #374151;
    }
    
    /* Responsive Design */
    @media (max-width: 768px) {
      .deals-hero {
        padding: 2rem 1rem;
      }
      
      .deals-hero h1 {
        font-size: 2rem;
      }
      
      .filters-section {
        margin: -1rem 1rem 1rem;
        padding: 1.5rem;
      }
      
      .filters-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      
      .main-content {
        padding: 1rem;
      }
      
      .deals-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
    }
    
    @media (max-width: 1024px) {
      .filters-grid {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 1rem;
      }
    }
  </style>
</head>

<body>
  <!-- Hero Section -->
  <section class="deals-hero">
    <div class="deals-hero-content">
      <h1>Exclusive Cruise Deals</h1>
      <p>For Interline & Travel Industry Staff</p>
      <div class="deals-summary">
        <span id="deals-summary">Loading deals...</span>
      </div>
    </div>
  </section>

  <!-- Filters Section -->
  <section class="filters-section">
    <div class="filters-grid">
      <div class="filter-group">
        <label for="search-input">Search</label>
        <input type="text" id="search-input" class="filter-input" placeholder="Search cruise lines, ships, destinations...">
      </div>
      
      <div class="filter-group">
        <label for="cruise-line-filter">Cruise Line</label>
        <select id="cruise-line-filter" class="filter-select">
          <option value="">All Cruise Lines</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label for="cruise-type-filter">Cruise Type</label>
        <select id="cruise-type-filter" class="filter-select">
          <option value="">All Types</option>
          <option value="Ocean Cruise">Ocean Cruise</option>
          <option value="River Cruise">River Cruise</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label for="destination-filter">Destination</label>
        <input type="text" id="destination-filter" class="filter-input" placeholder="Region or destination">
      </div>
      
      <div class="filter-group">
        <label for="date-from-filter">From Date</label>
        <input type="date" id="date-from-filter" class="filter-input">
      </div>
      
      <div class="filter-group">
        <label for="date-to-filter">To Date</label>
        <input type="date" id="date-to-filter" class="filter-input">
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Loading State -->
    <div id="loading-state" class="loading">
      <i class="ri-loader-4-line"></i>
      <p>Loading cruise deals...</p>
    </div>

    <!-- Deals Grid -->
    <div id="deals-container" class="deals-grid" style="display: none;">
      <!-- Deals will be populated by JavaScript -->
    </div>
  </main>

  <script>
    // Show loading initially
    document.addEventListener('DOMContentLoaded', () => {
      const loadingState = document.getElementById('loading-state');
      const dealsContainer = document.getElementById('deals-container');
      
      // Hide loading and show deals after a short delay
      setTimeout(() => {
        if (loadingState) loadingState.style.display = 'none';
        if (dealsContainer) dealsContainer.style.display = 'grid';
      }, 1000);
    });
  </script>
</body>
</html>
