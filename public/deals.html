<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Exclusive Cruise Deals for Interline & Travel Industry Staff - Interline Asia">
  <title>Exclusive Cruise Deals - Interline Asia</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
  
  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="enhanced-deals-loader.js"></script>
  <script src="enhanced-deals-system.js"></script>
  <script src="js/loadPartials.js" defer></script>
  
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FYGT92WCXC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FYGT92WCXC');
  </script>
  
  <style>
    /* Modern Cruise Deals Styling */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      color: #1e293b;
      line-height: 1.6;
      min-height: 100vh;
    }
    
    /* Header Section */
    .deals-hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
      color: white;
      padding: 4rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .deals-hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="waves" patternUnits="userSpaceOnUse" width="100" height="100"><path d="M0,50 Q25,30 50,50 T100,50 V100 H0 Z" fill="rgba(255,255,255,0.05)"/></pattern></defs><rect width="100" height="100" fill="url(%23waves)"/></svg>');
      opacity: 0.3;
      animation: float 20s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    .deals-hero-content {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
    }
    
    .deals-hero h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .deals-hero p {
      font-size: 1.25rem;
      opacity: 0.9;
      margin-bottom: 2rem;
    }
    
    .deals-summary {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 1rem 2rem;
      display: inline-block;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    /* Filters Section */
    .filters-section {
      background: white;
      padding: 2rem;
      margin: -2rem 2rem 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      position: relative;
      z-index: 2;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .filters-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;
      gap: 1rem;
      align-items: end;
    }
    
    .filter-group {
      display: flex;
      flex-direction: column;
    }
    
    .filter-group label {
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #374151;
      font-size: 0.875rem;
    }
    
    .filter-input, .filter-select {
      padding: 0.75rem;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 0.875rem;
      transition: all 0.2s;
      background: white;
    }
    
    .filter-input:focus, .filter-select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    /* Main Content */
    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    /* Deals Grid */
    .deals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }
    
    .deal-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
      border: 1px solid #f1f5f9;
    }
    
    .deal-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }
    
    .deal-header {
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f1f5f9;
    }
    
    .cruise-logo {
      height: 40px;
      width: auto;
      max-width: 120px;
      object-fit: contain;
    }
    
    .cruise-type-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .cruise-type-badge.river-cruise {
      background: #dcfce7;
      color: #166534;
    }
    
    .cruise-type-badge.ocean-cruise {
      background: #dbeafe;
      color: #1e40af;
    }
    
    .cruise-type-badge.expedition-cruise {
      background: #fef3c7;
      color: #92400e;
    }
    
    .deal-content {
      padding: 1.5rem;
    }
    
    .ship-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.25rem;
    }
    
    .cruise-line {
      color: #64748b;
      font-weight: 500;
      margin-bottom: 1rem;
    }
    
    .deal-details {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    
    .detail-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: #64748b;
    }
    
    .detail-item i {
      color: #3b82f6;
      width: 16px;
    }
    
    .itinerary {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 1rem;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .pricing {
      margin-bottom: 1rem;
    }
    
    .price {
      font-size: 1.125rem;
      font-weight: 700;
    }
    
    .price.has-price {
      color: #059669;
    }
    
    .price.quote-only {
      color: #64748b;
    }
    
    .deal-actions {
      padding: 0 1.5rem 1.5rem;
    }
    
    .btn-view-details {
      width: 100%;
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-view-details:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }
    
    /* Loading State */
    .loading {
      text-align: center;
      padding: 4rem 2rem;
    }
    
    .loading i {
      font-size: 3rem;
      color: #3b82f6;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    /* No Deals State */
    .no-deals {
      text-align: center;
      padding: 4rem 2rem;
      color: #64748b;
    }
    
    .no-deals i {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }
    
    .no-deals h3 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #374151;
    }
    
    /* Responsive Design */
    @media (max-width: 768px) {
      .deals-hero {
        padding: 2rem 1rem;
      }
      
      .deals-hero h1 {
        font-size: 2rem;
      }
      
      .filters-section {
        margin: -1rem 1rem 1rem;
        padding: 1.5rem;
      }
      
      .filters-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      
      .main-content {
        padding: 1rem;
      }
      
      .deals-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
    }
    
    @media (max-width: 1024px) {
      .filters-grid {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 1rem;
      }
    }
  </style>
</head>

<body>
  <!-- Header Placeholder -->
  <div id="header-placeholder"></div>

  <!-- Hero Section -->
  <section class="deals-hero">
    <div class="deals-hero-content">
      <h1>Exclusive Cruise Deals</h1>
      <p>For Interline & Travel Industry Staff</p>
      <div class="deals-summary">
        <span id="deals-summary">Loading deals...</span>
      </div>
    </div>
  </section>

  <!-- Filters Section -->
  <section class="filters-section">
    <div class="filters-grid">
      <div class="filter-group">
        <label for="search-input">Search</label>
        <input type="text" id="search-input" class="filter-input" placeholder="Search cruise lines, ships, destinations...">
      </div>
      
      <div class="filter-group">
        <label for="cruise-line-filter">Cruise Line</label>
        <select id="cruise-line-filter" class="filter-select">
          <option value="">All Cruise Lines</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label for="cruise-type-filter">Cruise Type</label>
        <select id="cruise-type-filter" class="filter-select">
          <option value="">All Types</option>
          <option value="Ocean Cruise">Ocean Cruise</option>
          <option value="River Cruise">River Cruise</option>
          <option value="Expedition Cruise">Expedition Cruise</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label for="destination-filter">Destination</label>
        <input type="text" id="destination-filter" class="filter-input" placeholder="Region or destination">
      </div>
      
      <div class="filter-group">
        <label for="date-from-filter">From Date</label>
        <input type="date" id="date-from-filter" class="filter-input">
      </div>
      
      <div class="filter-group">
        <label for="date-to-filter">To Date</label>
        <input type="date" id="date-to-filter" class="filter-input">
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Loading State -->
    <div id="loading-state" class="loading">
      <i class="ri-loader-4-line"></i>
      <p>Loading cruise deals...</p>
    </div>

    <!-- Deals Grid -->
    <div id="deals-container" class="deals-grid" style="display: none;">
      <!-- Deals will be populated by JavaScript -->
    </div>
  </main>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <script>
    console.log('DEALS PAGE: Script starting...');
    
    // Enhanced sample deals data for fallback
    const SAMPLE_DEALS = [
      {
        id: 'sample_1',
        cruiseType: 'River Cruise',
        cruiseLine: 'AmaWaterways',
        shipName: 'AmaBella',
        region: 'Europe',
        nights: 7,
        departureDate: '2025-07-07',
        departurePort: 'Budapest, Hungary',
        arrivalPort: 'Vilshofen, Germany',
        itinerary: 'Melodies of the Danube 2025',
        insidePrice: 3440,
        oceanviewPrice: 4040,
        balconyPrice: 4640,
        suitePrice: 0
      },
      {
        id: 'sample_2',
        cruiseType: 'Ocean Cruise',
        cruiseLine: 'Crystal',
        shipName: 'Crystal Symphony',
        region: 'Europe',
        nights: 8,
        departureDate: '2025-07-10',
        departurePort: 'Thessaloniki',
        arrivalPort: 'Civitavecchia (Rome)',
        itinerary: 'Greek Isles & Italy',
        insidePrice: 3340,
        oceanviewPrice: 5090,
        balconyPrice: 6290,
        suitePrice: 0
      },
      {
        id: 'sample_3',
        cruiseType: 'Expedition Cruise',
        cruiseLine: 'Atlas',
        shipName: 'World Traveller',
        region: 'Arctic',
        nights: 11,
        departureDate: '2025-07-10',
        departurePort: 'Reykjavik',
        arrivalPort: 'Oslo',
        itinerary: 'Arctic Explorer',
        insidePrice: 6879,
        oceanviewPrice: 0,
        balconyPrice: 0,
        suitePrice: 0
      },
      {
        id: 'sample_4',
        cruiseType: 'Ocean Cruise',
        cruiseLine: 'Royal Caribbean',
        shipName: 'Allure of the Seas',
        region: 'Mediterranean',
        nights: 7,
        departureDate: '2025-08-15',
        departurePort: 'Barcelona',
        arrivalPort: 'Rome',
        itinerary: 'Western Mediterranean',
        insidePrice: 2890,
        oceanviewPrice: 3450,
        balconyPrice: 4200,
        suitePrice: 7500
      },
      {
        id: 'sample_5',
        cruiseType: 'River Cruise',
        cruiseLine: 'Viking',
        shipName: 'Viking Longship',
        region: 'Europe',
        nights: 8,
        departureDate: '2025-09-01',
        departurePort: 'Amsterdam',
        arrivalPort: 'Basel',
        itinerary: 'Rhine Getaway',
        insidePrice: 0,
        oceanviewPrice: 0,
        balconyPrice: 0,
        suitePrice: 0
      }
    ];

    // Initialize deals system
    document.addEventListener('DOMContentLoaded', async () => {
      console.log('DEALS PAGE: DOM loaded, initializing...');
      
      // Load header and footer immediately
      loadHeaderFooter();
      
      const loadingState = document.getElementById('loading-state');
      const dealsContainer = document.getElementById('deals-container');
      const summaryElement = document.getElementById('deals-summary');
      
      console.log('DEALS PAGE: Elements found:', {
        loadingState: !!loadingState,
        dealsContainer: !!dealsContainer,
        summaryElement: !!summaryElement
      });

      try {
        console.log('DEALS PAGE: Checking for enhanced deals system...');
        console.log('EnhancedDealsLoader available:', !!window.EnhancedDealsLoader);
        console.log('EnhancedDealsSystem available:', !!window.EnhancedDealsSystem);
        
        let deals = [];
        
        // Try to load from Supabase directly first
        try {
          console.log('SUPABASE: Attempting direct Supabase connection...');
          if (window.supabase && window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
            const supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
            console.log('SUPABASE: Supabase client created');
            
            // Try different table names that might contain cruise data
            const tableNames = ['cruise_deals', 'deals', 'cruises', 'cruise_data', 'bookings'];
            let data = null;
            let error = null;
            
            for (const tableName of tableNames) {
              try {
                console.log(`DEALS PAGE: Trying table: ${tableName}`);
                const result = await supabaseClient
                  .from(tableName)
                  .select('*')
                  .limit(50);
                
                if (!result.error && result.data && result.data.length > 0) {
                  console.log(`DEALS PAGE: Found ${result.data.length} records in table: ${tableName}`);
                  console.log('DEALS PAGE: Sample record:', result.data[0]);
                  data = result.data;
                  error = null;
                  break;
                } else if (result.error) {
                  console.log(`DEALS PAGE: Table ${tableName} error:`, result.error.message);
                }
              } catch (tableError) {
                console.log(`DEALS PAGE: Failed to query ${tableName}:`, tableError.message);
              }
            }
            
            if (error) {
              console.error('DEALS PAGE: Supabase error:', error);
            } else if (data && data.length > 0) {
              console.log('DEALS PAGE: Processing', data.length, 'records from Supabase');
              
              // Try to map the data intelligently based on available fields
              deals = data.map((deal, index) => {
                // Try different field name variations
                const getId = () => deal.id || deal.deal_id || deal.cruise_id || `supabase_${index}`;
                const getCruiseLine = () => deal.cruise_line || deal.cruiseline || deal['Cruise Line'] || deal.operator || 'Unknown Cruise Line';
                const getShipName = () => deal.ship_name || deal.shipname || deal.Ship || deal.vessel || 'Unknown Ship';
                const getRegion = () => deal.region || deal.Region || deal.destination || deal.area || 'Unknown Region';
                const getNights = () => parseInt(deal.nights || deal.Nights || deal.duration || 7);
                const getDepartureDate = () => deal.departure_date || deal.Date || deal.sail_date || '2025-12-31';
                const getDeparturePort = () => deal.departure_port || deal.From || deal.embark_port || 'Unknown Port';
                const getArrivalPort = () => deal.arrival_port || deal.To || deal.disembark_port || 'Unknown Port';
                const getItinerary = () => deal.itinerary || deal.Itinerary || deal.description || '';
                
                return {
                  id: getId(),
                  cruiseType: deal.cruise_type || deal.type || 'Ocean Cruise',
                  cruiseLine: getCruiseLine(),
                  shipName: getShipName(),
                  region: getRegion(),
                  nights: getNights(),
                  departureDate: getDepartureDate(),
                  departurePort: getDeparturePort(),
                  arrivalPort: getArrivalPort(),
                  itinerary: getItinerary(),
                  insidePrice: parseFloat(deal.inside_price || deal.Inside || deal.interior_price || 0),
                  oceanviewPrice: parseFloat(deal.oceanview_price || deal.Oceanview || deal.ocean_view_price || 0),
                  balconyPrice: parseFloat(deal.balcony_price || deal.Balcony || deal.balcony || 0),
                  suitePrice: parseFloat(deal.suite_price || deal.Suite || deal.suite || 0)
                };
              });
              
              console.log('DEALS PAGE: Mapped deals:', deals.slice(0, 2)); // Show first 2 for debugging
            } else {
              console.log('DEALS PAGE: No deals found in any Supabase table');
            }
          }
        } catch (error) {
          console.error('DEALS PAGE: Direct Supabase connection failed:', error);
        }
        
        // Try enhanced system as fallback
        if ((!deals || deals.length === 0) && window.EnhancedDealsLoader) {
          try {
            console.log('DEALS PAGE: Attempting to load from enhanced system...');
            const dealsLoader = new window.EnhancedDealsLoader();
            await dealsLoader.initialize();
            deals = await dealsLoader.loadAllDeals();
            console.log('DEALS PAGE: Loaded deals from enhanced system:', deals.length);
          } catch (error) {
            console.warn('DEALS PAGE: Enhanced system failed:', error);
            deals = [];
          }
        }
        
        // Fallback to sample data if no deals loaded
        if (!deals || deals.length === 0) {
          console.log('DEALS PAGE: Using sample deals fallback');
          deals = SAMPLE_DEALS;
        }
        
        // Update summary
        if (summaryElement) {
          summaryElement.textContent = `Showing ${deals.length} deals`;
        }
        
        // Store deals globally for filtering
        window.allDeals = deals;
        window.filteredDeals = deals;
        
        // Populate filter dropdowns
        populateFilters(deals);
        
        // Setup filter event listeners
        setupFilters();
        
        // Render deals
        renderDeals(deals, dealsContainer);
        
        // Hide loading and show deals
        if (loadingState) loadingState.style.display = 'none';
        if (dealsContainer) dealsContainer.style.display = 'grid';
        
        console.log('DEALS PAGE: Successfully initialized with', deals.length, 'deals');
        
      } catch (error) {
        console.error('DEALS PAGE: Critical error:', error);
        
        // Show sample deals even on error
        if (summaryElement) {
          summaryElement.textContent = `Showing ${SAMPLE_DEALS.length} deals`;
        }
        renderDeals(SAMPLE_DEALS, dealsContainer);
        
        if (loadingState) loadingState.style.display = 'none';
        if (dealsContainer) dealsContainer.style.display = 'grid';
      }
    });

    // Render deals function
    function renderDeals(deals, container) {
      if (!container || !deals) return;
      
      console.log('DEALS PAGE: Rendering', deals.length, 'deals');
      
      container.innerHTML = deals.map(deal => {
        const logoPath = getCruiseLineLogo(deal.cruiseLine);
        const bestPrice = getBestPrice(deal);
        const priceDisplay = formatPrice(bestPrice);
        
        return `
          <div class="deal-card" data-deal-id="${deal.id}">
            <div class="deal-header">
              <img src="${logoPath}" 
                   alt="${deal.cruiseLine || 'Cruise Line'}" 
                   class="cruise-logo"
                   onerror="this.src='/logos/cruiselines/placeholder.png'">
              <div class="cruise-type-badge ${(deal.cruiseType || 'ocean-cruise').toLowerCase().replace(' ', '-')}">${deal.cruiseType || 'Ocean Cruise'}</div>
            </div>
            
            <div class="deal-content">
              <h3 class="ship-name">${deal.shipName}</h3>
              <p class="cruise-line">${deal.cruiseLine}</p>
              
              <div class="deal-details">
                <div class="detail-item">
                  <i class="ri-map-pin-line"></i>
                  <span>${deal.region || deal.departurePort}</span>
                </div>
                <div class="detail-item">
                  <i class="ri-calendar-line"></i>
                  <span>${formatDate(deal.departureDate)}</span>
                </div>
                <div class="detail-item">
                  <i class="ri-time-line"></i>
                  <span>${deal.nights} nights</span>
                </div>
              </div>
              
              ${deal.itinerary ? `<p class="itinerary">${deal.itinerary}</p>` : ''}
              
              <div class="pricing">
                <span class="price ${bestPrice > 0 ? 'has-price' : 'quote-only'}">
                  ${priceDisplay}
                </span>
              </div>
            </div>
            
            <div class="deal-actions">
              <button class="btn-view-details" onclick="window.location.href='/deal-details.html?id=${deal.id}'">
                View Details
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Helper functions
    function getCruiseLineLogo(cruiseLine) {
      if (!cruiseLine) return '/logos/cruiselines/placeholder.png';
      
      const slug = cruiseLine.toLowerCase()
        .replace(/[^a-z0-9\s]/g, '')
        .replace(/\s+/g, '-')
        .trim();
      
      return `/logos/cruiselines/${slug}.png`;
    }

    function getBestPrice(deal) {
      const prices = [deal.insidePrice, deal.oceanviewPrice, deal.balconyPrice, deal.suitePrice]
        .filter(p => p && p > 0);
      return prices.length > 0 ? Math.min(...prices) : 0;
    }

    function formatPrice(price) {
      if (!price || price === 0) {
        return 'Quote Available';
      }
      return `From $${price.toLocaleString()} per person`;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      if (isNaN(date.getTime())) return dateStr;
      
      return date.toLocaleDateString('en-AU', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });
    }

    // Populate filter dropdowns
    function populateFilters(deals) {
      console.log('DEALS PAGE: Populating filters with', deals.length, 'deals');
      
      // Populate cruise lines
      const cruiseLineFilter = document.getElementById('cruise-line-filter');
      if (cruiseLineFilter) {
        const cruiseLines = [...new Set(deals.map(d => d.cruiseLine))].filter(Boolean).sort();
        cruiseLineFilter.innerHTML = '<option value="">All Cruise Lines</option>' +
          cruiseLines.map(line => `<option value="${line}">${line}</option>`).join('');
        console.log('DEALS PAGE: Added', cruiseLines.length, 'cruise lines to filter');
      }
    }

    // Setup filter event listeners
    function setupFilters() {
      console.log('DEALS PAGE: Setting up filter event listeners');
      
      const searchInput = document.getElementById('search-input');
      const cruiseLineFilter = document.getElementById('cruise-line-filter');
      const cruiseTypeFilter = document.getElementById('cruise-type-filter');
      const destinationFilter = document.getElementById('destination-filter');
      const dateFromFilter = document.getElementById('date-from-filter');
      const dateToFilter = document.getElementById('date-to-filter');

      if (searchInput) {
        searchInput.addEventListener('input', applyFilters);
      }
      if (cruiseLineFilter) {
        cruiseLineFilter.addEventListener('change', applyFilters);
      }
      if (cruiseTypeFilter) {
        cruiseTypeFilter.addEventListener('change', applyFilters);
      }
      if (destinationFilter) {
        destinationFilter.addEventListener('input', applyFilters);
      }
      if (dateFromFilter) {
        dateFromFilter.addEventListener('change', applyFilters);
      }
      if (dateToFilter) {
        dateToFilter.addEventListener('change', applyFilters);
      }
    }

    // Apply filters function
    function applyFilters() {
      if (!window.allDeals) return;
      
      const searchTerm = document.getElementById('search-input')?.value.toLowerCase() || '';
      const cruiseLine = document.getElementById('cruise-line-filter')?.value || '';
      const cruiseType = document.getElementById('cruise-type-filter')?.value || '';
      const destination = document.getElementById('destination-filter')?.value.toLowerCase() || '';
      const dateFrom = document.getElementById('date-from-filter')?.value || '';
      const dateTo = document.getElementById('date-to-filter')?.value || '';

      console.log('DEALS PAGE: Applying filters:', { searchTerm, cruiseLine, cruiseType, destination, dateFrom, dateTo });

      window.filteredDeals = window.allDeals.filter(deal => {
        // Search filter
        if (searchTerm) {
          const searchableText = `${deal.cruiseLine} ${deal.shipName} ${deal.region} ${deal.itinerary}`.toLowerCase();
          if (!searchableText.includes(searchTerm)) return false;
        }

        // Cruise line filter
        if (cruiseLine && deal.cruiseLine !== cruiseLine) {
          return false;
        }

        // Cruise type filter
        if (cruiseType && deal.cruiseType !== cruiseType) {
          return false;
        }

        // Destination filter
        if (destination) {
          const destText = `${deal.region} ${deal.departurePort} ${deal.arrivalPort}`.toLowerCase();
          if (!destText.includes(destination)) return false;
        }

        // Date filters
        if (dateFrom && deal.departureDate < dateFrom) {
          return false;
        }
        if (dateTo && deal.departureDate > dateTo) {
          return false;
        }

        return true;
      });

      console.log('DEALS PAGE: Filtered to', window.filteredDeals.length, 'deals');

      // Update summary
      const summaryElement = document.getElementById('deals-summary');
      if (summaryElement) {
        summaryElement.textContent = `Showing ${window.filteredDeals.length} of ${window.allDeals.length} deals`;
      }

      // Re-render deals
      const dealsContainer = document.getElementById('deals-container');
      renderDeals(window.filteredDeals, dealsContainer);
    }

    // Global function for header/footer loading
    function loadHeaderFooter() {
      console.log('DEALS PAGE: Loading header and footer...');
      
      const loadPartial = (selector, url) => {
        const el = document.querySelector(selector);
        if (!el) {
          console.warn(`PARTIAL: Skipping ${selector}, not found on this page.`);
          return;
        }

        console.log(`PARTIAL: Loading ${url} into ${selector}`);
        fetch(url)
          .then(response => {
            console.log(`PARTIAL: Response for ${url}:`, response.status);
            if (!response.ok) {
              throw new Error(`Could not load ${url}: ${response.statusText}`);
            }
            return response.text();
          })
          .then(data => {
            el.innerHTML = data;
            console.log(`PARTIAL: Loaded ${url} into ${selector}`);
          })
          .catch(error => {
            console.error(`PARTIAL: Error loading ${url}:`, error);
          });
      };

      loadPartial("#header-placeholder", "/partials/header.html");
      loadPartial("#footer-placeholder", "/partials/footer.html");
    }
  </script>
</body>
