<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interline Asia - Exclusive cruise deals and luxury travel offers">
  <title>Cruise Deals - Interline Asia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Remix Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FYGT92WCXC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FYGT92WCXC');
  </script>
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      min-height: 100vh;
    }
    
    /* Custom Tailwind config */
    .deal-tile {
      background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(226, 232, 240, 0.5);
    }
    
    .deal-tile:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      border-color: #FF7F41;
    }
    
    .cruise-logo {
      width: 60px;
      height: 40px;
      object-fit: contain;
      border-radius: 8px;
      background: #f1f5f9;
      padding: 4px;
    }
    
    .price-gradient {
      background: linear-gradient(135deg, #FF7F41 0%, #e66a2e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .tag-badge {
      background: linear-gradient(135deg, #0C1E36 0%, #08152B 100%);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      display: inline-block;
    }
    
    .expiry-warning {
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      color: #92400e;
      border: 1px solid #f59e0b;
    }
    
    .expiry-urgent {
      background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
      color: #dc2626;
      border: 1px solid #ef4444;
    }
    
    .loading-shimmer {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }
    
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    
    .filter-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(226, 232, 240, 0.5);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-200 min-h-screen">
  <div id="header-placeholder"></div>
  
  <!-- Main Container -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Header Section -->
    <div class="text-center mb-12">
      <div class="flex flex-col lg:flex-row lg:justify-between lg:items-center mb-6">
        <div class="mb-4 lg:mb-0">
          <h1 class="text-4xl lg:text-5xl font-bold text-slate-800 mb-3">
            <i class="ri-ship-line mr-3 text-orange-500"></i>Exclusive Cruise Deals
          </h1>
          <p class="text-xl text-slate-600 max-w-2xl mx-auto lg:mx-0">
            Discover luxury cruise experiences with insider rates and VIP access
          </p>
        </div>
        
        <!-- User info and sign out section -->
        <div id="user-info-section" class="hidden lg:flex items-center gap-4 bg-white/80 backdrop-blur-sm rounded-full px-6 py-3 shadow-lg">
          <a href="/dashboard.html" class="text-slate-600 hover:text-orange-500 text-sm font-medium transition-colors duration-200">
            <i class="ri-dashboard-line mr-1"></i> Dashboard
          </a>
          <span id="user-display-name" class="text-slate-700 font-medium"></span>
          <button onclick="handleSignOut()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-full text-sm font-medium transition-colors duration-200">
            <i class="ri-logout-box-line mr-1"></i> Sign Out
          </button>
        </div>
      </div>
    </div>
    
    <!-- Filter Section -->
    <div class="filter-card rounded-2xl p-6 mb-8 shadow-lg">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="space-y-2">
          <label for="cruiseLineFilter" class="block text-sm font-semibold text-slate-700">
            <i class="ri-ship-line mr-1"></i> Cruise Line
          </label>
          <select id="cruiseLineFilter" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-colors bg-white">
            <option value="">All Cruise Lines</option>
          </select>
        </div>
        
        <div class="space-y-2">
          <label for="regionFilter" class="block text-sm font-semibold text-slate-700">
            <i class="ri-map-pin-line mr-1"></i> Destination
          </label>
          <select id="regionFilter" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-colors bg-white">
            <option value="">All Destinations</option>
          </select>
        </div>
        
        <div class="space-y-2">
          <label for="sortFilter" class="block text-sm font-semibold text-slate-700">
            <i class="ri-sort-asc mr-1"></i> Sort by Price
          </label>
          <select id="sortFilter" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-colors bg-white">
            <option value="">Default Order</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
          </select>
        </div>
        
        <div class="flex items-end">
          <button id="clearFilters" class="w-full bg-slate-600 hover:bg-slate-700 text-white px-6 py-3 rounded-xl font-medium transition-colors duration-200">
            <i class="ri-refresh-line mr-1"></i> Clear Filters
          </button>
        </div>
      </div>
    </div>
    
    <!-- Deals Container -->
    <div id="deals-container">
      <!-- Loading State -->
      <div class="text-center py-16">
        <div class="loading-shimmer w-16 h-16 rounded-full mx-auto mb-4"></div>
        <p class="text-xl text-slate-600 font-medium">Loading amazing cruise deals...</p>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="/js/loadPartials.js" defer></script>
  <script>
    // Global variables to store all deals and filtered deals
    let allDeals = [];
    let filteredDeals = [];
    
    // Cruise line logo mapping
    const cruiseLogos = {
      'Royal Caribbean': '/logos/cruiselines/royal-caribbean.png',
      'Norwegian': '/logos/cruiselines/norwegian.png',
      'Celebrity': '/logos/cruiselines/celebrity.png',
      'Princess': '/logos/cruiselines/princess.png',
      'Holland America': '/logos/cruiselines/holland-america.png',
      'MSC': '/logos/cruiselines/msc.png',
      'Carnival': '/logos/cruiselines/carnival.png',
      'Cunard': '/logos/cruiselines/cunard.png',
      'Oceania': '/logos/cruiselines/oceania.png',
      'Regent': '/logos/cruiselines/regent.png',
      'Seabourn': '/logos/cruiselines/seabourn.png',
      'Silversea': '/logos/cruiselines/silversea.png',
      'Crystal': '/logos/cruiselines/crystal.png',
      'Azamara': '/logos/cruiselines/azamara.png'
    };
    
    // Format price with currency symbol
    function formatPrice(price, currency = 'USD') {
      if (price === 'Quote Available' || !price) return 'Quote Available';
      
      const numPrice = parseFloat(String(price).replace(/[^0-9.-]/g, ''));
      if (isNaN(numPrice)) return price;
      
      const currencySymbol = currency === 'AUD' ? 'A$' : '$';
      return currencySymbol + numPrice.toLocaleString();
    }
    
    // Format date to readable format
    function formatDate(dateString) {
      try {
        const date = new Date(dateString);
        if (!isNaN(date.getTime())) {
          return date.toLocaleDateString('en-US', { 
            year: 'numeric', 
            month: 'short', 
            day: 'numeric' 
          });
        }
      } catch (e) {
        console.log('Date parsing error:', e);
      }
      return dateString;
    }
    
    // Get cruise line logo
    function getCruiseLogo(cruiseLine) {
      return cruiseLogos[cruiseLine] || '/logos/cruiselines/placeholder.png';
    }
    
    // Generate tags based on deal data
    function generateTags(deal) {
      const tags = [];
      
      if (deal.nights >= 14) tags.push('Extended');
      if (deal.nights <= 7) tags.push('Short Break');
      if (deal.region && deal.region.toLowerCase().includes('mediterranean')) tags.push('Mediterranean');
      if (deal.region && deal.region.toLowerCase().includes('caribbean')) tags.push('Caribbean');
      if (deal.region && deal.region.toLowerCase().includes('alaska')) tags.push('Alaska');
      if (deal.region && deal.region.toLowerCase().includes('asia')) tags.push('Asia');
      if (deal.suitePrice && deal.suitePrice !== 'Quote Available') tags.push('Luxury');
      if (deal.balconyPrice && deal.balconyPrice !== 'Quote Available') tags.push('Balcony');
      
      return tags.slice(0, 3); // Limit to 3 tags
    }
    
    // Check if deal is expiring soon
    function getExpiryStatus(deal) {
      // For now, we'll simulate expiry dates
      // In real implementation, this would come from the database
      const random = Math.random();
      if (random < 0.1) return 'urgent'; // 10% urgent
      if (random < 0.3) return 'warning'; // 20% warning
      return null;
    }
    
    // Create a beautiful deal tile
    function createDealTile(deal) {
      const tags = generateTags(deal);
      const expiryStatus = getExpiryStatus(deal);
      const logo = getCruiseLogo(deal.cruiseLine);
      
      const expiryBadge = expiryStatus ? `
        <div class="absolute top-4 right-4 px-3 py-1 rounded-full text-xs font-semibold ${
          expiryStatus === 'urgent' ? 'expiry-urgent' : 'expiry-warning'
        }">
          <i class="ri-time-line mr-1"></i>
          ${expiryStatus === 'urgent' ? 'Expires Soon!' : 'Limited Time'}
        </div>
      ` : '';
      
      return `
        <div class="deal-tile p-6 relative overflow-hidden group cursor-pointer">
          ${expiryBadge}
          
          <!-- Cruise Line Header -->
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center space-x-3">
              <img src="${logo}" alt="${deal.cruiseLine}" class="cruise-logo" 
                   onerror="this.src='/logos/cruiselines/placeholder.png'">
              <div>
                <h3 class="font-bold text-slate-800 text-lg">${deal.cruiseLine}</h3>
                <p class="text-sm text-slate-500">${deal.shipName}</p>
              </div>
            </div>
          </div>
          
          <!-- Destination & Date -->
          <div class="mb-4">
            <div class="flex items-center text-slate-600 mb-2">
              <i class="ri-map-pin-line mr-2 text-orange-500"></i>
              <span class="font-medium">${deal.region || 'Multiple Destinations'}</span>
            </div>
            <div class="flex items-center text-slate-600 mb-2">
              <i class="ri-calendar-line mr-2 text-blue-500"></i>
              <span>${formatDate(deal.departureDate)}</span>
              <span class="mx-2">•</span>
              <span>${deal.nights} nights</span>
            </div>
            <div class="flex items-center text-slate-600">
              <i class="ri-route-line mr-2 text-green-500"></i>
              <span class="text-sm">${deal.from || 'Various Ports'} → ${deal.to || 'Round Trip'}</span>
            </div>
          </div>
          
          <!-- Cabin Types & Prices -->
          <div class="mb-4 space-y-2">
            ${deal.insidePrice && deal.insidePrice !== 'Quote Available' ? `
              <div class="flex justify-between items-center py-2 px-3 bg-slate-50 rounded-lg">
                <span class="text-sm font-medium text-slate-700">
                  <i class="ri-home-4-line mr-1"></i>Interior
                </span>
                <span class="font-bold text-slate-800">${formatPrice(deal.insidePrice)}</span>
              </div>
            ` : ''}
            
            ${deal.oceanviewPrice && deal.oceanviewPrice !== 'Quote Available' ? `
              <div class="flex justify-between items-center py-2 px-3 bg-blue-50 rounded-lg">
                <span class="text-sm font-medium text-blue-700">
                  <i class="ri-landscape-line mr-1"></i>Oceanview
                </span>
                <span class="font-bold text-blue-800">${formatPrice(deal.oceanviewPrice)}</span>
              </div>
            ` : ''}
            
            ${deal.balconyPrice && deal.balconyPrice !== 'Quote Available' ? `
              <div class="flex justify-between items-center py-2 px-3 bg-emerald-50 rounded-lg">
                <span class="text-sm font-medium text-emerald-700">
                  <i class="ri-door-open-line mr-1"></i>Balcony
                </span>
                <span class="font-bold text-emerald-800">${formatPrice(deal.balconyPrice)}</span>
              </div>
            ` : ''}
            
            ${deal.suitePrice && deal.suitePrice !== 'Quote Available' ? `
              <div class="flex justify-between items-center py-2 px-3 bg-purple-50 rounded-lg">
                <span class="text-sm font-medium text-purple-700">
                  <i class="ri-vip-crown-line mr-1"></i>Suite
                </span>
                <span class="font-bold text-purple-800">${formatPrice(deal.suitePrice)}</span>
              </div>
            ` : ''}
          </div>
          
          <!-- Tags -->
          ${tags.length > 0 ? `
            <div class="mb-4 flex flex-wrap gap-2">
              ${tags.map(tag => `<span class="tag-badge">${tag}</span>`).join('')}
            </div>
          ` : ''}
          
          <!-- Starting Price -->
          <div class="mb-4 text-center">
            <p class="text-sm text-slate-500 mb-1">Starting from</p>
            <p class="text-3xl font-bold price-gradient">
              ${formatPrice(deal.insidePrice || deal.oceanviewPrice || deal.balconyPrice || 'Quote Available')}
            </p>
            <p class="text-xs text-slate-400">per person</p>
          </div>
          
          <!-- View Deal Button -->
          <button class="w-full bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-semibold py-3 px-6 rounded-xl transition-all duration-200 transform hover:scale-105 shadow-lg">
            <i class="ri-eye-line mr-2"></i>View Deal Details
          </button>
        </div>
      `;
    }
    
    // Render deals in responsive grid
    function renderDeals(deals) {
      const container = document.getElementById('deals-container');
      
      if (!deals || deals.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16">
            <div class="w-24 h-24 mx-auto mb-6 bg-slate-200 rounded-full flex items-center justify-center">
              <i class="ri-ship-line text-4xl text-slate-400"></i>
            </div>
            <h3 class="text-2xl font-bold text-slate-600 mb-2">No deals found</h3>
            <p class="text-slate-500 mb-6">Try adjusting your filters to see more cruise deals</p>
            <button onclick="clearFilters()" class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-3 rounded-xl font-medium transition-colors">
              <i class="ri-refresh-line mr-2"></i>Clear Filters
            </button>
          </div>
        `;
        return;
      }
      
      // Create responsive grid
      const html = `
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
          ${deals.map(deal => createDealTile(deal)).join('')}
        </div>
        
        <!-- Results Summary -->
        <div class="text-center py-8">
          <p class="text-slate-600">
            Showing <span class="font-semibold text-slate-800">${deals.length}</span> 
            ${deals.length === 1 ? 'deal' : 'deals'}
          </p>
        </div>
      `;
      
      container.innerHTML = html;
    }
    
    // Populate filter dropdowns
    function populateFilters(deals) {
      const cruiseLines = [...new Set(deals.map(deal => deal.cruiseLine))].sort();
      const regions = [...new Set(deals.map(deal => deal.region))].filter(r => r).sort();
      
      const cruiseLineSelect = document.getElementById('cruiseLineFilter');
      const regionSelect = document.getElementById('regionFilter');
      
      // Clear existing options (except first)
      cruiseLineSelect.innerHTML = '<option value="">All Cruise Lines</option>';
      regionSelect.innerHTML = '<option value="">All Destinations</option>';
      
      cruiseLines.forEach(line => {
        cruiseLineSelect.innerHTML += `<option value="${line}">${line}</option>`;
      });
      
      regions.forEach(region => {
        regionSelect.innerHTML += `<option value="${region}">${region}</option>`;
      });
    }
    
    // Apply filters and sorting
    function applyFilters() {
      const cruiseLineFilter = document.getElementById('cruiseLineFilter').value;
      const regionFilter = document.getElementById('regionFilter').value;
      const sortFilter = document.getElementById('sortFilter').value;
      
      filteredDeals = allDeals.filter(deal => {
        if (cruiseLineFilter && deal.cruiseLine !== cruiseLineFilter) return false;
        if (regionFilter && deal.region !== regionFilter) return false;
        return true;
      });
      
      // Apply sorting
      if (sortFilter === 'price-low' || sortFilter === 'price-high') {
        filteredDeals.sort((a, b) => {
          const priceA = parseFloat(String(a.insidePrice || a.oceanviewPrice || a.balconyPrice || '999999').replace(/[^0-9.-]/g, '')) || 999999;
          const priceB = parseFloat(String(b.insidePrice || b.oceanviewPrice || b.balconyPrice || '999999').replace(/[^0-9.-]/g, '')) || 999999;
          
          return sortFilter === 'price-low' ? priceA - priceB : priceB - priceA;
        });
      }
      
      renderDeals(filteredDeals);
    }
    
    // Clear all filters
    function clearFilters() {
      document.getElementById('cruiseLineFilter').value = '';
      document.getElementById('regionFilter').value = '';
      document.getElementById('sortFilter').value = '';
      filteredDeals = [...allDeals];
      renderDeals(filteredDeals);
    }
    
    // Fetch and display deals from Supabase
    async function loadDeals() {
      try {
        // Initialize Supabase client
        const supabaseUrl = window.SUPABASE_URL;
        const supabaseAnonKey = window.SUPABASE_ANON_KEY;
        
        if (!supabaseUrl || !supabaseAnonKey) {
          throw new Error('Supabase configuration missing');
        }
        
        const { createClient } = supabase;
        const supabaseClient = createClient(supabaseUrl, supabaseAnonKey);
        
        // Fetch cruise deals from Supabase (try deals_dashboard first, fallback to deals)
        let { data: deals, error } = await supabaseClient
          .from('deals_dashboard')
          .select('*')
          .order('departure_date', { ascending: true });
          
        // If deals_dashboard doesn't exist, try deals table directly
        if (error && (error.message.includes('does not exist') || error.message.includes('relation'))) {
          const { data: fallbackDeals, error: fallbackError } = await supabaseClient
            .from('deals')
            .select('*')
            .order('departure_date', { ascending: true });
          
          deals = fallbackDeals;
          error = fallbackError;
        }
        
        if (error) {
          // If table doesn't exist, try to create it and populate with sample data
          if (error.message.includes('does not exist') || error.message.includes('relation') || error.message.includes('table')) {
            console.log('Deals table does not exist, creating it...');
            await createDealsTableAndData(supabaseClient);
            
            // Try to fetch again after creating table (use deals table directly)
            const { data: retryDeals, error: retryError } = await supabaseClient
              .from('deals')
              .select('*')
              .order('departure_date', { ascending: true });
            
            if (retryError) {
              throw new Error('Failed to load deals after table creation: ' + retryError.message);
            }
            
            deals = retryDeals;
          } else {
            throw new Error('Failed to load deals: ' + error.message);
          }
        }
        
        // Convert Supabase data to frontend format
        const formattedDeals = deals.map(deal => ({
          id: deal.id,
          cruiseLine: deal.cruise_line,
          shipName: deal.ship_name,
          departureDate: deal.departure_date,
          region: deal.region || 'Other',
          nights: deal.duration || '',
          from: 'Various Ports',
          to: 'Round Trip',
          itinerary: deal.itinerary || '',
          insidePrice: deal.price || null,
          oceanviewPrice: null,
          balconyPrice: null,
          suitePrice: null,
          currency: 'USD',
          seq: deal.id || ''
        }));
        
        allDeals = formattedDeals;
        filteredDeals = [...formattedDeals];
        
        populateFilters(formattedDeals);
        renderDeals(filteredDeals);
        
        // Add event listeners
        document.getElementById('cruiseLineFilter').addEventListener('change', applyFilters);
        document.getElementById('regionFilter').addEventListener('change', applyFilters);
        document.getElementById('sortFilter').addEventListener('change', applyFilters);
        document.getElementById('clearFilters').addEventListener('click', clearFilters);
        
      } catch (error) {
        console.error('Error loading deals:', error);
        console.log('Loading fallback deals data...');
        
        // Use fallback static deals data
        const fallbackDeals = [
          {
            id: 1,
            cruise_line: 'Royal Caribbean',
            ship_name: 'Symphony of the Seas',
            cruise_name: 'Caribbean Adventure',
            departure_date: '2024-12-15',
            return_date: '2024-12-22',
            price: 1299,
            cabin_type: 'Interior',
            category: 'standard',
            itinerary: 'Miami - Cozumel - Jamaica - Miami',
            region: 'Caribbean',
            duration: 7,
            description: 'Explore the beautiful Caribbean islands with Royal Caribbean'
          },
          {
            id: 2,
            cruise_line: 'Norwegian',
            ship_name: 'Norwegian Escape',
            cruise_name: 'Mediterranean Explorer',
            departure_date: '2024-12-20',
            return_date: '2024-12-30',
            price: 1899,
            cabin_type: 'Balcony',
            category: 'premium',
            itinerary: 'Barcelona - Rome - Naples - Barcelona',
            region: 'Mediterranean',
            duration: 10,
            description: 'Discover the Mediterranean with Norwegian Cruise Line'
          },
          {
            id: 3,
            cruise_line: 'Celebrity',
            ship_name: 'Celebrity Eclipse',
            cruise_name: 'Alaska Glacier Bay',
            departure_date: '2025-01-10',
            return_date: '2025-01-17',
            price: 2299,
            cabin_type: 'Suite',
            category: 'luxury',
            itinerary: 'Seattle - Juneau - Glacier Bay - Seattle',
            region: 'Alaska',
            duration: 7,
            description: 'Experience the majesty of Alaska with Celebrity Cruises'
          },
          {
            id: 4,
            cruise_line: 'Princess',
            ship_name: 'Crown Princess',
            cruise_name: 'Asia Discovery',
            departure_date: '2025-01-15',
            return_date: '2025-01-29',
            price: 3299,

    // Handle sign out functionality
    function handleSignOut() {
      if (window.supabaseClient) {
        window.supabaseClient.signOut();
      } else {
        window.location.href = '/login';
      }
    }
    
    // Update user info section
    function updateUserInfo() {
      try {
        if (window.supabaseClient && window.supabaseClient.isLoggedIn()) {
          const user = window.supabaseClient.currentUser;
          const displayName = user?.full_name || user?.email?.split('@')[0] || 'User';
          const isAdmin = user?.is_admin || user?.is_super_admin || user?.role === 'admin';
          
          document.getElementById('user-display-name').textContent = `${displayName}${isAdmin ? ' (Admin)' : ' (Member)'}`;
          document.getElementById('user-info-section').classList.remove('hidden');
          document.getElementById('user-info-section').classList.add('flex');
        } else {
          document.getElementById('user-info-section').classList.add('hidden');
        }
      } catch (error) {
        console.log('User info update skipped:', error.message);
      }
    }
    
    // Check authentication before loading deals
    async function checkAuthAndLoadDeals() {
      try {
        // Initialize Supabase client first
        const supabaseUrl = window.SUPABASE_URL;
        const supabaseAnonKey = window.SUPABASE_ANON_KEY;
        
        if (!supabaseUrl || !supabaseAnonKey) {
          console.warn('Supabase config missing, loading fallback deals...');
          await loadDeals(); // Load fallback deals instead of redirecting
          return;
        }
        
        const { createClient } = supabase;
        const supabaseClient = createClient(supabaseUrl, supabaseAnonKey);
        
        // Check if user is authenticated
        const { data: { session } } = await supabaseClient.auth.getSession();
        
        if (!session) {
          // Not logged in, but still show deals (remove auth requirement temporarily)
          console.warn('User not authenticated, but showing deals anyway...');
          await loadDeals();
          return;
        }
        
        // User is authenticated, proceed to load deals
        await loadDeals();
        
      } catch (error) {
        console.error('Authentication check failed, loading fallback deals:', error);
        await loadDeals(); // Load fallback deals instead of redirecting
      }
    }

    // Load deals when page loads
    document.addEventListener('DOMContentLoaded', async function() {
      await checkAuthAndLoadDeals();
      
      // Update user info after a short delay to ensure supabase client is ready
      setTimeout(async () => {
        try {
          if (window.supabaseClient) {
            await window.supabaseClient.readyPromise;
            updateUserInfo();
          }
        } catch (error) {
          console.log('User info initialization skipped:', error.message);
        }
      }, 500);
    });
