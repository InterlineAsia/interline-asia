<!DOCTYPE html>
<html>
<head>
    <title>Console Debug View</title>
    <meta charset="utf-8">
    <style>
        #console-log {
            font-family: monospace;
            white-space: pre-wrap;
            padding: 10px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h2>Console Debug View</h2>
    <div id="console-log"></div>
    <button onclick="clearLog()">Clear Log</button>
    <hr>
    <iframe id="deals-iframe" src="/public/deals.html"></iframe>

    <script>
        const consoleLogDiv = document.getElementById('console-log');
        let logMessages = [];

        // Override console methods in the iframe
        function setupIframeConsoleOverride() {
            const iframe = document.getElementById('deals-iframe');
            iframe.onload = function() {
                const iframeWindow = iframe.contentWindow;
                const originalConsole = {
                    log: iframeWindow.console.log,
                    warn: iframeWindow.console.warn,
                    error: iframeWindow.console.error,
                    info: iframeWindow.console.info
                };

                // Override console methods
                iframeWindow.console.log = function() {
                    originalConsole.log.apply(this, arguments);
                    captureLog('LOG', arguments);
                };

                iframeWindow.console.warn = function() {
                    originalConsole.warn.apply(this, arguments);
                    captureLog('WARN', arguments);
                };

                iframeWindow.console.error = function() {
                    originalConsole.error.apply(this, arguments);
                    captureLog('ERROR', arguments);
                };

                iframeWindow.console.info = function() {
                    originalConsole.info.apply(this, arguments);
                    captureLog('INFO', arguments);
                };

                console.log('Console override setup complete');
            };
        }

        function captureLog(type, args) {
            const timestamp = new Date().toLocaleTimeString();
            const message = Array.from(args).map(arg => {
                if (typeof arg === 'object') {
                    try {
                        return JSON.stringify(arg);
                    } catch (e) {
                        return String(arg);
                    }
                }
                return String(arg);
            }).join(' ');

            const logEntry = `[${timestamp}] [${type}] ${message}`;
            logMessages.push(logEntry);
            updateConsoleLog();
        }

        function updateConsoleLog() {
            consoleLogDiv.textContent = logMessages.join('\n');
            consoleLogDiv.scrollTop = consoleLogDiv.scrollHeight;
        }

        function clearLog() {
            logMessages = [];
            updateConsoleLog();
        }

        // Setup on page load
        setupIframeConsoleOverride();
    </script>
</body>
</html>
