<!DOCTYPE html>
<html>
<head>
    <title>Debug Deals Count - Interline Asia</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>🛠️ Deals Database Debug Tool</h2>
        <p>Use this page to check your cruise deals table status:</p>
        
        <button class="btn btn-primary" onclick="countDeals()">Count Cruise Deals</button>
        <button class="btn btn-secondary" onclick="checkTables()">Check Table Status</button>
        <button class="btn btn-info" onclick="viewRLS()">Check RLS Policies</button>
        
        <div id="results" class="mt-3"></div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        // Initialize Supabase
        const supabaseUrl = 'https://inzyhmxskjqbtcnmlaby.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImluemlobXhza2pxYnRjbm1sYWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzQzODc0NTUsImV4cCI6MjA0OTk2MzQ1NX0.z8LSvMt9B5M3g5fGBTkCXCUOj1yRLCR2DDaJ1SgK8os';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function countDeals() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Loading...</p>';
            
            const timestamp = new Date().toLocaleString();
            let loadSource = 'Direct Supabase Query';
            let html = '<h3>🔍 Deal Count Reports</h3>';
            html += `<p><em>Generated: ${timestamp}</em></p>`;
            
            try {
                // Count cruise_deals table
                const { data: cruiseData, error: cruiseError, count: cruiseCount } = await window.supabase
                    .from('cruise_deals')
                    .select('*', { count: 'exact', head: true });
                
                // Count deals_dashboard view
                const { data: dashboardData, error: dashboardError, count: dashboardCount } = await window.supabase
                    .from('deals_dashboard')
                    .select('*', { count: 'exact', head: true });
                
                // Count active deals
                const { data: activeData, error: activeError, count: activeCount } = await window.supabase
                    .from('cruise_deals')
                    .select('*', { count: 'exact', head: true })
                    .eq('is_active', true);
                
                // Sample data from last 5 deals
                const { data: sampleData, error: sampleError } = await window.supabase
                    .from('cruise_deals')
                    .select('cruise_line, region, departure_date, departure_port')
                    .order('created_at', { ascending: false })
                    .limit(5);
                
                html += '<div style="background: #e8f5e8; padding: 15px; border-left: 4px solid #28a745; margin: 10px 0;">';
                html += `<p><strong>🛳️ cruise_deals table:</strong> ${cruiseCount || 0} total deals</p>`;
                html += `<p><strong>📊 deals_dashboard view:</strong> ${dashboardCount || 0} total deals</p>`;
                html += `<p><strong>✅ Active deals:</strong> ${activeCount || 0} deals</p>`;
                html += `<p><strong>🔄 Data Source:</strong> ${loadSource}</p>`;
                html += '</div>';
                
                if (sampleError) {
                    html += `<p>⚠️ Sample data unavailable: ${sampleError.message}</p>`;
                } else if (sampleData && sampleData.length > 0) {
                html += '<h4>📋 Recent Sample Deals:</h4>';
                html += '<ul style="list-style: none; padding: 0;">';
                sampleData.forEach((deal, index) => {
                    html += `<li style="padding: 5px 0; border-bottom: 1px solid #eee;">
                        <strong>${index + 1}.</strong> ${deal.cruise_line} - ${deal.region} 
                        <br><small>Departs: ${deal.departure_date || 'TBD'} from ${deal.departure_port || 'TBD'}</small>
                    </li>`;
                });
                html += '</ul>';
            }
            
            // Load source from deals page diagnostics (if available)
            const dealsPageDiagnostics = window._dealsDebugInfo || (window.opener && window.opener._dealsDebugInfo);
            if (dealsPageDiagnostics) {
                html += '<div style="background: #e1f5fe; padding: 15px; border-left: 4px solid #2196F3; margin: 10px 0;">';
                html += `<p><strong>📊 Active Load Diagnostics:</strong></p>`;
                html += `<p><strong>Source:</strong> ${dealsPageDiagnostics.loadSource || 'Unknown'}</p>`;
                html += `<p><strong>Time:</strong> ${dealsPageDiagnostics.loadTimestamp || 'Not available'}</p>`;
                html += `<p><strong>Duration:</strong> ${dealsPageDiagnostics.loadDuration || 0}ms</p>`;
                html += `<p><strong>Load Path:</strong></p>`;
                html += '<ul style="font-size: 12px; margin: 5px 0;">';
                (dealsPageDiagnostics.loadPath || []).forEach(step => {
                    html += `<li style="margin: 2px 0;">${step}</li>`;
                });
                html += '</ul>';
                html += '</div>';
            }
            
            // Debug info
            html += '<div style="background: #f0f0f0; padding: 10px; margin-top: 20px; font-family: monospace; font-size: 12px;">';
            html += `<strong>🔍 Debug URLs:</strong><br>
            • <code>SELECT COUNT(*) FROM cruise_deals WHERE is_active = true</code><br>
            • <code>SELECT COUNT(*) FROM deals_dashboard</code><br>
            Source: ${dealsPageDiagnostics ? dealsPageDiagnostics.loadSource : loadSource} | Time: ${dealsPageDiagnostics ? dealsPageDiagnostics.loadTimestamp : timestamp}`;
            html += '</div>';
                
                resultsDiv.innerHTML = html;
            } catch (error) {
                resultsDiv.innerHTML = `<p>❌ Error: ${error.message}</p>`;
            }
        }

        async function checkTables() {
            const results = document.getElementById('results');
            results.innerHTML = '<div class="alert alert-info">Checking tables...</div>';

            try {
                // Get sample data
                const { data: cruiseData, error: cruiseError } = await supabase
                    .from('cruise_deals')
                    .select('*')
                    .limit(5);

                const { data: dashboardData, error: dashboardError } = await supabase
                    .from('deals_dashboard')
                    .select('*')
                    .limit(5);

                let html = '<div class="alert alert-info">';
                
                if (cruiseData && cruiseData.length > 0) {
                    html += '<h5>Sample cruise_deals data:</h5><pre>' + JSON.stringify(cruiseData.slice(0, 2), null, 2) + '</pre>';
                } else if (cruiseError) {
                    html += `<h5>cruise_deals error:</h5><p>${cruiseError.message}</p>`;
                }

                if (dashboardData && dashboardData.length > 0) {
                    html += '<h5>Sample deals_dashboard data:</h5><pre>' + JSON.stringify(dashboardData.slice(0, 2), null, 2) + '</pre>';
                } else if (dashboardError) {
                    html += `<h5>deals_dashboard error:</h5><p>${dashboardError.message}</p>`;
                }

                html += '</div>';
                results.innerHTML = html;

            } catch (error) {
                results.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }

        async function viewRLS() {
            const results = document.getElementById('results');
            results.innerHTML = '<div class="alert alert-info">RLS policies are configured server-side. If you see count = 0 above, this indicates potential RLS policy issues.</div>';
        }
    </script>
</body>
</html>
