<!DOCTYPE html>
<html>
<head>
    <title>Login Debug</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
</head>
<body>
    <h1>Login Debug Test</h1>
    <button onclick="testRedirect()">Test Redirect</button>
    <div id="output"></div>
    
    <script>
        async function testRedirect() {
            const output = document.getElementById('output');
            output.innerHTML = '<p>Testing redirect...</p>';
            
            try {
                await window.supabaseClient.readyPromise;
                
                const isLoggedIn = window.supabaseClient.isLoggedIn();
                output.innerHTML += `<p>Logged in: ${isLoggedIn}</p>`;
                
                if (isLoggedIn) {
                    const user = window.supabaseClient.currentUser;
                    const isAdmin = window.supabaseClient.isAdmin();
                    
                    output.innerHTML += `<p>User: ${user?.email}</p>`;
                    output.innerHTML += `<p>Is Admin: ${isAdmin}</p>`;
                    
                    output.innerHTML += '<p>Attempting redirect...</p>';
                    
                    if (isAdmin) {
                        output.innerHTML += '<p>Redirecting to admin.html</p>';
                        setTimeout(() => {
                            window.location.href = 'admin.html';
                        }, 1000);
                    } else {
                        output.innerHTML += '<p>Redirecting to dashboard.html</p>';
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1000);
                    }
                } else {
                    output.innerHTML += '<p>Not logged in</p>';
                }
                
            } catch (error) {
                output.innerHTML += `<p>Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
