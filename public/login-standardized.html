<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to Interline Asia - Access your exclusive cruise deals and VIP travel offers">
  <meta name="keywords" content="cruise login, travel professionals, interline rates, cruise deals, member access">
  <meta name="author" content="Interline Asia">
  <meta name="robots" content="index, follow">
  
  <title>Sign In - Interline Asia</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/css/complete-redesign.css">
  <link rel="stylesheet" href="/css/affiliate-tools.css">
  <link rel="stylesheet" href="/css/social-media.css">
  <link rel="stylesheet" href="auth.css">
  
  <!-- Favicon and App Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon.ico">
  <link rel="manifest" href="/site.webmanifest">
  
  <!-- Loading Overlay -->
  <style>
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      display: none;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0070f3;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  
  <!-- Login System Coordinator -->
  <script src="/js/login.js"></script>
</head>
<body>
  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
  </div>

  <!-- Navigation -->
  <nav class="main-nav">
    <div class="nav-container">
      <div class="nav-brand">
        <div class="brand-icon">IA</div>
        <div class="brand-text">
          <span class="brand-name">Interline Asia</span>
          <span class="brand-subtitle">Luxury Cruise Experiences</span>
        </div>
      </div>
      
      <div class="nav-menu">
        <a href="/" class="nav-link">Home</a>
        <a href="/#about" class="nav-link">About</a>
        <a href="/#partners" class="nav-link">Partners</a>
        <a href="/login.html" class="nav-link active">Member Login</a>
      </div>
      
      <div class="nav-toggle">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </nav>
  
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Sign in to access your exclusive travel deals</p>
      </div>

      <form id="login-form">
        <div id="error-message" class="error-message" style="display: none;"></div>
        <div id="success-message" class="success-message" style="display: none;"></div>
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary" id="login-button">Sign In</button>
      </form>

      <div class="auth-links">
        <p><a href="reset-password.html">Forgot your password?</a></p>
        <p>Don't have an account? <a href="/signup">Create one here</a></p>
        <p><a href="/">Back to Home</a></p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <!-- Standardized Login System -->
  <script src="/js/standardized-login.js"></script>
  
  <!-- Footer Loader -->
  <script>
    // Load footer
    fetch('/partials/footer.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('footer-placeholder').innerHTML = html;
      })
      .catch(error => console.warn('Could not load footer:', error));
  </script>
</body>
</html>
