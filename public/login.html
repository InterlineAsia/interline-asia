<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to Interline Asia - Access your exclusive cruise deals and VIP travel offers">
  <title>Sign In - Interline Asia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="/css/main.css">
  
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FYGT92WCXC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FYGT92WCXC');
  </script>
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <div id="header-placeholder"></div>
  
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Sign in to access your exclusive travel deals</p>
      </div>

      <div id="error-message" class="error-message" style="display: none;"></div>
      <div id="success-message" class="success-message" style="display: none;"></div>

      <div id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="button" class="btn btn-primary" id="login-button">Sign In</button>
      </div>

      <div class="auth-links">
        <p><a href="reset-password.html">Forgot your password?</a></p>
        <p>Don't have an account? <a href="/signup">Create one here</a></p>
        <p><a href="/">Back to Home</a></p>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>
  
  <script src="/js/loadPartials.js" defer></script>
  <script>
    // Simple, clean login system
    document.addEventListener('DOMContentLoaded', function() {
      console.log('LOGIN: Initializing clean login system...');
      
      const loginButton = document.getElementById('login-button');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const errorDiv = document.getElementById('error-message');
      const successDiv = document.getElementById('success-message');
      
      let isLoading = false;
      
      // Initialize Supabase
      let supabase = null;
      
      function initSupabase() {
        if (!window.supabase || !window.SUPABASE_URL || !window.SUPABASE_ANON_KEY) {
          console.error('LOGIN: Supabase not available');
          return false;
        }
        
        supabase = window.supabase.createClient(
          window.SUPABASE_URL,
          window.SUPABASE_ANON_KEY
        );
        
        console.log('LOGIN: Supabase initialized');
        return true;
      }
      
      function showError(message) {
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        successDiv.style.display = 'none';
      }
      
      function showSuccess(message) {
        successDiv.textContent = message;
        successDiv.style.display = 'block';
        errorDiv.style.display = 'none';
      }
      
      function hideMessages() {
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';
      }
      
      function setLoading(loading) {
        isLoading = loading;
        loginButton.disabled = loading;
        loginButton.textContent = loading ? 'Signing In...' : 'Sign In';
      }
      
      async function handleLogin() {
        if (isLoading) return;
        
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();
        
        if (!email || !password) {
          showError('Please enter both email and password.');
          return;
        }
        
        console.log('LOGIN: Starting login for:', email);
        hideMessages();
        setLoading(true);
        
        try {
          if (!supabase) {
            if (!initSupabase()) {
              throw new Error('Failed to initialize authentication system');
            }
          }
          
          // Simple Supabase login
          const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: password
          });
          
          if (error) {
            console.error('LOGIN: Supabase error:', error);
            throw error;
          }
          
          if (!data.user || !data.session) {
            throw new Error('Login failed - no user session created');
          }
          
          console.log('LOGIN: Success! User:', data.user.email);
          console.log('LOGIN: Session:', data.session);
          
          // Track login
          if (typeof gtag !== 'undefined') {
            gtag('event', 'login', { method: 'email' });
          }
          
          // Determine redirect
          const adminEmails = [
            'rodney@telenational.com.au',
            'admin@telenational.com.au', 
            'admin@interlineasia.com'
          ];
          
          const isAdmin = adminEmails.includes(email.toLowerCase());
          
          showSuccess('Login successful! Redirecting...');
          
          // Redirect after short delay
          setTimeout(() => {
            if (isAdmin) {
              console.log('LOGIN: Redirecting admin to dashboard choice');
              window.location.href = '/dashboard-choice.html';
            } else {
              console.log('LOGIN: Redirecting user to dashboard');
              window.location.href = '/dashboard.html';
            }
          }, 1000);
          
        } catch (error) {
          console.error('LOGIN: Error:', error);
          
          let message = 'Login failed. Please try again.';
          
          if (error.message) {
            if (error.message.includes('Invalid login credentials')) {
              message = 'Invalid email or password.';
            } else if (error.message.includes('Email not confirmed')) {
              message = 'Please check your email and confirm your account first.';
            } else if (error.message.includes('Too many requests')) {
              message = 'Too many login attempts. Please wait and try again.';
            } else {
              message = error.message;
            }
          }
          
          showError(message);
          setLoading(false);
        }
      }
      
      // Event listeners
      loginButton.addEventListener('click', handleLogin);
      
      // Enter key support
      emailInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') handleLogin();
      });
      
      passwordInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') handleLogin();
      });
      
      // Initialize Supabase on load
      initSupabase();
      
      // Show success message if coming from registration
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('registered') === 'true') {
        showSuccess('Account created successfully! Please check your email to verify your account, then sign in.');
      }
      
      console.log('LOGIN: System ready');
    });
  </script>
</body>
</html>
