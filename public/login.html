<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to Interline Asia - Access your exclusive cruise deals and VIP travel offers">
  <title>Sign In - Interline Asia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  
  <style>
    /* Login page specific styles matching homepage design */
    body {
      background: #ffffff;
      font-family: 'Inter', 'Noto Sans', Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    
    .login-container {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    }
    
    .login-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 450px;
      text-align: center;
    }
    
    .login-header h1 {
      color: #1e293b;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    
    .login-header p {
      color: #64748b;
      font-size: 1rem;
      margin-bottom: 2rem;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }
    
    .form-group label {
      display: block;
      color: #374151;
      font-weight: 500;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
    
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
      font-family: inherit;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    .btn {
      width: 100%;
      padding: 0.875rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }
    
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .auth-links {
      margin-top: 2rem;
      text-align: center;
    }
    
    .auth-links p {
      margin: 0.75rem 0;
      color: #64748b;
      font-size: 0.9rem;
    }
    
    .auth-links a {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    
    .auth-links a:hover {
      color: #1d4ed8;
      text-decoration: underline;
    }
    
    .error-message, .success-message {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      display: none;
    }
    
    .error-message {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    
    .success-message {
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
    }
    
    .loading-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid transparent;
      border-top: 2px solid currentColor;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Mobile responsiveness */
    @media (max-width: 768px) {
      .login-container {
        padding: 1rem;
        min-height: 70vh;
      }
      
      .login-card {
        padding: 2rem 1.5rem;
      }
      
      .login-header h1 {
        font-size: 1.75rem;
      }
    }
  </style>
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FYGT92WCXC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-FYGT92WCXC');
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
</head>
<body>
  <div id="header-placeholder"></div>
  
  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>Welcome Back</h1>
        <p>Sign in to access your exclusive travel deals</p>
      </div>

      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <!-- Hidden input for reCAPTCHA token -->
        <input type="hidden" id="recaptcha-token" name="g-recaptcha-response">


        <button type="submit" class="btn btn-primary" id="login-btn">
          <span id="login-text">Sign In</span>
        </button>
      </form>

      <div class="auth-links">
        <p><a href="reset-password.html">Forgot your password?</a></p>
        <p>Don't have an account? <a href="/signup">Create one here</a></p>
        <p><a href="/">Back to Home</a></p>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/js/loadPartials.js" defer></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      hideError();
      hideSuccess();
      
      const submitButton = this.querySelector('button[type="submit"]');
      const loginText = document.getElementById('login-text');
      const originalText = loginText.textContent;
      
      // Show loading state
      loginText.innerHTML = '<div class="loading-spinner"></div> Verifying login...';
      submitButton.disabled = true;
      
      try {
        const formData = new FormData(this);
        const email = formData.get('email').trim().toLowerCase();
        const password = formData.get('password');
        
        if (!email || !password) {
          throw new Error('Please enter both email and password');
        }
        
        // Use Cloudflare Turnstile token (bypass for now to test login)
        const recaptchaToken = null;
        
        // Sign in with Supabase
        const result = await window.supabaseClient.signIn(email, password, recaptchaToken);
        
        if (result.user) {
          // Track successful login
          gtag('event', 'login', {
            method: 'email'
          });
          
          showSuccess('Login successful! Redirecting to dashboard...');
          
          // Redirect to dashboard choice page
          setTimeout(() => {
            window.location.href = '/dashboard-choice.html';
          }, 1500);
        }
        
      } catch (error) {
        console.error('Login error:', error);
        console.error('Login error details:', {
          message: error.message,
          email: email,
          passwordLength: password.length
        });
        let errorMessage = 'Invalid email or password';
        
        if (error.message.includes('Email not confirmed')) {
          errorMessage = 'Please check your email and click the verification link before signing in.';
        } else if (error.message.includes('Invalid login credentials')) {
          errorMessage = 'Invalid email or password. Please check your credentials and try again.';
        }
        
        showError(errorMessage);
      } finally {
        loginText.textContent = originalText;
        submitButton.disabled = false;
      }
    });

    // Check if user is already logged in
    window.addEventListener('load', async () => {
      // Wait for Supabase client to initialize
      await new Promise(resolve => setTimeout(resolve, 500));
      
      // DISABLED: No auto-login - always show login form
      // This prevents auto-login issues and Git state problems
      console.log('Login page loaded - auto-login disabled for security');
    });

    // Show success message if coming from registration
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('registered') === 'true') {
      showSuccess('Account created successfully! Please check your email to verify your account, then sign in.');
    }

    function showForgotPassword() {
      // TODO: Implement password reset with Supabase
      alert('Password reset functionality will be available soon. Please contact admin@interlineasia.com for assistance.');
    }

    // Helper functions for error/success messages
    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
    }

    function hideError() {
      document.getElementById('error-message').style.display = 'none';
    }

    function showSuccess(message) {
      const successDiv = document.getElementById('success-message');
      successDiv.textContent = message;
      successDiv.style.display = 'block';
    }

    function hideSuccess() {
      document.getElementById('success-message').style.display = 'none';
    }
  </script>
</body>
</html><!-- Deployment trigger 1752203165 -->
