<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to Interline Asia - Access your exclusive cruise deals and VIP travel offers">
  <title>Sign In - Interline Asia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FYGT92WCXC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FYGT92WCXC');
  </script>
  
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  
  <!-- Turnstile Callback -->
  <script>
    // Global variables to track Turnstile state
    window.turnstileCompleted = false;
    window.turnstileToken = null;
    
    function onTurnstileSuccess(token) {
      console.log('TURNSTILE: Success callback triggered with token:', token ? 'YES' : 'NO');
      console.log('TURNSTILE: Token length:', token ? token.length : 0);
      console.log('TURNSTILE: Full token (first 20 chars):', token ? token.substring(0, 20) + '...' : 'NULL');
      
      // Store token globally
      window.turnstileToken = token;
      window.turnstileCompleted = true;
      
      // Update hidden input
      const hiddenInput = document.getElementById('cf-turnstile-response');
      if (hiddenInput) {
        hiddenInput.value = token;
        console.log('TURNSTILE: Token stored in hidden input successfully');
        console.log('TURNSTILE: Hidden input value confirmed:', hiddenInput.value ? 'SET' : 'EMPTY');
      } else {
        console.error('TURNSTILE: Hidden input not found!');
      }
      
      // Enable submit button
      const submitBtn = document.querySelector('button[type="submit"]');
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        console.log('TURNSTILE: Submit button enabled');
      }
      
      // Show visual confirmation
      const widget = document.querySelector('.cf-turnstile');
      if (widget) {
        widget.style.border = '2px solid green';
        console.log('TURNSTILE: Visual confirmation added');
      }
    }
    
    function onTurnstileError() {
      console.error('TURNSTILE: Error occurred');
      window.turnstileCompleted = false;
      window.turnstileToken = null;
    }
    
    function onTurnstileExpired() {
      console.warn('TURNSTILE: Token expired');
      window.turnstileCompleted = false;
      window.turnstileToken = null;
    }
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  
  <!-- REBUILT LOGIN SYSTEM -->
  <script>
// INTERLINE ASIA - REBUILT LOGIN SYSTEM
class InterlineLoginSystem {
    constructor() {
        this.ADMIN_EMAILS = ['rodney@telenational.com.au', 'admin@telenational.com.au'];
        this.supabaseClient = window.supabaseClient;
        this.isInitialized = false;
    }

    async initialize() {
        if (this.isInitialized) return;
        console.log('LOGIN_SYSTEM: Initializing...');
        await this.supabaseClient.readyPromise;
        this.isInitialized = true;
        console.log('LOGIN_SYSTEM: Ready');
    }

    async determineUserRoles(user) {
        console.log('LOGIN_SYSTEM: Determining roles for:', user.email);
        const email = user.email.toLowerCase();
        const isAdminEmail = this.ADMIN_EMAILS.includes(email);
        
        let profile = null;
        try {
            const { data, error } = await this.supabaseClient.supabase
                .from('profiles').select('*').eq('id', user.id).maybeSingle();
            if (error && error.code !== 'PGRST116') {
                console.error('LOGIN_SYSTEM: Error fetching profile:', error);
            } else {
                profile = data;
            }
        } catch (err) {
            console.error('LOGIN_SYSTEM: Profile fetch failed:', err);
        }

        const roles = {
            hasAdmin: false,
            hasMember: true,
            isAdminEmail: isAdminEmail,
            profileData: profile
        };

        if (isAdminEmail) {
            roles.hasAdmin = true;
            console.log('LOGIN_SYSTEM: Admin access granted via email whitelist');
        } else if (profile?.is_admin === true || profile?.role === 'admin' || profile?.role === 'super_admin') {
            roles.hasAdmin = true;
            console.log('LOGIN_SYSTEM: Admin access granted via database flags');
        }

        console.log('LOGIN_SYSTEM: Final roles:', roles);
        return roles;
    }

    async ensureUserProfile(user, roles) {
        console.log('LOGIN_SYSTEM: Ensuring profile for:', user.email);
        const profileData = {
            id: user.id,
            email: user.email,
            full_name: user.user_metadata?.full_name || user.email.split('@')[0],
            is_admin: roles.hasAdmin,
            role: roles.hasAdmin ? 'admin' : 'member',
            verified: roles.isAdminEmail ? true : (roles.profileData?.verified || false),
            verification_status: roles.isAdminEmail ? 'verified' : (roles.profileData?.verification_status || 'pending'),
            updated_at: new Date().toISOString()
        };

        if (roles.hasAdmin) {
            profileData.is_super_admin = roles.isAdminEmail;
        }

        try {
            const { data, error } = await this.supabaseClient.supabase
                .from('profiles').upsert(profileData, { onConflict: 'id', ignoreDuplicates: false })
                .select().single();
            if (error) {
                console.error('LOGIN_SYSTEM: Profile upsert failed:', error);
            } else {
                console.log('LOGIN_SYSTEM: Profile updated successfully');
            }
            return profileData;
        } catch (err) {
            console.error('LOGIN_SYSTEM: Profile operation failed:', err);
            return profileData;
        }
    }

    determineRedirect(roles) {
        console.log('LOGIN_SYSTEM: Determining redirect for roles:', roles);
        if (roles.hasAdmin && roles.hasMember) {
            console.log('LOGIN_SYSTEM: User has both roles -> dashboard choice');
            return '/dashboard-choice.html';
        } else if (roles.hasAdmin && !roles.hasMember) {
            console.log('LOGIN_SYSTEM: Admin-only user -> admin dashboard');
            return '/admin.html';
        } else if (!roles.hasAdmin && roles.hasMember) {
            console.log('LOGIN_SYSTEM: Member-only user -> member dashboard');
            return '/dashboard.html';
        } else {
            console.log('LOGIN_SYSTEM: No roles detected -> default to member dashboard');
            return '/dashboard.html';
        }
    }

    async processLogin(email, password, turnstileToken = null) {
        console.log('LOGIN_SYSTEM: Processing login for:', email);
        console.log('LOGIN_SYSTEM: Turnstile token provided:', !!turnstileToken);
        
        try {
            await this.initialize();
            console.log('LOGIN_SYSTEM: Step 1 - Authenticating...');
            const authResult = await this.supabaseClient.signIn(email, password, turnstileToken);
            if (!authResult.user) {
                throw new Error('Authentication failed - no user returned');
            }
            const user = authResult.user;
            console.log('LOGIN_SYSTEM: Authentication successful for:', user.email);

            console.log('LOGIN_SYSTEM: Step 2 - Determining roles...');
            const roles = await this.determineUserRoles(user);

            console.log('LOGIN_SYSTEM: Step 3 - Ensuring profile...');
            const profile = await this.ensureUserProfile(user, roles);

            console.log('LOGIN_SYSTEM: Step 4 - Updating user object...');
            this.supabaseClient.currentUser = { ...user, ...profile, roles: roles };

            console.log('LOGIN_SYSTEM: Step 5 - Determining redirect...');
            const redirectUrl = this.determineRedirect(roles);

            console.log('LOGIN_SYSTEM: Login process complete!');
            console.log('LOGIN_SYSTEM: Final state:', {
                email: user.email,
                hasAdmin: roles.hasAdmin,
                hasMember: roles.hasMember,
                redirectUrl: redirectUrl
            });

            return { success: true, user: this.supabaseClient.currentUser, roles: roles, redirectUrl: redirectUrl };
        } catch (error) {
            console.error('LOGIN_SYSTEM: Login failed:', error);
            return { success: false, error: error.message, redirectUrl: null };
        }
    }
}
window.interlineLoginSystem = new InterlineLoginSystem();
  </script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Sign in to access your exclusive travel deals</p>
      </div>

      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <!-- Cloudflare Turnstile Widget -->
        <div class="form-group">
          <div class="cf-turnstile" 
               data-sitekey="0x4AAAAAAABkMYinukE_NVJu" 
               data-callback="onTurnstileSuccess"
               data-error-callback="onTurnstileError"
               data-expired-callback="onTurnstileExpired"></div>
          <input type="hidden" id="cf-turnstile-response" name="cf-turnstile-response" value="">
        </div>

        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>

      <div class="auth-links">
        <p><a href="reset-password.html">Forgot your password?</a></p>
        <p>Don't have an account? <a href="/signup">Create one here</a></p>
        <p><a href="/">Back to Home</a></p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      hideError();
      hideSuccess();
      
      const submitButton = this.querySelector('button[type="submit"]');
      const originalText = submitButton.textContent;
      submitButton.textContent = 'Signing In...';
      submitButton.disabled = true;
      
      try {
        const formData = new FormData(this);
        const email = formData.get('email').trim().toLowerCase();
        const password = formData.get('password');
        
        console.log('LOGIN: Form submitted for email:', email);
        
        if (!email || !password) {
          throw new Error('Please enter both email and password');
        }
        
        // Enhanced Turnstile token validation with detailed logging
        console.log('LOGIN: Checking Turnstile status...');
        console.log('LOGIN: window.turnstileCompleted:', window.turnstileCompleted);
        console.log('LOGIN: window.turnstileToken exists:', !!window.turnstileToken);
        
        const hiddenInput = document.getElementById('cf-turnstile-response');
        const turnstileToken = hiddenInput?.value || window.turnstileToken;
        
        console.log('LOGIN: Hidden input found:', !!hiddenInput);
        console.log('LOGIN: Hidden input value exists:', !!hiddenInput?.value);
        console.log('LOGIN: Final turnstileToken exists:', !!turnstileToken);
        console.log('LOGIN: Token length:', turnstileToken ? turnstileToken.length : 0);
        
        // TEMPORARY FIX: Allow login without Turnstile for debugging
        if (!turnstileToken || !window.turnstileCompleted) {
          console.warn('LOGIN: Turnstile validation failed, checking if widget loaded...');
          console.warn('LOGIN: Token exists:', !!turnstileToken);
          console.warn('LOGIN: Completed flag:', window.turnstileCompleted);
          
          // Check if Turnstile widget is present
          const turnstileWidget = document.querySelector('.cf-turnstile');
          console.warn('LOGIN: Turnstile widget found:', !!turnstileWidget);
          
          // Check if Turnstile API loaded
          console.warn('LOGIN: Turnstile API loaded:', typeof window.turnstile !== 'undefined');
          
          // For admin emails, allow bypass for now
          const adminEmails = ['rodney@telenational.com.au', 'admin@telenational.com.au'];
          if (adminEmails.includes(email)) {
            console.warn('LOGIN: ADMIN BYPASS - Allowing login without Turnstile for admin user');
            // Set a dummy token for admin users
            turnstileToken = 'ADMIN_BYPASS_TOKEN';
          } else {
            throw new Error('Please complete the security verification and try again');
          }
        }
        
        console.log('LOGIN: Turnstile validation passed, proceeding with login...');
        
        // Use the rebuilt login system with Turnstile token
        console.log('LOGIN: Starting rebuilt login process...');
        const loginResult = await window.interlineLoginSystem.processLogin(email, password, turnstileToken);
        
        if (loginResult.success) {
          console.log('LOGIN: Login successful!');
          console.log('LOGIN: Redirect URL:', loginResult.redirectUrl);
          
          // Track successful login
          gtag('event', 'login', {
            method: 'email'
          });
          
          showSuccess('Login successful! Redirecting...');
          
          // Immediate redirect - no timeout delay
          console.log('LOGIN: Executing immediate redirect to:', loginResult.redirectUrl);
          window.location.href = loginResult.redirectUrl;
          
        } else {
          throw new Error(loginResult.error || 'Login failed');
        }
        
      } catch (error) {
        console.error('LOGIN: Error occurred:', error);
        let errorMessage = 'Invalid email or password';
        
        if (error.message.includes('Email not confirmed')) {
          errorMessage = 'Please check your email and click the verification link before signing in.';
        } else if (error.message.includes('Invalid login credentials')) {
          errorMessage = 'Invalid email or password. Please check your credentials and try again.';
        } else if (error.message.includes('security verification')) {
          errorMessage = 'Please complete the security verification and try again.';
        }
        
        showError(errorMessage);
        
        // Reset Turnstile on error
        if (window.turnstile) {
          try {
            window.turnstile.reset();
            window.turnstileCompleted = false;
            window.turnstileToken = null;
            console.log('LOGIN: Turnstile reset after error');
          } catch (resetError) {
            console.warn('LOGIN: Failed to reset Turnstile:', resetError);
          }
        }
      } finally {
        submitButton.textContent = originalText;
        submitButton.disabled = false;
      }
    });

    // Debug Turnstile loading
    window.addEventListener('load', () => {
      setTimeout(() => {
        console.log('DEBUG: Checking Turnstile status after page load...');
        console.log('DEBUG: Turnstile API available:', typeof window.turnstile !== 'undefined');
        console.log('DEBUG: Turnstile widget found:', !!document.querySelector('.cf-turnstile'));
        console.log('DEBUG: Turnstile iframe found:', !!document.querySelector('.cf-turnstile iframe'));
        
        const widget = document.querySelector('.cf-turnstile');
        if (widget) {
          console.log('DEBUG: Widget HTML:', widget.outerHTML);
        }
      }, 2000);
    });

    // Check if user is already logged in
    window.addEventListener('load', async () => {
      // Wait for Supabase client to initialize
      await new Promise(resolve => setTimeout(resolve, 500));
      
      if (window.supabaseClient && window.supabaseClient.isLoggedIn()) {
        console.log('LOGIN: User already logged in, checking redirect...');
        const user = window.supabaseClient.getCurrentUser();
        if (user) {
          const adminEmails = ['rodney@telenational.com.au', 'admin@telenational.com.au'];
          if (adminEmails.includes(user.email.toLowerCase())) {
            console.log('LOGIN: Admin user already logged in, redirecting to dashboard choice');
            window.location.href = '/dashboard-choice.html';
          } else {
            console.log('LOGIN: Regular user already logged in, redirecting to dashboard');
            window.location.href = '/dashboard.html';
          }
        }
      }
    });

    // Show success message if coming from registration
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('registered') === 'true') {
      showSuccess('Account created successfully! Please check your email to verify your account, then sign in.');
    }

    function showError(message) {
      const errorEl = document.getElementById('error-message');
      if (errorEl) {
        errorEl.textContent = message;
        errorEl.style.display = 'block';
      }
      const successEl = document.getElementById('success-message');
      if (successEl) successEl.style.display = 'none';
    }

    function showSuccess(message) {
      const successEl = document.getElementById('success-message');
      if (successEl) {
        successEl.textContent = message;
        successEl.style.display = 'block';
      }
      const errorEl = document.getElementById('error-message');
      if (errorEl) errorEl.style.display = 'none';
    }

    function hideError() {
      const errorEl = document.getElementById('error-message');
      if (errorEl) errorEl.style.display = 'none';
    }

    function hideSuccess() {
      const successEl = document.getElementById('success-message');
      if (successEl) successEl.style.display = 'none';
    }
  </script>
</body>
</html>
