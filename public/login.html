<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to Interline Asia - Access your exclusive cruise deals and VIP travel offers">
  <title>Sign In - Interline Asia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="/css/main.css">
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FYGT92WCXC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FYGT92WCXC');
  </script>
  
  <!-- Turnstile temporarily disabled -->
  <!-- <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script> -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
</head>
<body>
  <div id="header-placeholder"></div>
  
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Sign in to access your exclusive travel deals</p>
      </div>

      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <!-- Turnstile temporarily hidden -->
        <div class="form-group" style="display: none;">
          <div id="turnstile-widget-container"></div>
        </div>

        <button type="submit" class="btn btn-primary" id="login-button">Sign In</button>
      </form>

      <div class="auth-links">
        <p><a href="reset-password.html">Forgot your password?</a></p>
        <p>Don't have an account? <a href="/signup">Create one here</a></p>
        <p><a href="/">Back to Home</a></p>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>
  
  <script src="/js/loadPartials.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      console.log('LOGIN: DOM ready, initializing login system...');
      
      const loginForm = document.getElementById('login-form');
      const loginButton = document.getElementById('login-button');
      const errorEl = document.getElementById('error-message');
      
      if (!loginForm) {
        console.error('LOGIN: Form not found!');
        return;
      }
      
      // Shared login function
      async function performLogin() {
        try {
          const email = document.getElementById('email').value.trim();
          const password = document.getElementById('password').value.trim();
          
          // Clear previous errors
          if (errorEl) {
            errorEl.style.display = 'none';
          }
          
          // Validation
          if (!email || !password) {
            showError('Please enter both email and password.');
            return;
          }
          
          console.log('LOGIN: Starting authentication for:', email);
          
          // Admin emails for redirect logic
          const adminEmails = [
            'rodney@telenational.com.au', 
            'admin@telenational.com.au', 
            'admin@interlineasia.com'
          ];
          
          // Turnstile temporarily bypassed
          const turnstileToken = 'TESTING_BYPASS_TOKEN';
          console.log('LOGIN: Turnstile validation temporarily disabled for testing');
          
          // Wait for Supabase client
          if (!window.supabaseClient) {
            throw new Error('Supabase client not initialized');
          }
          
          await window.supabaseClient.readyPromise;
          console.log('LOGIN: Supabase client ready, attempting authentication...');
          
          // Authenticate with Supabase
          const result = await window.supabaseClient.signIn(email, password, turnstileToken);
          
          if (!result || !result.user) {
            throw new Error('Authentication failed - no user returned');
          }
          
          console.log('LOGIN SUCCESS: User authenticated:', result.user.email);
          console.log('LOGIN: User role:', result.user.role);
          console.log('LOGIN: Is admin:', result.user.is_admin);
          
          // Track successful login
          if (typeof gtag !== 'undefined') {
            gtag('event', 'login', { method: 'email' });
          }
          
          // Redirect based on user role/admin status
          if (result.user.is_admin || result.user.is_super_admin || adminEmails.includes(email.toLowerCase())) {
            console.log('LOGIN: Redirecting admin user to dashboard choice');
            window.location.href = '/dashboard-choice.html';
          } else {
            console.log('LOGIN: Redirecting regular user to dashboard');
            window.location.href = '/dashboard.html';
          }
          
        } catch (err) {
          console.error('LOGIN: Authentication error:', err);
          
          let errorMessage = 'Login failed. Please check your credentials and try again.';
          
          if (err.message) {
            if (err.message.includes('Invalid login credentials')) {
              errorMessage = 'Invalid email or password. Please check your credentials.';
            } else if (err.message.includes('Email not confirmed')) {
              errorMessage = 'Please check your email and click the confirmation link before signing in.';
            } else if (err.message.includes('Too many requests')) {
              errorMessage = 'Too many login attempts. Please wait a moment and try again.';
            } else {
              errorMessage = `Login failed: ${err.message}`;
            }
          }
          
          showError(errorMessage);
        }
      }
      
      // Helper function to show errors
      function showError(message) {
        if (errorEl) {
          errorEl.textContent = message;
          errorEl.style.display = 'block';
        }
      }
      
      // Form submit handler
      loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        e.stopPropagation();
        console.log('LOGIN: Form submission intercepted!');
        await performLogin();
      });
      
      // Button click handler as backup
      if (loginButton) {
        loginButton.addEventListener('click', async function(e) {
          e.preventDefault();
          e.stopPropagation();
          console.log('LOGIN: Button clicked directly!');
          await performLogin();
        });
      }
      
      // Show success message if coming from registration
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('registered') === 'true') {
        const successEl = document.getElementById('success-message');
        if (successEl) {
          successEl.textContent = 'Account created successfully! Please check your email to verify your account, then sign in.';
          successEl.style.display = 'block';
        }
      }
      
      console.log('LOGIN: System initialized successfully');
    });
  </script>
</body>
</html>
