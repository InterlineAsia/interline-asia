<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Interline Asia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  
  <style>
    /* Site Header Styles */
    .main-header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    
    .main-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 2rem;
    }
    
    .nav-brand a {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1f2937;
      text-decoration: none;
    }
    
    .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
    }
    
    .nav-links a {
      color: #6b7280;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    
    .nav-links a:hover,
    .nav-links a.active {
      color: #1f2937;
    }
    
    .nav-cta {
      background: #3b82f6;
      color: white !important;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      font-weight: 600;
    }
    
    .nav-cta:hover {
      background: #2563eb;
      color: white !important;
    }
    
    /* Adjust auth container for header */
    .auth-container {
      margin-top: 2rem;
    }
    
    @media (max-width: 768px) {
      .main-nav {
        padding: 1rem;
      }
      
      .nav-links {
        gap: 1rem;
        font-size: 0.9rem;
      }
    }
  </style>
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Configuration -->
  <script src="config.js"></script>
  
  <!-- Supabase Client -->
  <script src="supabase-client.js"></script>
  
  <!-- Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>
</head>
<body>
  <!-- Site Header -->
  <header class="main-header">
    <nav class="main-nav">
      <div class="nav-brand">
        <a href="/">Interline Asia</a>
      </div>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/about.html">About</a>
        <a href="/deals.html">Deals</a>
        <a href="/faq.html">FAQ</a>
        <a href="/login.html" class="active">Login</a>
        <a href="/signup.html" class="nav-cta">Sign Up</a>
      </div>
    </nav>
  </header>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Sign in to access your Interline Asia account</p>
      </div>
      
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        
        <!-- Cloudflare Turnstile CAPTCHA -->
        <div class="form-group">
          <div class="cf-turnstile" data-sitekey="0x4AAAAAABkLNMf0cRO37SRL" data-callback="onTurnstileSuccess"></div>
          <input type="hidden" id="turnstile-token" name="turnstile-token">
        </div>
        
        <button type="submit" class="auth-btn" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <span class="btn-loading" style="display: none;">Signing in...</span>
        </button>
        
        <div class="auth-links">
          <a href="reset-password.html">Forgot your password?</a>
          <span>•</span>
          <a href="signup.html">Create an account</a>
        </div>
      </form>
      
      <div id="error-message" class="error-message" style="display: none;"></div>
      <div id="success-message" class="success-message" style="display: none;"></div>
    </div>
  </div>

  <script>
    // Cloudflare Turnstile callback
    function onTurnstileSuccess(token) {
      console.log('Turnstile token received:', token ? 'Yes' : 'No');
      document.getElementById('turnstile-token').value = token;
    }

    document.addEventListener('DOMContentLoaded', async function() {
      // DISABLED: No auto-login - always show login form
      // This prevents auto-login issues and Git state problems
      console.log('Login page loaded - auto-login disabled for security');

      const loginForm = document.getElementById('loginForm');
      const loginBtn = document.getElementById('loginBtn');
      const btnText = loginBtn.querySelector('.btn-text');
      const btnLoading = loginBtn.querySelector('.btn-loading');

      loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // Clear previous messages
        hideError();
        hideSuccess();
        
        // Get form data
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const turnstileToken = document.getElementById('turnstile-token').value;
        
        console.log('LOGIN: Form submission started');
        console.log('LOGIN: Email:', email);
        console.log('LOGIN: Turnstile token present:', !!turnstileToken);
        
        // Validation
        if (!email || !password) {
          showError('Please fill in all fields');
          return;
        }
        
        if (!turnstileToken) {
          showError('Please complete the security verification');
          return;
        }
        
        // Show loading state
        loginBtn.disabled = true;
        btnText.style.display = 'none';
        btnLoading.style.display = 'inline';
        
        try {
          // Sign in with Supabase
          console.log('LOGIN: Attempting login for:', email);
          const result = await window.supabaseClient.signIn(email, password, turnstileToken);
          
          console.log('LOGIN: Result received:', result);
          console.log('LOGIN: User object:', result.user);
          console.log('LOGIN: Session object:', result.session);
          
          if (result.user) {
            // Track successful login
            gtag('event', 'login', {
              method: 'email'
            });
            
            console.log('LOGIN: Success! User email:', result.user.email);
            showSuccess('Login successful! Redirecting...');
            
            // Store comprehensive session data
            const sessionData = {
              user: result.user,
              session: result.session,
              timestamp: Date.now()
            };
            
            sessionStorage.setItem('tempSession', JSON.stringify(sessionData));
            sessionStorage.setItem('tempUser', JSON.stringify({
              email: result.user.email,
              id: result.user.id,
              loginTime: Date.now()
            }));
            
            console.log('LOGIN: Session data stored:', {
              tempSession: !!sessionStorage.getItem('tempSession'),
              tempUser: !!sessionStorage.getItem('tempUser'),
              supabaseUser: !!window.supabaseClient.currentUser,
              supabaseSession: !!window.supabaseClient.currentSession
            });
            
            // CSP-safe function-based setTimeout to avoid eval violations
            const performRedirect = async function() {
              console.log('AUTH_DEBUG: Starting final session validation...');
              
              try {
                // Use await supabase.auth.getSession() to confirm session
                const { data: { session }, error } = await window.supabaseClient.supabase.auth.getSession();
                console.log('AUTH_DEBUG: Final session check:', { 
                  hasSession: !!session, 
                  hasUser: !!session?.user,
                  userEmail: session?.user?.email,
                  error: error 
                });
                
                if (!session || !session.user) {
                  console.error('AUTH_DEBUG: Final session validation failed');
                  showError('Login session could not be established. Please try again.');
                  return;
                }
                
                console.log('AUTH_DEBUG: Final Session Validated. Redirecting to dashboard-choice...');
                
                // Determine redirect based on user role
                const isAdmin = window.supabaseClient.isAdmin(session.user.email);
                console.log('AUTH_DEBUG: User is admin:', isAdmin);
                
                if (isAdmin) {
                  console.log('AUTH_DEBUG: Redirecting admin to dashboard-choice...');
                  window.location.replace('/dashboard-choice.html');
                } else {
                  console.log('AUTH_DEBUG: Redirecting user to dashboard...');
                  window.location.replace('/dashboard.html');
                }
              } catch (redirectError) {
                console.error('AUTH_DEBUG: Redirect error:', redirectError);
                showError('Redirect failed. Please try logging in again.');
              }
            };
            
            // Wait 1000ms before redirect after successful login
            setTimeout(performRedirect, 1000);
          } else {
            console.error('LOGIN: Failed - No user returned');
            throw new Error('Login failed - no user data received');
          }
        } catch (error) {
          console.error('LOGIN: Error occurred:', error);
          
          // Show user-friendly error message
          let errorMessage = 'Login failed. Please check your credentials and try again.';
          
          if (error.message.includes('Invalid login credentials')) {
            errorMessage = 'Invalid email or password. Please try again.';
          } else if (error.message.includes('Email not confirmed')) {
            errorMessage = 'Please check your email and click the confirmation link before signing in.';
          } else if (error.message.includes('Too many requests')) {
            errorMessage = 'Too many login attempts. Please wait a moment and try again.';
          } else if (error.message.includes('captcha')) {
            errorMessage = 'Security verification failed. Please try again.';
          }
          
          showError(errorMessage);
          
          // Reset Turnstile
          if (window.turnstile) {
            window.turnstile.reset();
          }
        } finally {
          // Reset button state
          loginBtn.disabled = false;
          btnText.style.display = 'inline';
          btnLoading.style.display = 'none';
        }
      });
    });
  </script>
</body>
</html>
