<header>
    <div class="logo">
        <h1>INTERLINE ASIA</h1>
        <span>Luxury Cruises. Verified Access. Exceptional Value for Travel Professionals.</span>
    </div>
    <nav>
        <ul id="main-nav">
            <li><a href="/">Home</a></li>
            <li><a href="/#about">About Us</a></li>
            <li><a href="/#partners">Partners</a></li>
            <li><a href="/contact.html">Contact</a></li>
            <li><a href="/#faq">FAQ</a></li>
            <li><a href="/terms-and-conditions">Terms & Conditions</a></li>
            <li><a href="/privacy-policy">Privacy Policy</a></li>
            <li id="auth-section">
                <a href="/login">Login / Signup</a>
            </li>
        </ul>
    </nav>
    
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            setTimeout(async () => {
                try {
                    if (window.supabaseClient) {
                        await window.supabaseClient.readyPromise;
                        updateHeaderAuth();
                    }
                } catch (error) {
                    console.log('Header auth update skipped:', error.message);
                }
            }, 500);
        });
        
        function updateHeaderAuth() {
            const authSection = document.getElementById('auth-section');
            if (!authSection) return;
            
            if (window.supabaseClient && window.supabaseClient.isLoggedIn()) {
                const user = window.supabaseClient.currentUser;
                const displayName = user?.full_name || user?.email?.split('@')[0] || 'User';
                const isAdmin = user?.is_admin || user?.is_super_admin || user?.role === 'admin';
                
                authSection.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <a href="/dashboard.html" style="color: #fff; text-decoration: none;">Dashboard</a>
                        ${isAdmin ? '<a href="/public/deals.html" style="color: #fff; text-decoration: none;">Deals</a>' : ''}
                        ${isAdmin ? '<a href="/public/admin.html" style="color: #fff; text-decoration: none;">Admin</a>' : ''}
                        <span style="color: #FF7F41;">${displayName}${isAdmin ? ' (Admin)' : ''}</span>
                        <button onclick="handleSignOut()" style="background: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Sign Out</button>
                    </div>
                `;
            } else {
                authSection.innerHTML = '<a href="/login">Login / Signup</a>';
            }
        }
        
        function handleSignOut() {
            if (window.supabaseClient) {
                window.supabaseClient.signOut();
            } else {
                window.location.href = '/login';
            }
        }
    </script>
</header>
