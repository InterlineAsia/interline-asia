<header>
    <a href="/" class="logo-link" aria-label="Interline Asia Homepage">
        <div class="logo">
            <h1>INTERLINE ASIA</h1>
            <span>Luxury Cruises. Verified Access. Exceptional Value for Travel Professionals.</span>
        </div>
    </a>
    <nav aria-label="Main navigation">
        <ul id="main-nav">
            <li><a href="/">Home</a></li>
            <li><a href="/#about">About Us</a></li>
            <li><a href="/#partners">Partners</a></li>
            <li><a href="/#faq">FAQ</a></li>
            <li><a href="/terms-and-conditions">Terms &amp; Conditions</a></li>
            <li><a href="/privacy-policy">Privacy Policy</a></li>
            <!-- Dynamic auth section will be populated by JavaScript -->
            <li id="auth-section">
                <a href="/login">Login / Signup</a>
            </li>
        </ul>
    </nav>
    
    <!-- Authentication state management -->
    <script>
        // Wait for page load and supabase client initialization
        document.addEventListener('DOMContentLoaded', async function() {
            // Small delay to ensure supabase client is ready
            setTimeout(async () => {
                try {
                    if (window.supabaseClient) {
                        await window.supabaseClient.readyPromise;
                        updateHeaderAuth();
                    }
                } catch (error) {
                    console.log('Header auth update skipped:', error.message);
                }
            }, 500);
        });
        
        function updateHeaderAuth() {
            const authSection = document.getElementById('auth-section');
            if (!authSection) return;
            
            if (window.supabaseClient && window.supabaseClient.isLoggedIn()) {
                const user = window.supabaseClient.currentUser;
                const displayName = user?.full_name || user?.email?.split('@')[0] || 'User';
                const isAdmin = user?.is_admin || user?.is_super_admin || user?.role === 'admin';
                
                authSection.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <a href="/dashboard.html" style="color: #ccc; text-decoration: none; font-size: 14px; transition: color 0.3s;" onmouseover="this.style.color='#FF7F41'" onmouseout="this.style.color='#ccc'">
                            Dashboard
                        </a>
                        ${isAdmin ? '<a href="/public/deals.html" style="color: #ccc; text-decoration: none; font-size: 14px; transition: color 0.3s;" onmouseover="this.style.color=\'#FF7F41\'" onmouseout="this.style.color=\'#ccc\'">Deals</a>' : ''}
                        ${isAdmin ? '<a href="/public/admin.html" style="color: #ccc; text-decoration: none; font-size: 14px; transition: color 0.3s;" onmouseover="this.style.color=\'#FF7F41\'" onmouseout="this.style.color=\'#ccc\'">Admin</a>' : ''}
                        <span style="color: #FF7F41; font-size: 14px; font-weight: 500;">
                            ${displayName}${isAdmin ? ' (Admin)' : ''}
                        </span>
                        <button onclick="handleSignOut()" style="background: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-size: 12px; cursor: pointer; transition: background 0.3s;" onmouseover="this.style.background='#c82333'" onmouseout="this.style.background='#dc3545'">
                            Sign Out
                        </button>
                    </div>
                `;
            } else {
                authSection.innerHTML = '<a href="/login">Login / Signup</a>';
            }
        }
        
        function handleSignOut() {
            if (window.supabaseClient) {
                window.supabaseClient.signOut();
            } else {
                // Fallback for pages without supabase client
                window.location.href = '/login';
            }
        }
        
        // Update auth state when auth changes (for single-page apps)
        if (window.supabaseClient) {
            window.supabaseClient.readyPromise.then(() => {
                // Listen for auth state changes
                window.supabaseClient.supabase.auth.onAuthStateChange((event, session) => {
                    setTimeout(updateHeaderAuth, 100);
                });
            });
        }
    </script>
</header>
