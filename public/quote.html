<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Quote - Interline Asia</title>
    <meta name="description" content="Request a quote for exclusive cruise deals - Interline Asia">
    <meta name="keywords" content="cruise quote, travel quote, cruise deals, interline rates">
    <meta name="author" content="Interline Asia">
    <meta name="robots" content="index, follow">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/css/luxury-cruise-design.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            margin: 0;
            padding: 0;
        }

        .quote-container {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .quote-header {
            background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .quote-header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
            font-weight: 700;
        }

        .quote-header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .quote-content {
            padding: 2rem;
        }

        .cruise-details {
            background: #f8fafc;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border-left: 4px solid #0f172a;
        }

        .cruise-details h3 {
            margin: 0 0 1rem 0;
            color: #0f172a;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .cruise-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .cruise-info-item {
            display: flex;
            flex-direction: column;
        }

        .cruise-info-label {
            font-size: 0.875rem;
            color: #6b7280;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .cruise-info-value {
            font-size: 1rem;
            color: #1f2937;
            font-weight: 600;
        }

        .form-section {
            margin-bottom: 2rem;
        }

        .form-section h3 {
            margin: 0 0 1rem 0;
            color: #0f172a;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .cabin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .cabin-input {
            display: flex;
            flex-direction: column;
        }

        .cabin-input label {
            font-size: 0.875rem;
            color: #374151;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .cabin-input input {
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.875rem;
            transition: border-color 0.3s;
        }

        .cabin-input input:focus {
            outline: none;
            border-color: #0f172a;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            color: #374151;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.875rem;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #0f172a;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .success-message {
            background: #10b981;
            color: white;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message {
            background: #ef4444;
            color: white;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .loading i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="quote-container">
        <div class="quote-header">
            <h1>Request Your Quote</h1>
            <p>Get personalized pricing for your cruise adventure</p>
        </div>

        <div class="quote-content">
            <div class="success-message" id="success-message"></div>
            <div class="error-message" id="error-message"></div>
            
            <div class="loading" id="loading">
                <i class="ri-loader-4-line"></i>
                <p>Sending your quote request...</p>
            </div>

            <div id="quote-form">
                <div class="cruise-details">
                    <h3>Cruise Details</h3>
                    <div class="cruise-info" id="cruise-info">
                        <!-- Cruise details will be populated here -->
                    </div>
                </div>

                <form id="quoteForm">
                    <div class="form-section">
                        <h3>Contact Information</h3>
                        <div class="form-group">
                            <label for="clientName">Full Name *</label>
                            <input type="text" id="clientName" name="clientName" required>
                        </div>
                        <div class="form-group">
                            <label for="clientEmail">Email Address *</label>
                            <input type="email" id="clientEmail" name="clientEmail" required>
                        </div>
                        <div class="form-group">
                            <label for="clientPhone">Phone Number</label>
                            <input type="tel" id="clientPhone" name="clientPhone">
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>Cabin Preferences</h3>
                        <p style="color: #6b7280; margin-bottom: 1rem;">Please indicate how many cabins you need for each category:</p>
                        <div class="cabin-grid">
                            <div class="cabin-input">
                                <label for="interiorCabins">Interior Cabins</label>
                                <input type="number" id="interiorCabins" name="interiorCabins" min="0" value="0">
                            </div>
                            <div class="cabin-input">
                                <label for="oceanviewCabins">Oceanview Cabins</label>
                                <input type="number" id="oceanviewCabins" name="oceanviewCabins" min="0" value="0">
                            </div>
                            <div class="cabin-input">
                                <label for="balconyCabins">Balcony Cabins</label>
                                <input type="number" id="balconyCabins" name="balconyCabins" min="0" value="0">
                            </div>
                            <div class="cabin-input">
                                <label for="suiteCabins">Suite Cabins</label>
                                <input type="number" id="suiteCabins" name="suiteCabins" min="0" value="0">
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>Additional Information</h3>
                        <div class="form-group">
                            <label for="specialRequests">Special Requests or Notes</label>
                            <textarea id="specialRequests" name="specialRequests" placeholder="Any special requirements, dietary needs, accessibility requests, or upgrade preferences..."></textarea>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn" id="submitBtn">
                        <i class="ri-mail-send-line"></i>
                        Send Quote Request
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const cruiseData = {
            dealId: urlParams.get('dealId') || '',
            cruiseLine: urlParams.get('cruiseLine') || '',
            shipName: urlParams.get('shipName') || '',
            departureDate: urlParams.get('departureDate') || '',
            region: urlParams.get('region') || '',
            nights: urlParams.get('nights') || '',
            departurePort: urlParams.get('departurePort') || '',
            arrivalPort: urlParams.get('arrivalPort') || ''
        };

        // Populate cruise details
        function populateCruiseDetails() {
            const cruiseInfoDiv = document.getElementById('cruise-info');
            
            cruiseInfoDiv.innerHTML = `
                <div class="cruise-info-item">
                    <div class="cruise-info-label">Cruise Line</div>
                    <div class="cruise-info-value">${cruiseData.cruiseLine || 'N/A'}</div>
                </div>
                <div class="cruise-info-item">
                    <div class="cruise-info-label">Ship Name</div>
                    <div class="cruise-info-value">${cruiseData.shipName || 'N/A'}</div>
                </div>
                <div class="cruise-info-item">
                    <div class="cruise-info-label">Departure Date</div>
                    <div class="cruise-info-value">${cruiseData.departureDate || 'N/A'}</div>
                </div>
                <div class="cruise-info-item">
                    <div class="cruise-info-label">Duration</div>
                    <div class="cruise-info-value">${cruiseData.nights ? cruiseData.nights + ' nights' : 'N/A'}</div>
                </div>
                <div class="cruise-info-item">
                    <div class="cruise-info-label">Region</div>
                    <div class="cruise-info-value">${cruiseData.region || 'N/A'}</div>
                </div>
                <div class="cruise-info-item">
                    <div class="cruise-info-label">Departure Port</div>
                    <div class="cruise-info-value">${cruiseData.departurePort || 'N/A'}</div>
                </div>
                <div class="cruise-info-item">
                    <div class="cruise-info-label">Arrival Port</div>
                    <div class="cruise-info-value">${cruiseData.arrivalPort || 'N/A'}</div>
                </div>
            `;
        }

        // Show message functions
        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            document.getElementById('error-message').style.display = 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('success-message').style.display = 'none';
        }

        function hideMessages() {
            document.getElementById('success-message').style.display = 'none';
            document.getElementById('error-message').style.display = 'none';
        }

        // Handle form submission
        document.getElementById('quoteForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const quoteForm = document.getElementById('quote-form');
            
            // Get form data
            const formData = new FormData(this);
            const clientName = formData.get('clientName');
            const clientEmail = formData.get('clientEmail');
            const clientPhone = formData.get('clientPhone');
            const interiorCabins = formData.get('interiorCabins');
            const oceanviewCabins = formData.get('oceanviewCabins');
            const balconyCabins = formData.get('balconyCabins');
            const suiteCabins = formData.get('suiteCabins');
            const specialRequests = formData.get('specialRequests');

            // Validate required fields
            if (!clientName || !clientEmail) {
                showError('Please fill in all required fields.');
                return;
            }

            // Check if at least one cabin is selected
            const totalCabins = parseInt(interiorCabins || 0) + parseInt(oceanviewCabins || 0) + 
                              parseInt(balconyCabins || 0) + parseInt(suiteCabins || 0);
            
            if (totalCabins === 0) {
                showError('Please select at least one cabin.');
                return;
            }

            try {
                hideMessages();
                submitBtn.disabled = true;
                quoteForm.style.display = 'none';
                loading.style.display = 'block';

                // Prepare quote request data
                const quoteRequest = {
                    // Cruise details
                    cruiseDetails: cruiseData,
                    
                    // Client information
                    clientName: clientName,
                    clientEmail: clientEmail,
                    clientPhone: clientPhone,
                    
                    // Cabin requirements
                    cabinRequirements: {
                        interior: parseInt(interiorCabins || 0),
                        oceanview: parseInt(oceanviewCabins || 0),
                        balcony: parseInt(balconyCabins || 0),
                        suite: parseInt(suiteCabins || 0)
                    },
                    
                    // Additional information
                    specialRequests: specialRequests,
                    
                    // Metadata
                    timestamp: new Date().toISOString(),
                    source: 'direct_quote_form'
                };

                // Send quote request
                const response = await fetch('/api/send-quote', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(quoteRequest)
                });

                if (!response.ok) {
                    throw new Error('Failed to send quote request');
                }

                const result = await response.json();
                
                loading.style.display = 'none';
                showSuccess('Quote request sent successfully! You will receive a response within 24-48 hours.');
                
                // Reset form after successful submission
                setTimeout(() => {
                    this.reset();
                    document.querySelectorAll('.cabin-input input').forEach(input => input.value = '0');
                }, 2000);

            } catch (error) {
                console.error('Quote request error:', error);
                loading.style.display = 'none';
                quoteForm.style.display = 'block';
                showError('Failed to send quote request. Please try again or contact us directly.');
            } finally {
                submitBtn.disabled = false;
            }
        });

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            populateCruiseDetails();
            
            // If no cruise data, show a message
            if (!cruiseData.dealId) {
                showError('No cruise data found. Please return to the deals page and select a cruise.');
            }
        });
    </script>
</body>
</html>
