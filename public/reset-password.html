<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your Interline Asia password securely">
  <title>Reset Password - Interline Asia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="/css/main.css">
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FYGT92WCXC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FYGT92WCXC');
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
</head>
<body>
  <div id="header-placeholder"></div>
  
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Reset Your Password</h1>
        <p>Enter your new password below</p>
      </div>

      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>

      <!-- Reset Token Form -->
      <form id="reset-form" style="display: none;">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" name="newPassword" required minlength="8">
          <small>Password must be at least 8 characters long</small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required>
        </div>

        <!-- Cloudflare Turnstile for password update -->
        <div class="cf-turnstile" data-sitekey="0x4AAAAAABkLNMf0cRO37SRL" data-callback="onTurnstileSuccessReset" style="margin: 1rem 0;"></div>
        <input type="hidden" id="cf-turnstile-response-reset" name="cf-turnstile-response" />

        <button type="submit" class="btn btn-primary" id="reset-btn" disabled>Update Password</button>
      </form>

      <!-- Request Reset Form -->
      <form id="request-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
          <small>Enter your email to receive reset instructions</small>
        </div>

        <!-- Cloudflare Turnstile for reset request -->
        <div class="cf-turnstile" data-sitekey="0x4AAAAAABkLNMf0cRO37SRL" data-callback="onTurnstileSuccessRequest" style="margin: 1rem 0;"></div>
        <input type="hidden" id="cf-turnstile-response-request" name="cf-turnstile-response" />

        <button type="submit" class="btn btn-primary" id="request-btn" disabled>Send Reset Instructions</button>
      </form>

      <div class="auth-links">
        <p>Remember your password? <a href="login.html">Sign in here</a></p>
        <p><a href="index.html">← Back to Home</a></p>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="/js/loadPartials.js" defer></script>
  <script>
    // Check URL parameters for reset token
    const urlParams = new URLSearchParams(window.location.search);
    const resetToken = urlParams.get('token');
    const resetEmail = urlParams.get('email');

    if (resetToken && resetEmail) {
      // Show reset form
      document.getElementById('reset-form').style.display = 'block';
      document.getElementById('request-form').style.display = 'none';
      document.querySelector('.auth-header p').textContent = `Reset password for ${resetEmail}`;
    }

    // Handle password reset form
    document.getElementById('reset-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      hideError();
      hideSuccess();
      
      const submitButton = this.querySelector('button[type="submit"]');
      const originalText = submitButton.textContent;
      submitButton.textContent = 'Updating Password...';
      submitButton.disabled = true;
      
      try {
        const formData = new FormData(this);
        const newPassword = formData.get('newPassword');
        const confirmPassword = formData.get('confirmPassword');
        
        if (newPassword.length < 8) {
          throw new Error('Password must be at least 8 characters long');
        }
        
        if (newPassword !== confirmPassword) {
          throw new Error('Passwords do not match');
        }

        // Cloudflare Turnstile validation
        const turnstileToken = document.getElementById('cf-turnstile-response-reset').value;
        
        if (!turnstileToken) {
          throw new Error('Security verification failed. Please complete the verification and try again.');
        }

        // Update password with Supabase
        const { data, error } = await window.supabaseClient.supabase.auth.updateUser({
          password: newPassword
        });

        if (error) throw error;

        // Track successful password reset
        gtag('event', 'password_reset_success', {
          method: 'email'
        });

        showSuccess('Password updated successfully! Redirecting to login...');
        
        // Redirect to login after 2 seconds
        setTimeout(() => {
          window.location.href = 'login.html?reset=success';
        }, 2000);
        
      } catch (error) {
        console.error('Password reset error:', error);
        showError(error.message || 'Failed to reset password. Please try again.');
      } finally {
        submitButton.textContent = originalText;
        submitButton.disabled = false;
      }
    });

    // Handle request reset form
    document.getElementById('request-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      hideError();
      hideSuccess();
      
      const submitButton = this.querySelector('button[type="submit"]');
      const originalText = submitButton.textContent;
      submitButton.textContent = 'Sending Instructions...';
      submitButton.disabled = true;
      
      try {
        const formData = new FormData(this);
        const email = formData.get('email').trim().toLowerCase();
        
        if (!email) {
          throw new Error('Please enter your email address');
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          throw new Error('Please enter a valid email address');
        }

        // Cloudflare Turnstile validation
        const turnstileToken = document.getElementById('cf-turnstile-response-request').value;
        
        if (!turnstileToken) {
          throw new Error('Security verification failed. Please complete the verification and try again.');
        }

        // Send reset request using Supabase
        await window.supabaseClient.resetPasswordForEmail(email);

        // Track password reset request
        gtag('event', 'password_reset_request', {
          method: 'email'
        });

        showSuccess('Reset instructions sent! Check your email for next steps.');
        
        // Clear form
        this.reset();
        
      } catch (error) {
        console.error('Reset request error:', error);
        showError(error.message || 'Failed to send reset instructions. Please try again.');
      } finally {
        submitButton.textContent = originalText;
        submitButton.disabled = false;
      }
    });

    // Cloudflare Turnstile callbacks
    function onTurnstileSuccessReset(token) {
      const hiddenInput = document.getElementById('cf-turnstile-response-reset');
      if (hiddenInput) {
        hiddenInput.value = token;
        document.getElementById('reset-btn').disabled = false;
        console.log('Turnstile verification successful for password reset');
      }
    }

    function onTurnstileSuccessRequest(token) {
      const hiddenInput = document.getElementById('cf-turnstile-response-request');
      if (hiddenInput) {
        hiddenInput.value = token;
        document.getElementById('request-btn').disabled = false;
        console.log('Turnstile verification successful for reset request');
      }
    }
  </script>
</body>
</html>
