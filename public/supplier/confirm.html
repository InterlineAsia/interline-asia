<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier Confirmation - Interline Asia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      min-height: 100vh;
    }
    
    .confirmation-card {
      background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(226, 232, 240, 0.5);
    }
    
    .success-animation {
      animation: successPulse 2s ease-in-out infinite;
    }
    
    @keyframes successPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-200 min-h-screen">
  
  <!-- Main Container -->
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-slate-800 mb-3">
        <i class="ri-ship-line mr-3 text-orange-500"></i>Interline Asia
      </h1>
      <p class="text-xl text-slate-600">Supplier Booking Confirmation Portal</p>
    </div>
    
    <!-- Loading State -->
    <div id="loading-state" class="confirmation-card p-8 text-center">
      <div class="animate-spin w-12 h-12 border-4 border-orange-500 border-t-transparent rounded-full mx-auto mb-4"></div>
      <p class="text-slate-600">Loading booking details...</p>
    </div>
    
    <!-- Booking Details -->
    <div id="booking-details" class="hidden">
      <div class="confirmation-card p-8 mb-8">
        <h2 class="text-2xl font-bold text-slate-800 mb-6">
          <i class="ri-file-list-line mr-2 text-orange-500"></i>Booking Request Details
        </h2>
        <div id="booking-info">
          <!-- Will be populated by JavaScript -->
        </div>
      </div>
      
      <!-- Confirmation Form -->
      <div id="confirmation-form" class="confirmation-card p-8">
        <h2 class="text-2xl font-bold text-slate-800 mb-6">
          <i class="ri-checkbox-line mr-2 text-orange-500"></i>Supplier Response
        </h2>
        
        <div class="space-y-6">
          <!-- Action Selection -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-3">Select Action:</label>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <label class="flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-green-500 transition-colors">
                <input type="radio" name="action" value="confirm" class="mr-3 text-green-500">
                <div>
                  <div class="font-semibold text-green-600">✅ Able to Confirm</div>
                  <div class="text-sm text-slate-600">I can provide this booking at industry rates</div>
                </div>
              </label>
              
              <label class="flex items-center p-4 border-2 border-slate-200 rounded-xl cursor-pointer hover:border-red-500 transition-colors">
                <input type="radio" name="action" value="decline" class="mr-3 text-red-500">
                <div>
                  <div class="font-semibold text-red-600">❌ Unable to Confirm</div>
                  <div class="text-sm text-slate-600">I cannot provide this booking</div>
                </div>
              </label>
            </div>
          </div>
          
          <!-- Confirmation Details (shown when confirming) -->
          <div id="confirm-details" class="hidden space-y-4">
            <div class="bg-green-50 border border-green-200 rounded-xl p-4">
              <h4 class="font-semibold text-green-800 mb-3">Booking Confirmation Details</h4>
              
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-semibold text-slate-700 mb-2">Cabin Number *</label>
                  <input type="text" id="cabin-number" placeholder="e.g., 7042" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors">
                </div>
                
                <div>
                  <label class="block text-sm font-semibold text-slate-700 mb-2">Official Booking Number *</label>
                  <input type="text" id="booking-number" placeholder="e.g., RC123456789" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors">
                </div>
                
                <div>
                  <label class="block text-sm font-semibold text-slate-700 mb-2">Total Payment Amount *</label>
                  <input type="number" id="payment-amount" placeholder="e.g., 2500.00" step="0.01" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors">
                </div>
                
                <div>
                  <label class="block text-sm font-semibold text-slate-700 mb-2">Currency</label>
                  <select id="currency" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors">
                    <option value="USD">USD</option>
                    <option value="AUD">AUD</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                  </select>
                </div>
              </div>
              
              <div class="mt-4">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Payment Instructions</label>
                <textarea id="payment-instructions" rows="3" placeholder="e.g., Payment due within 7 days. Wire transfer details will be provided separately." class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors"></textarea>
              </div>
            </div>
          </div>
          
          <!-- Decline Reason (shown when declining) -->
          <div id="decline-details" class="hidden">
            <div class="bg-red-50 border border-red-200 rounded-xl p-4">
              <h4 class="font-semibold text-red-800 mb-3">Decline Reason</h4>
              <textarea id="decline-reason" rows="3" placeholder="Optional: Provide a reason for declining this booking request..." class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:border-red-500 transition-colors"></textarea>
            </div>
          </div>
          
          <!-- Submit Button -->
          <div class="text-center">
            <button id="submit-response" onclick="submitResponse()" disabled class="px-8 py-3 bg-orange-500 hover:bg-orange-600 text-white rounded-lg font-medium transition-colors disabled:bg-slate-300 disabled:cursor-not-allowed">
              <i class="ri-send-plane-line mr-2"></i>Submit Response
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Success State -->
    <div id="success-state" class="hidden confirmation-card p-8 text-center">
      <div class="success-animation mb-6">
        <div class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center mx-auto">
          <i class="ri-check-line text-3xl text-white"></i>
        </div>
      </div>
      <h2 class="text-2xl font-bold text-slate-800 mb-4">Response Submitted!</h2>
      <p class="text-slate-600 mb-6">
        Your response has been recorded and the customer will be notified automatically.
      </p>
      <div id="response-summary" class="bg-slate-50 rounded-lg p-4">
        <!-- Response summary will be populated -->
      </div>
    </div>
    
    <!-- Error State -->
    <div id="error-state" class="hidden confirmation-card p-8 text-center">
      <div class="w-20 h-20 bg-red-500 rounded-full flex items-center justify-center mx-auto mb-6">
        <i class="ri-error-warning-line text-3xl text-white"></i>
      </div>
      <h2 class="text-2xl font-bold text-slate-800 mb-4">Error</h2>
      <p id="error-message" class="text-slate-600 mb-6"></p>
      <button onclick="window.location.reload()" class="px-6 py-3 bg-orange-500 hover:bg-orange-600 text-white rounded-lg font-medium transition-colors">
        Try Again
      </button>
    </div>
  </div>

  <script>
    let bookingData = null;
    let referenceNumber = null;
    let action = null;
    
    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    referenceNumber = urlParams.get('ref');
    action = urlParams.get('action');
    
    // Initialize Supabase client
    let supabaseClient = null;
    
    async function initializeSupabase() {
      try {
        const supabaseUrl = window.SUPABASE_URL;
        const supabaseAnonKey = window.SUPABASE_ANON_KEY;
        
        if (!supabaseUrl || !supabaseAnonKey) {
          throw new Error('Supabase configuration missing');
        }
        
        const { createClient } = supabase;
        supabaseClient = createClient(supabaseUrl, supabaseAnonKey);
        
        return true;
      } catch (error) {
        console.error('Supabase initialization failed:', error);
        return false;
      }
    }
    
    // Load booking data
    async function loadBookingData() {
      try {
        if (!referenceNumber) {
          throw new Error('No reference number provided');
        }
        
        // Fetch booking from database
        const { data: booking, error } = await supabaseClient
          .from('bookings')
          .select(`
            *,
            passengers (*)
          `)
          .eq('reference_number', referenceNumber)
          .single();
        
        if (error) throw error;
        if (!booking) throw new Error('Booking not found');
        
        bookingData = booking;
        displayBookingDetails();
        
        // Pre-select action if provided in URL
        if (action) {
          const actionRadio = document.querySelector(`input[name="action"][value="${action}"]`);
          if (actionRadio) {
            actionRadio.checked = true;
            handleActionChange();
          }
        }
        
        // Show booking details
        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('booking-details').classList.remove('hidden');
        
      } catch (error) {
        console.error('Error loading booking:', error);
        showError(error.message);
      }
    }
    
    // Display booking details
    function displayBookingDetails() {
      const bookingInfoDiv = document.getElementById('booking-info');
      const passengers = bookingData.passengers || [];
      const passenger1 = passengers.find(p => p.passenger_number === 1) || {};
      const passenger2 = passengers.find(p => p.passenger_number === 2) || {};
      
      bookingInfoDiv.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
          <!-- Cruise Details -->
          <div>
            <h3 class="text-lg font-semibold text-slate-800 mb-4">🛳️ Cruise Information</h3>
            <div class="space-y-3 text-sm">
              <div class="flex justify-between">
                <span class="text-slate-600">Reference:</span>
                <span class="font-medium">${bookingData.reference_number}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-600">Cruise Line:</span>
                <span class="font-medium">${bookingData.cruise_line}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-600">Ship:</span>
                <span class="font-medium">${bookingData.ship_name}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-600">Departure:</span>
                <span class="font-medium">${bookingData.departure_date}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-600">Duration:</span>
                <span class="font-medium">${bookingData.nights} nights</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-600">Region:</span>
                <span class="font-medium">${bookingData.region}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-600">Cabin Type:</span>
                <span class="font-medium">${bookingData.cabin_type.charAt(0).toUpperCase() + bookingData.cabin_type.slice(1)}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-600">Status:</span>
                <span class="font-medium text-orange-600">${bookingData.status.charAt(0).toUpperCase() + bookingData.status.slice(1)}</span>
              </div>
            </div>
          </div>
          
          <!-- Passenger Details -->
          <div>
            <h3 class="text-lg font-semibold text-slate-800 mb-4">👥 Passenger Information</h3>
            
            <div class="space-y-4">
              <div class="bg-slate-50 rounded-lg p-4">
                <h4 class="font-medium text-slate-800 mb-2">Passenger 1 (Primary)</h4>
                <div class="text-sm space-y-1">
                  <p><strong>Name:</strong> ${passenger1.full_name || 'N/A'}</p>
                  <p><strong>Email:</strong> ${passenger1.email || 'N/A'}</p>
                  <p><strong>Phone:</strong> ${passenger1.mobile || 'N/A'}</p>
                  <p><strong>DOB:</strong> ${passenger1.date_of_birth || 'N/A'}</p>
                  <p><strong>Nationality:</strong> ${passenger1.nationality || 'N/A'}</p>
                </div>
              </div>
              
              <div class="bg-slate-50 rounded-lg p-4">
                <h4 class="font-medium text-slate-800 mb-2">Passenger 2</h4>
                <div class="text-sm space-y-1">
                  <p><strong>Name:</strong> ${passenger2.full_name || 'N/A'}</p>
                  <p><strong>Email:</strong> ${passenger2.email || 'N/A'}</p>
                  <p><strong>Phone:</strong> ${passenger2.mobile || 'N/A'}</p>
                  <p><strong>DOB:</strong> ${passenger2.date_of_birth || 'N/A'}</p>
                  <p><strong>Nationality:</strong> ${passenger2.nationality || 'N/A'}</p>
                </div>
              </div>
            </div>
            
            <div class="mt-4 bg-green-50 border border-green-200 rounded-lg p-3">
              <p class="text-sm text-green-700">
                <i class="ri-shield-check-line mr-1"></i>
                All passengers are verified travel industry professionals with uploaded documentation.
              </p>
            </div>
          </div>
        </div>
      `;
    }
    
    // Handle action change
    function handleActionChange() {
      const selectedAction = document.querySelector('input[name="action"]:checked')?.value;
      const confirmDetails = document.getElementById('confirm-details');
      const declineDetails = document.getElementById('decline-details');
      const submitBtn = document.getElementById('submit-response');
      
      if (selectedAction === 'confirm') {
        confirmDetails.classList.remove('hidden');
        declineDetails.classList.add('hidden');
        submitBtn.disabled = false;
      } else if (selectedAction === 'decline') {
        confirmDetails.classList.add('hidden');
        declineDetails.classList.remove('hidden');
        submitBtn.disabled = false;
      } else {
        confirmDetails.classList.add('hidden');
        declineDetails.classList.add('hidden');
        submitBtn.disabled = true;
      }
    }
    
    // Submit response
    async function submitResponse() {
      const selectedAction = document.querySelector('input[name="action"]:checked')?.value;
      const submitBtn = document.getElementById('submit-response');
      
      if (!selectedAction) {
        alert('Please select an action');
        return;
      }
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="ri-loader-4-line animate-spin mr-2"></i>Submitting...';
      
      try {
        let updateData = {
          status: selectedAction === 'confirm' ? 'confirmed' : 'declined',
          updated_at: new Date().toISOString()
        };
        
        if (selectedAction === 'confirm') {
          const cabinNumber = document.getElementById('cabin-number').value;
          const bookingNumber = document.getElementById('booking-number').value;
          const paymentAmount = document.getElementById('payment-amount').value;
          const currency = document.getElementById('currency').value;
          const paymentInstructions = document.getElementById('payment-instructions').value;
          
          if (!cabinNumber || !bookingNumber || !paymentAmount) {
            alert('Please fill in all required confirmation details');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="ri-send-plane-line mr-2"></i>Submit Response';
            return;
          }
          
          updateData = {
            ...updateData,
            cabin_number: cabinNumber,
            official_booking_number: bookingNumber,
            payment_amount: parseFloat(paymentAmount),
            payment_instructions: paymentInstructions || 'Payment instructions will be provided separately.',
            confirmed_at: new Date().toISOString()
          };
        } else {
          const declineReason = document.getElementById('decline-reason').value;
          updateData = {
            ...updateData,
            supplier_response: declineReason || 'No reason provided',
            declined_at: new Date().toISOString()
          };
        }
        
        // Update booking in database
        const { error } = await supabaseClient
          .from('bookings')
          .update(updateData)
          .eq('reference_number', referenceNumber);
        
        if (error) throw error;
        
        // Send notification emails via BookingBot
        try {
          await fetch('/api/bot-webhook', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              botType: 'booking',
              action: 'supplier_response',
              data: {
                referenceNumber: referenceNumber,
                action: selectedAction,
                responseData: selectedAction === 'confirm' ? {
                  cabinNumber: document.getElementById('cabin-number').value,
                  bookingNumber: document.getElementById('booking-number').value,
                  paymentAmount: document.getElementById('payment-amount').value,
                  paymentInstructions: document.getElementById('payment-instructions').value
                } : {
                  reason: document.getElementById('decline-reason').value
                }
              }
            })
          });
        } catch (error) {
          console.error('BookingBot notification failed, using fallback:', error);
          await sendNotificationEmails(selectedAction, updateData);
        }
        
        // Show success state
        showSuccess(selectedAction, updateData);
        
      } catch (error) {
        console.error('Error submitting response:', error);
        alert('Error submitting response. Please try again.');
        
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="ri-send-plane-line mr-2"></i>Submit Response';
      }
    }
    
    // Send notification emails
    async function sendNotificationEmails(action, updateData) {
      try {
        await fetch('/api/send-supplier-response-emails', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            referenceNumber: referenceNumber,
            action: action,
            updateData: updateData,
            bookingData: bookingData
          })
        });
      } catch (error) {
        console.error('Email notification failed:', error);
        // Don't fail the response if emails fail
      }
    }
    
    // Show success state
    function showSuccess(action, updateData) {
      const summaryDiv = document.getElementById('response-summary');
      
      if (action === 'confirm') {
        summaryDiv.innerHTML = `
          <div class="text-left">
            <h4 class="font-semibold text-green-800 mb-2">✅ Booking Confirmed</h4>
            <p class="text-sm text-slate-600 mb-3">The customer will receive confirmation details including:</p>
            <ul class="text-sm text-slate-600 space-y-1">
              <li>• Cabin Number: ${updateData.cabin_number}</li>
              <li>• Booking Number: ${updateData.official_booking_number}</li>
              <li>• Payment Amount: $${updateData.payment_amount}</li>
              <li>• Payment Instructions</li>
            </ul>
          </div>
        `;
      } else {
        summaryDiv.innerHTML = `
          <div class="text-left">
            <h4 class="font-semibold text-red-800 mb-2">❌ Booking Declined</h4>
            <p class="text-sm text-slate-600">The customer and admin team have been notified of the decline.</p>
          </div>
        `;
      }
      
      document.getElementById('booking-details').classList.add('hidden');
      document.getElementById('success-state').classList.remove('hidden');
    }
    
    // Show error state
    function showError(message) {
      document.getElementById('error-message').textContent = message;
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('error-state').classList.remove('hidden');
    }
    
    // Add event listeners
    document.addEventListener('DOMContentLoaded', async function() {
      const supabaseReady = await initializeSupabase();
      if (supabaseReady) {
        await loadBookingData();
      } else {
        showError('System configuration error. Please contact support.');
      }
      
      // Add action change listeners
      document.querySelectorAll('input[name="action"]').forEach(radio => {
        radio.addEventListener('change', handleActionChange);
      });
    });
  </script>
</body>
</html>
