<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import CSV Deals to Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .step { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffe6e6; border: 1px solid #ff9999; }
        .success { background: #e6ffe6; border: 1px solid #99ff99; }
        .info { background: #e6f3ff; border: 1px solid #99ccff; }
        .warning { background: #fff3cd; border: 1px solid #ffeaa7; }
        button { padding: 10px 20px; font-size: 16px; background: #007cba; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .progress { width: 100%; background: #f0f0f0; border-radius: 5px; margin: 10px 0; }
        .progress-bar { height: 20px; background: #007cba; border-radius: 5px; transition: width 0.3s; }
    </style>
</head>
<body>
    <h1>🚢 Import Real Cruise Deals from JSON Files</h1>
    
    <div class="step warning">
        <strong>⚠️ Important:</strong> This will import hundreds of real cruise deals from your JSON files into Supabase. 
        This will replace the sample data with actual cruise inventory.
    </div>
    
    <button onclick="startImport()" id="importBtn">🚀 Start Import Process</button>
    <button onclick="clearAllDeals()" id="clearBtn">🗑️ Clear All Deals First</button>
    
    <div class="progress" id="progressContainer" style="display: none;">
        <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
    </div>
    
    <div id="results"></div>

    <script>
        let totalDeals = 0;
        let processedDeals = 0;

        function log(message, type = 'info') {
            const output = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `step ${type}`;
            div.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
            output.appendChild(div);
            console.log(message);
        }

        function updateProgress(current, total) {
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            
            progressContainer.style.display = 'block';
            const percentage = (current / total) * 100;
            progressBar.style.width = percentage + '%';
            progressBar.textContent = `${current}/${total} (${Math.round(percentage)}%)`;
        }

        async function getSupabaseClient() {
            const supabaseUrl = window.SUPABASE_URL;
            const supabaseAnonKey = window.SUPABASE_ANON_KEY;
            
            if (!supabaseUrl || !supabaseAnonKey) {
                throw new Error('Supabase configuration missing');
            }
            
            const { createClient } = supabase;
            return createClient(supabaseUrl, supabaseAnonKey);
        }

        async function clearAllDeals() {
            if (!confirm('Are you sure you want to delete ALL existing deals? This cannot be undone.')) {
                return;
            }
            
            try {
                log('🗑️ Clearing all existing deals...', 'info');
                const supabaseClient = await getSupabaseClient();
                
                const { error } = await supabaseClient
                    .from('deals')
                    .delete()
                    .neq('id', 0); // Delete all rows
                
                if (error) {
                    log(`❌ Error clearing deals: ${error.message}`, 'error');
                } else {
                    log('✅ All existing deals cleared successfully!', 'success');
                }
            } catch (error) {
                log(`❌ Clear failed: ${error.message}`, 'error');
            }
        }

        async function loadJsonFile(filename) {
            try {
                const response = await fetch(`/data/${filename}`);
                if (!response.ok) {
                    throw new Error(`Failed to load ${filename}: ${response.status}`);
                }
                const data = await response.json();
                return data;
            } catch (error) {
                log(`❌ Error loading ${filename}: ${error.message}`, 'error');
                return null;
            }
        }

        function convertDealFormat(deal) {
            // Convert the JSON deal format to Supabase table format
            return {
                cruise_line: deal.cruiseLine || deal.cruise_line || 'Unknown',
                ship_name: deal.shipName || deal.ship_name || 'Unknown Ship',
                cruise_name: deal.cruiseName || deal.cruise_name || deal.title || 'Cruise',
                departure_date: deal.departureDate || deal.departure_date || null,
                return_date: deal.returnDate || deal.return_date || null,
                price: parseInt(deal.price || deal.insidePrice || deal.startingPrice || 0),
                cabin_type: deal.cabinType || deal.cabin_type || 'Interior',
                category: deal.category || 'standard',
                itinerary: deal.itinerary || deal.ports || deal.description || '',
                region: deal.region || deal.destination || 'Other',
                duration: parseInt(deal.duration || deal.nights || deal.days || 7),
                description: deal.description || deal.highlights || `${deal.cruise_line || 'Cruise'} voyage`
            };
        }

        async function startImport() {
            const importBtn = document.getElementById('importBtn');
            const clearBtn = document.getElementById('clearBtn');
            
            importBtn.disabled = true;
            clearBtn.disabled = true;
            
            try {
                log('🚀 Starting cruise deals import process...', 'info');
                
                const supabaseClient = await getSupabaseClient();
                log('✅ Supabase client connected', 'success');
                
                // Load all JSON files
                const jsonFiles = [];
                for (let i = 1; i <= 25; i++) {
                    jsonFiles.push(`cruise-deals-${i}.json`);
                }
                
                log(`📂 Loading ${jsonFiles.length} JSON files...`, 'info');
                
                let allDeals = [];
                let filesLoaded = 0;
                
                for (const filename of jsonFiles) {
                    const data = await loadJsonFile(filename);
                    if (data) {
                        if (Array.isArray(data)) {
                            allDeals = allDeals.concat(data);
                        } else if (data.deals && Array.isArray(data.deals)) {
                            allDeals = allDeals.concat(data.deals);
                        } else {
                            log(`⚠️ ${filename} has unexpected format`, 'warning');
                        }
                        filesLoaded++;
                        updateProgress(filesLoaded, jsonFiles.length);
                    }
                }
                
                log(`📊 Loaded ${allDeals.length} deals from ${filesLoaded} files`, 'success');
                
                if (allDeals.length === 0) {
                    log('❌ No deals found in JSON files', 'error');
                    return;
                }
                
                // Convert deals to Supabase format
                log('🔄 Converting deals to database format...', 'info');
                const convertedDeals = allDeals.map(convertDealFormat);
                
                // Insert deals in batches (Supabase has limits)
                const batchSize = 100;
                const batches = [];
                for (let i = 0; i < convertedDeals.length; i += batchSize) {
                    batches.push(convertedDeals.slice(i, i + batchSize));
                }
                
                log(`📦 Inserting ${convertedDeals.length} deals in ${batches.length} batches...`, 'info');
                
                let insertedCount = 0;
                for (let i = 0; i < batches.length; i++) {
                    const batch = batches[i];
                    
                    try {
                        const { data, error } = await supabaseClient
                            .from('deals')
                            .insert(batch)
                            .select('id');
                        
                        if (error) {
                            log(`❌ Batch ${i + 1} failed: ${error.message}`, 'error');
                        } else {
                            insertedCount += data.length;
                            updateProgress(insertedCount, convertedDeals.length);
                            log(`✅ Batch ${i + 1}/${batches.length}: ${data.length} deals inserted`, 'success');
                        }
                    } catch (batchError) {
                        log(`❌ Batch ${i + 1} exception: ${batchError.message}`, 'error');
                    }
                    
                    // Small delay to avoid rate limiting
                    await new Promise(resolve => setTimeout(resolve, 100));
                }
                
                log(`🎉 Import completed! ${insertedCount} deals successfully imported`, 'success');
                log('🔄 Refresh the deals page to see all the real cruise deals!', 'info');
                
            } catch (error) {
                log(`❌ Import failed: ${error.message}`, 'error');
            } finally {
                importBtn.disabled = false;
                clearBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
