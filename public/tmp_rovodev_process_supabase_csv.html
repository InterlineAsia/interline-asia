<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process CSV Files from Supabase Storage</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .step { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffe6e6; border: 1px solid #ff9999; }
        .success { background: #e6ffe6; border: 1px solid #99ff99; }
        .info { background: #e6f3ff; border: 1px solid #99ccff; }
        .warning { background: #fff3cd; border: 1px solid #ffeaa7; }
        button { padding: 10px 20px; font-size: 16px; background: #007cba; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .progress { width: 100%; background: #f0f0f0; border-radius: 5px; margin: 10px 0; }
        .progress-bar { height: 20px; background: #007cba; border-radius: 5px; transition: width 0.3s; }
    </style>
</head>
<body>
    <h1>📊 Process CSV Files from Supabase Storage</h1>
    
    <div class="step info">
        <strong>ℹ️ This tool will:</strong><br>
        1. List CSV files uploaded to Supabase Storage<br>
        2. Download and process each CSV file<br>
        3. Parse cruise deals and insert into deals table<br>
        4. Show real cruise inventory on the deals page
    </div>
    
    <button onclick="listCsvFiles()" id="listBtn">📂 List CSV Files in Storage</button>
    <button onclick="processAllCsvFiles()" id="processBtn" disabled>🚀 Process All CSV Files</button>
    <button onclick="checkDealsTable()" id="checkBtn">🔍 Check Current Deals Count</button>
    
    <div class="progress" id="progressContainer" style="display: none;">
        <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
    </div>
    
    <div id="results"></div>

    <script>
        let csvFiles = [];

        function log(message, type = 'info') {
            const output = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `step ${type}`;
            div.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
            output.appendChild(div);
            console.log(message);
        }

        function updateProgress(current, total) {
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            
            progressContainer.style.display = 'block';
            const percentage = (current / total) * 100;
            progressBar.style.width = percentage + '%';
            progressBar.textContent = `${current}/${total} (${Math.round(percentage)}%)`;
        }

        async function getSupabaseClient() {
            const supabaseUrl = window.SUPABASE_URL;
            const supabaseAnonKey = window.SUPABASE_ANON_KEY;
            
            if (!supabaseUrl || !supabaseAnonKey) {
                throw new Error('Supabase configuration missing');
            }
            
            const { createClient } = supabase;
            return createClient(supabaseUrl, supabaseAnonKey);
        }

        async function listCsvFiles() {
            try {
                log('📂 Listing CSV files in Supabase Storage...', 'info');
                const supabaseClient = await getSupabaseClient();
                
                // List files in the storage bucket
                const { data: files, error } = await supabaseClient.storage
                    .from('csv-uploads')
                    .list('', {
                        limit: 100,
                        offset: 0
                    });
                
                if (error) {
                    log(`❌ Error listing files: ${error.message}`, 'error');
                    return;
                }
                
                // Filter for CSV files
                csvFiles = files.filter(file => 
                    file.name.toLowerCase().endsWith('.csv') && 
                    file.name !== '.emptyFolderPlaceholder'
                );
                
                if (csvFiles.length === 0) {
                    log('❌ No CSV files found in storage', 'error');
                    return;
                }
                
                log(`✅ Found ${csvFiles.length} CSV files:`, 'success');
                csvFiles.forEach((file, index) => {
                    log(`${index + 1}. ${file.name} (${Math.round(file.metadata?.size / 1024)}KB, uploaded: ${new Date(file.created_at).toLocaleString()})`, 'info');
                });
                
                document.getElementById('processBtn').disabled = false;
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function checkDealsTable() {
            try {
                log('🔍 Checking current deals in database...', 'info');
                const supabaseClient = await getSupabaseClient();
                
                const { data, error, count } = await supabaseClient
                    .from('deals')
                    .select('*', { count: 'exact' })
                    .limit(5);
                
                if (error) {
                    log(`❌ Error checking deals: ${error.message}`, 'error');
                    return;
                }
                
                log(`📊 Current deals in database: ${count || 0}`, count > 0 ? 'success' : 'warning');
                
                if (data && data.length > 0) {
                    log('📋 Sample deals:', 'info');
                    data.forEach(deal => {
                        log(`- ${deal.cruise_line}: ${deal.cruise_name} (${deal.departure_date}) - $${deal.price}`, 'info');
                    });
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        function parseCSV(csvText) {
            const lines = csvText.split('\n');
            const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
            const deals = [];
            
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                const values = line.split(',').map(v => v.trim().replace(/"/g, ''));
                if (values.length < headers.length) continue;
                
                const deal = {};
                headers.forEach((header, index) => {
                    deal[header] = values[index] || '';
                });
                
                // Convert to standard format
                const standardDeal = {
                    cruise_line: deal['Cruise Line'] || deal['cruise_line'] || deal['CruiseLine'] || 'Unknown',
                    ship_name: deal['Ship Name'] || deal['ship_name'] || deal['Ship'] || 'Unknown Ship',
                    cruise_name: deal['Cruise Name'] || deal['cruise_name'] || deal['Title'] || 'Cruise',
                    departure_date: deal['Departure Date'] || deal['departure_date'] || deal['Date'] || null,
                    return_date: deal['Return Date'] || deal['return_date'] || null,
                    price: parseInt(deal['Price'] || deal['price'] || deal['Cost'] || 0),
                    cabin_type: deal['Cabin Type'] || deal['cabin_type'] || 'Interior',
                    category: deal['Category'] || deal['category'] || 'standard',
                    itinerary: deal['Itinerary'] || deal['itinerary'] || deal['Ports'] || '',
                    region: deal['Region'] || deal['region'] || deal['Destination'] || 'Other',
                    duration: parseInt(deal['Duration'] || deal['duration'] || deal['Nights'] || deal['Days'] || 7),
                    description: deal['Description'] || deal['description'] || `${standardDeal.cruise_line} cruise`
                };
                
                if (standardDeal.cruise_line !== 'Unknown' && standardDeal.price > 0) {
                    deals.push(standardDeal);
                }
            }
            
            return deals;
        }

        async function processAllCsvFiles() {
            const processBtn = document.getElementById('processBtn');
            processBtn.disabled = true;
            
            try {
                log('🚀 Starting CSV processing...', 'info');
                const supabaseClient = await getSupabaseClient();
                
                let totalDeals = 0;
                let processedFiles = 0;
                
                for (const file of csvFiles) {
                    log(`📄 Processing ${file.name}...`, 'info');
                    
                    // Download CSV file content
                    const { data: csvData, error: downloadError } = await supabaseClient.storage
                        .from('csv-uploads')
                        .download(file.name);
                    
                    if (downloadError) {
                        log(`❌ Error downloading ${file.name}: ${downloadError.message}`, 'error');
                        continue;
                    }
                    
                    // Convert blob to text
                    const csvText = await csvData.text();
                    log(`📊 Downloaded ${file.name} (${csvText.length} characters)`, 'success');
                    
                    // Parse CSV content
                    const deals = parseCSV(csvText);
                    log(`🔄 Parsed ${deals.length} deals from ${file.name}`, 'info');
                    
                    if (deals.length > 0) {
                        // Insert deals in batches
                        const batchSize = 100;
                        let insertedCount = 0;
                        
                        for (let i = 0; i < deals.length; i += batchSize) {
                            const batch = deals.slice(i, i + batchSize);
                            
                            const { data: insertedData, error: insertError } = await supabaseClient
                                .from('deals')
                                .insert(batch)
                                .select('id');
                            
                            if (insertError) {
                                log(`❌ Batch insert error: ${insertError.message}`, 'error');
                            } else {
                                insertedCount += insertedData.length;
                                totalDeals += insertedData.length;
                            }
                        }
                        
                        log(`✅ Inserted ${insertedCount} deals from ${file.name}`, 'success');
                    }
                    
                    processedFiles++;
                    updateProgress(processedFiles, csvFiles.length);
                }
                
                log(`🎉 Processing complete! ${totalDeals} total deals imported from ${processedFiles} files`, 'success');
                log('🔄 Refresh the deals page to see all real cruise deals!', 'info');
                
            } catch (error) {
                log(`❌ Processing failed: ${error.message}`, 'error');
            } finally {
                processBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
