<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Deals Data - Supabase Debug</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffe6e6; border: 1px solid #ff9999; }
        .success { background: #e6ffe6; border: 1px solid #99ff99; }
        .info { background: #e6f3ff; border: 1px solid #99ccff; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <h1>🔍 Supabase Deals Data Debug Tool</h1>
    <p>This tool will check all possible tables for cruise deals data.</p>
    
    <button onclick="runDiagnostics()" style="padding: 10px 20px; font-size: 16px; background: #007cba; color: white; border: none; border-radius: 5px; cursor: pointer;">
        🚀 Run Diagnostics
    </button>
    
    <div id="results"></div>

    <script>
        async function runDiagnostics() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="result info">🔄 Running diagnostics...</div>';
            
            try {
                // Initialize Supabase
                const supabaseUrl = window.SUPABASE_URL;
                const supabaseAnonKey = window.SUPABASE_ANON_KEY;
                
                if (!supabaseUrl || !supabaseAnonKey) {
                    throw new Error('Supabase configuration missing');
                }
                
                const { createClient } = supabase;
                const supabaseClient = createClient(supabaseUrl, supabaseAnonKey);
                
                let html = '<div class="result success">✅ Supabase client initialized successfully</div>';
                
                // Test different table names
                const tablesToTest = [
                    'deals',
                    'deals_dashboard', 
                    'cruise_deals',
                    'cruise_deals_dashboard'
                ];
                
                for (const tableName of tablesToTest) {
                    html += `<h3>Testing table: ${tableName}</h3>`;
                    
                    try {
                        const { data, error, count } = await supabaseClient
                            .from(tableName)
                            .select('*', { count: 'exact' })
                            .limit(5);
                        
                        if (error) {
                            html += `<div class="result error">❌ Table "${tableName}": ${error.message}</div>`;
                        } else {
                            html += `<div class="result success">✅ Table "${tableName}" found!</div>`;
                            html += `<div class="result info">📊 Total rows: ${count || 'Unknown'}</div>`;
                            
                            if (data && data.length > 0) {
                                html += `<div class="result info">📋 Sample data (first ${data.length} rows):</div>`;
                                html += `<div class="result"><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
                                
                                // Show column structure
                                const columns = Object.keys(data[0]);
                                html += `<div class="result info">🏗️ Columns: ${columns.join(', ')}</div>`;
                            } else {
                                html += `<div class="result info">📭 Table exists but is empty</div>`;
                            }
                        }
                    } catch (tableError) {
                        html += `<div class="result error">❌ Error testing "${tableName}": ${tableError.message}</div>`;
                    }
                }
                
                // Test if we can insert a sample deal
                html += '<h3>Testing Insert Capability</h3>';
                try {
                    const testDeal = {
                        cruise_line: 'Test Cruise Line',
                        ship_name: 'Test Ship',
                        cruise_name: 'Test Cruise',
                        departure_date: '2024-12-01',
                        price: 1000,
                        region: 'Test Region',
                        duration: 7,
                        itinerary: 'Test Itinerary'
                    };
                    
                    const { data: insertData, error: insertError } = await supabaseClient
                        .from('deals')
                        .insert(testDeal)
                        .select();
                    
                    if (insertError) {
                        html += `<div class="result error">❌ Cannot insert test data: ${insertError.message}</div>`;
                    } else {
                        html += `<div class="result success">✅ Successfully inserted test deal!</div>`;
                        html += `<div class="result info">📋 Inserted data: <pre>${JSON.stringify(insertData, null, 2)}</pre></div>`;
                        
                        // Clean up test data
                        await supabaseClient
                            .from('deals')
                            .delete()
                            .eq('cruise_line', 'Test Cruise Line');
                        
                        html += `<div class="result info">🧹 Test data cleaned up</div>`;
                    }
                } catch (insertTestError) {
                    html += `<div class="result error">❌ Insert test failed: ${insertTestError.message}</div>`;
                }
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="result error">❌ Diagnostic failed: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
