<!DOCTYPE html>
<html>
<head>
    <title>Auth Flow Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
</head>
<body>
    <h1>Authentication Flow Test</h1>
    <div id="results"></div>
    
    <script>
        async function testAuthFlows() {
            const results = document.getElementById('results');
            
            try {
                // Wait for client to be ready
                await window.supabaseClient.readyPromise;
                results.innerHTML += '<p>✅ Supabase client initialized successfully</p>';
                
                // Test if we can access auth methods
                if (typeof window.supabaseClient.signUp === 'function') {
                    results.innerHTML += '<p>✅ signUp method available</p>';
                } else {
                    results.innerHTML += '<p>❌ signUp method missing</p>';
                }
                
                if (typeof window.supabaseClient.signIn === 'function') {
                    results.innerHTML += '<p>✅ signIn method available</p>';
                } else {
                    results.innerHTML += '<p>❌ signIn method missing</p>';
                }
                
                if (typeof window.supabaseClient.resetPasswordForEmail === 'function') {
                    results.innerHTML += '<p>✅ resetPasswordForEmail method available</p>';
                } else {
                    results.innerHTML += '<p>❌ resetPasswordForEmail method missing</p>';
                }
                
                if (typeof window.supabaseClient.uploadFile === 'function') {
                    results.innerHTML += '<p>✅ uploadFile method available</p>';
                } else {
                    results.innerHTML += '<p>❌ uploadFile method missing</p>';
                }
                
                // Test environment variables
                if (window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
                    results.innerHTML += '<p>✅ Environment variables loaded</p>';
                } else {
                    results.innerHTML += '<p>❌ Environment variables missing</p>';
                }
                
            } catch (error) {
                results.innerHTML += `<p>❌ Error: ${error.message}</p>`;
            }
        }
        
        // Run test when page loads
        document.addEventListener('DOMContentLoaded', testAuthFlows);
    </script>
</body>
</html>
